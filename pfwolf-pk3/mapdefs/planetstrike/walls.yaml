# Planet Strike's walls where they differ from Aliens of Gold's (mapdefs/blake/walls.yaml, which
# this pack starts from): the textures at those VSWAP pages are Planet Strike's own. A tile here
# replaces blake's entry for it whole.
walls:
    # Barrier switches as blake's, but each finds its barrier by the x,y in its own object-plane
    # value (bstone's UpdateBarrierTable for Planet Strike), not a map-info tag-link
    '45':    # Switch Active
        North: SWITCHA1
        South: SWITCHA1
        East: SWITCHA2
        West: SWITCHA2
        switch:
            to: 57
            state: on
            sound: bs/switch
            link: object-plane
            actions:
                - A_ToggleActive
                - A_Message("$BS_BARRIEROFF")
    '57':    # Switch Inactive
        North: SWITCHI1
        South: SWITCHI1
        East: SWITCHI2
        West: SWITCHI2
        switch:
            to: 45
            state: off
            sound: bs/switch
            link: object-plane
            actions:
                - A_ToggleActive
                - A_Message("$BS_BARRIERON")
    '3':    # Piping 1
        North: PIPINGA1
        South: PIPINGA1
        East: PIPINGA2
        West: PIPINGA2
    '4':    # Piping 2
