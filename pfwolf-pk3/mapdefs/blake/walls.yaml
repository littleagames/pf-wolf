        East: SPCWALC2
        West: SPCWALC2
    '45':    # Switch Active
        North: SWITCHA1
        South: SWITCHA1
        East: SWITCHA2
        West: SWITCHA2
        switch:
            # A barrier switch, on: throwing it turns its barriers off
            to: 57
            sound: bs/switch
            actions:
                - A_ToggleActive
                - A_Message("$BS_BARRIEROFF")
    '46':    # Biotech Wall 1
        North: BIOWALA1
        South: BIOWALA1
        East: BIOWALA2
        West: BIOWALA2
