# Walls by map tile number (see mapdefs/wolf3d/walls.yaml). As in Wolf3D, wall n's north and
# south faces are VSWAP wall page 2(n-1) and its east and west faces the darker page after it.
# Blake Stone's maps use walls 1 to 63. The barrier switches (45 on, 57 off) and food units (15,
# 18), the elevator panel (21) and teleporters (32) work as in bstone.
walls:
    '1':    # Prison Wall
        North: PRIWALA1
        South: PRIWALA1
        East: PRIWALA2
        West: PRIWALA2
    '2':    # Prison Wall w/ Windows
        North: PRIWALB1
        South: PRIWALB1
        East: PRIWALB2
        West: PRIWALB2
    '3':    # Red Brick
        North: RBRICKA1
        South: RBRICKA1
        East: RBRICKA2
        West: RBRICKA2
    '4':    # Red Brick (Variation)
        North: RBRICKB1
        South: RBRICKB1
        East: RBRICKB2
        West: RBRICKB2
    '5':    # Red Brick w/ Blood
        North: RBRKBLD1
        South: RBRKBLD1
        East: RBRKBLD2
        West: RBRKBLD2
    '6':    # Prison Wall w/ Blood
        North: PRIBLDA1
        South: PRIBLDA1
        East: PRIBLDA2
        West: PRIBLDA2
    '7':    # Gray Brick
        North: GBRICKA1
        South: GBRICKA1
        East: GBRICKA2
        West: GBRICKA2
    '8':    # Gray Brick (Variation)
        North: GBRICKB1
        South: GBRICKB1
        East: GBRICKB2
        West: GBRICKB2
    '9':    # Prison Vent
        North: PRIVENA1
        South: PRIVENA1
        East: PRIVENA2
        West: PRIVENA2
    '10':    # Prison Wall w/ Light
        North: PRILITE1
        South: PRILITE1
        East: PRILITE2
        West: PRILITE2
    '11':    # Institute Wall w/ Light
        North: INSLITE1
        South: INSLITE1
        East: INSLITE2
        West: INSLITE2
    '12':    # Institute Wall 1
        North: INSWALA1
        South: INSWALA1
        East: INSWALA2
        West: INSWALA2
    '13':    # Teleporter Wall
        North: TELEWAL1
        South: TELEWAL1
        East: TELEWAL2
        West: TELEWAL2
    '14':    # Prison Wall Span
        North: PRISPAN1
        South: PRISPAN1
        East: PRISPAN2
        West: PRISPAN2
    '15':    # Food Unit (Beverage)
        North: FOODBEV1
        South: FOODBEV1
        East: FOODBEV2
        West: FOODBEV2
        switch:
            # A drink for a food token: 7 health (bstone's beverage unit). Its object-plane value 0xFCnn
            # (252) gives it nn uses; anything else and it's out of order, as in bstone
            actions:
                - A_Vend("FoodToken", "FoodUnitDrink", "$BS_NOTOKENS", "$BS_NOTHUNGRY", "$BS_OUTOFORDER", 252)
    '16':    # Metal Wall w/ Panel 1
        North: METPNLA1
        South: METPNLA1
        East: METPNLA2
        West: METPNLA2
    '17':    # Computer Console
        North: COMPCON1
        South: COMPCON1
        East: COMPCON2
        West: COMPCON2
    '18':    # Food Unit (Snack)
        North: FOODSNK1
        South: FOODSNK1
        East: FOODSNK2
        West: FOODSNK2
        switch:
            # A snack for a food token: 10 health (bstone's food unit); uses as wall 15's
            actions:
                - A_Vend("FoodToken", "FoodUnitSnack", "$BS_NOTOKENS", "$BS_NOTHUNGRY", "$BS_OUTOFORDER", 252)
    '19':    # Metal Wall w/ Lights
        North: METLITE1
        South: METLITE1
        East: METLITE2
        West: METLITE2
    '20':    # Metal Wall
        North: METWALL1
        South: METWALL1
        East: METWALL2
        West: METWALL2
    '21':    # Elevator Wall w/ Emblem
        North: ELEVEMBL
        South: ELEVEMBL
        East: ELEVPANL
        West: ELEVPANL
        switch:
            # The elevator's panel (its east and west faces): the floor-select screen (elevator.yaml)
            sides: [east, west]
            actions:
                - A_FloorSelect
    '22':    # Elevator Wall 1
        North: ELEVWAL1
        South: ELEVWAL1
        East: ELEVWAL2
        West: ELEVWAL2
    '23':    # Gray Bricks w/ Blood
        North: GBRKBLD1
        South: GBRKBLD1
        East: GBRKBLD2
        West: GBRKBLD2
    '24':    # Plasma Alien Spawner
        North: PLASMSP1
        South: PLASMSP1
        East: PLASMSP2
        West: PLASMSP2
        # Lets electro-aliens out every 8-30 seconds (or a 0xFA value's seconds), as many at a
        # time as the skill's number (bstone's electro-alien walls)
        outlet:
            class: ElectroAlien
            delay: [8, 30]
            max: [1, 2, 3, 4]
            sound: bs/elecappear
    '25':    # Elevator Outside Wall
        North: ELEVOUT1
        South: ELEVOUT1
        East: ELEVOUT2
        West: ELEVOUT2
    '26':    # Computer w/ Lights
        North: COMPLIT1
        South: COMPLIT1
        East: COMPLIT2
        West: COMPLIT2
    '27':    # Computer Elevator? (Same as #0054)
        North: COMPELE1
        South: COMPELE1
        East: COMPELE2
        West: COMPELE2
    '28':    # Computer Room Wall
        North: COMPWAL1
        South: COMPWAL1
        East: COMPWAL2
        West: COMPWAL2
    '29':    # Episode Segue Art
        North: XHANGAR1
        South: XHANGAR1
        East: XPASSAG1
        West: XPASSAG1
    '30':
        North: XHANGAR2
        South: XHANGAR2
        East: XPASSAG2
        West: XPASSAG2
    '31':
        North: XHANGAR3
        South: XHANGAR3
        East: XPASSAG3
        West: XPASSAG3
    '32':    # Teleporter
        North: TELEPOR1
        South: TELEPOR1
        East: TELEPOR2
        West: TELEPOR2
        switch:
            # To the floor (0xF4nn) or the tile (x high byte, y low) its object-plane value says
            actions:
                - A_Teleport
    '33':    # Institute Wall w/ "Danger"
        North: INSDANG1
        South: INSDANG1
        East: INSDANG2
        West: INSDANG2
    '34':    # Shipping Crate
        North: SHCRATE1
        South: SHCRATE1
        East: SHCRATE2
        West: SHCRATE2
    '35':    # Biotech Wall w/ Gold Deco
        North: BIOTECH1
        South: BIOTECH1
        East: BIOTECH2
        West: BIOTECH2
    '36':    # Biotech Wall w/ Emblem
        North: BIOEMBL1
        South: BIOEMBL1
        East: BIOEMBL2
        West: BIOEMBL2
    '37':    # Prison Vent w/ Blood
        North: PRIVENB1
        South: PRIVENB1
        East: PRIVENB2
        West: PRIVENB2
    '38':    # Metal Wall w/ Panel 2
        North: METPNLB1
        South: METPNLB1
        East: METPNLB2
        West: METPNLB2
    '39':    # Metal Wall w/ Panel 3
