        South: BIOLITE1
        East: BIOLITE2
        West: BIOLITE2
    '41':    # Metal Wall w/ Tech
        North: METTECH1
        South: METTECH1
        East: METTECH2
        West: METTECH2
    '42':    # Space Wall 1
        North: SPCWALA1
        South: SPCWALA1
        East: SPCWALA2
        West: SPCWALA2
    '43':    # Space Wall 2
        North: SPCWALB1
        South: SPCWALB1
        East: SPCWALB2
        West: SPCWALB2
    '44':    # Space Wall 3
        North: SPCWALC1
