        North: CAVESIN1
        South: CAVESIN1
        East: CAVESIN2
        West: CAVESIN2
    '48':    # Biotech Wall 2
        North: BIOWALB1
        South: BIOWALB1
        East: BIOWALB2
        West: BIOWALB2
    '49':    # Biotech Wall w/ "Danger"
        North: BIODANG1
        South: BIODANG1
        East: BIODANG2
        West: BIODANG2
    '50':    # Biotech Wall 3
        North: BIOWALC1
        South: BIOWALC1
        East: BIOWALC2
