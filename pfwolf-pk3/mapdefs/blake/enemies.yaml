# Where Blake Stone's maps place its guards and bio-techs, as bstone's ScanInfoPlane: each kind
# has four tiles a row (facing east, north, west, south), standing or patrolling, with a row for
# every skill and up (min-skill 0), for expert and up (2) and for veteran (3). bstone's "path
# object" tiles (504-597) are patrollers too. A patroller turns aside when blocked; arrows
# (mapdefs/wolf3d patrol points 90-97, as Wolf3D's) turn it as well.
# Bio-techs (BioTech) are scientists or informants, at random.
