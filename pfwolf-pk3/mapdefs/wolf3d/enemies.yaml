# Enemy map-object numbers, converted from the ScanInfoPlane switch in
# Program.WL_GAME.cs to the same things:/class:/angles:/patrol:/min-skill: schema
# MapActorTranslation actually deserializes (matching decorations.yaml -- this file
# previously used a different actors:/Actor:/State:/Direction:/Skills:/Flags: shape
# that the loader never consumed, so enemies never actually spawned through it).
#
# angles: 0=east, 90=north, 180=west, 270=south (dir index * 90, matching
# `(objdirtypes)(dir * 2)` for dir 0..3 over east/north/west/south).
# patrol: 0 spawns into the actor's "Spawn" (stand-still) state, 1 into "Path".
# min-skill: difficultytypes' ordinal (0=baby, 1=easy, 2=medium, 3=hard) -- each
# grunt has three tile numbers per direction/state, unlocking at baby, medium, and
# hard, exactly mirroring ScanInfoPlane's "if difficulty < gd_medium/gd_hard: skip"
# checks before falling through to the base tile's spawn call.
#
# Bosses and ghosts are single, direction-less tiles (angles always 0, patrol
# always 0); bosses are always ambush-ready regardless of angles/patrol/min-skill
# (SpawnBoss et al. in Program.WL_ACT2.cs), and ghosts have no skill gating in the
# original switch at all.
