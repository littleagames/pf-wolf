    # The elevator switch. A switch block makes a wall one the player can use, like a door:
    #   to:                  the wall id it turns into (the switch thrown); left out, it stays
    #                        as it is. If that wall has a switch of its own (back to this one,
    #                        say), it's a toggle; if not, it's thrown once.
    #   sides:               the faces it can be used from, e.g. [east, west] (using it while
    #                        facing east presses its west face); left out, any
    #   sound:               played as it's thrown
    #   lock:                an inventory item (e.g. GoldKey) needed to use it; lock-message,
    #                        lock-message-style and locked-sound work as on doors.yaml doors,
    #                        falling back to the key's "key.switchlockedmessage"
    #   actions:             action calls run in order, acting on whatever shares the switch
    #                        tile's tag (map plane 4). Write one with arguments as a block list
    #                        item ("- A_Foo(1, 2)"): a comma breaks up a [flow, list].
    #                        A_Exit ends the level (to the secret level when standing on the
    #                        floors' secret-exit code); A_SecretExit always goes to the secret
    #                        level. Both wait for the switch's sound to finish.
    #                        A_OpenDoor("hold"), A_CloseDoor, A_ToggleDoor("hold"): the tagged
    #                        doors, whatever their lock; with hold, opened doors stay open
    #                        until something closes them.
    #                        A_MoveWall(direction, "moving sound", "blocked sound"): pushes the
    #                        first tagged wall north/east/south/west (left out or "": the way
    #                        the player faces); its tag goes with it.
    #                        A_SetWall(id): turns the tagged walls into wall id.
    #                        The switch's own tile is never a target, though it has the tag.
    '21':
        North: ELEV1_1
        South: ELEV1_1
        East: ELEV1_2
        West: ELEV1_2
        switch:
            to: 22
            sides: [east, west]
            sound: switches/elevbutn
            actions:
                - A_Exit
