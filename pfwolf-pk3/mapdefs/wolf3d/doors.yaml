# Doors by map tile number: every plane 0 tile listed here is a door. Each has the texture on
# each face, and for a locked door the item that opens it. The two faces across the doorway are
# the door (East/West for a vertical door, North/South otherwise); the other two are the slot
# (jamb) drawn on the walls either side of it. A jamb texture from a pk3 with clear pixels is
# drawn over the wall's own face, which shows through them.
#   vertical:            true: the door runs north-south, passed through going east or west (its
#                        East/West faces are the door, North/South the slot beside it); left out,
#                        it runs east-west
#   lock:                An inventory class (e.g. GoldKey) the player must carry to open the door
#   locks:               Several inventory classes (e.g. [GoldKey, SilverKey]) the player must
#                        carry all of to open the door, or locks-needed of them (any) if it's
#                        given; on top of lock if the door has both. Short of one, its key's
#                        "key.lockedmessage" is shown, unless locks-needed is less than all of
#                        them ("This door is locked."), so give such doors a lock-message
#   lock-message:        Shown when the player tries the door without it (a $NAME language key or
#                        the text); left out, the lock item's "key.lockedmessage" is used
#   lock-message-style:  The hud-messages.yaml style for it; left out, the lock item's
#                        "key.lockedmessagestyle"
#   open-sound:          Played from the door as it starts to open, and close-sound as it starts to
#   close-sound:         close, when the player can hear it (in an area connected to theirs)
#   locked-sound:        Played when the player tries the door without its lock item; left out,
#                        the lock item's "key.lockedsound"
#   automap-color:       The door's color on the automap (a theme color or #RRGGBB), such as its
#                        key's color; left out, the theme's AutomapDoor. A theme color named
#                        Automap<lock item> (e.g. AutomapGoldKey) wins over it
doors:
    '90':
        open-sound: doors/open
        close-sound: doors/close
        Vertical: true
        East: DOOR1_2
        West: DOOR1_2
        North: SLOT1_1
        South: SLOT1_1
    '91':
        open-sound: doors/open
        close-sound: doors/close
        North: DOOR1_1
        South: DOOR1_1
        East: SLOT1_2
        West: SLOT1_2
    '92':
        open-sound: doors/open
        close-sound: doors/close
        Vertical: true
        East: DOOR3_2
        West: DOOR3_2
        North: SLOT1_1
        South: SLOT1_1
        Lock: GoldKey
        automap-color: '#FFAA00'
    '93':
        open-sound: doors/open
        close-sound: doors/close
        North: DOOR3_1
        South: DOOR3_1
        East: SLOT1_2
        West: SLOT1_2
        Lock: GoldKey
        automap-color: '#FFAA00'
    '94':
        open-sound: doors/open
        close-sound: doors/close
        Vertical: true
        East: DOOR3_2
        West: DOOR3_2
        North: SLOT1_1
        South: SLOT1_1
        Lock: SilverKey
        automap-color: '#FFFFFF'
    '95':
        open-sound: doors/open
        close-sound: doors/close
        North: DOOR3_1
        South: DOOR3_1
        East: SLOT1_2
        West: SLOT1_2
