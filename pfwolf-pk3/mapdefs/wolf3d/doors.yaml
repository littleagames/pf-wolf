# Doors by map tile number: every plane 0 tile listed here is a door. Each has the texture on
# each face, and for a locked door the item that opens it.
#   vertical:            true: the door runs north-south, passed through going east or west (its
#                        East/West faces are the door, North/South the slot beside it); left out,
#                        it runs east-west
#   lock:                An inventory class (e.g. GoldKey) the player must carry to open the door
#   lock-message:        Shown when the player tries the door without it (a $NAME language key or
#                        the text); left out, the lock item's "key.lockedmessage" is used
#   lock-message-style:  The hud-messages.yaml style for it; left out, the lock item's
#                        "key.lockedmessagestyle"
doors:
    '90':
        Vertical: true
        East: DOOR1_2
        West: DOOR1_2
        North: SLOT1_1
        South: SLOT1_1
    '91':
        North: DOOR1_1
        South: DOOR1_1
        East: SLOT1_2
        West: SLOT1_2
    '92':
        Vertical: true
        East: DOOR3_2
        West: DOOR3_2
        North: SLOT1_1
        South: SLOT1_1
        Lock: GoldKey
    '93':
        North: DOOR3_1
        South: DOOR3_1
        East: SLOT1_2
        West: SLOT1_2
        Lock: GoldKey
    '94':
        Vertical: true
        East: DOOR3_2
        West: DOOR3_2
        North: SLOT1_1
        South: SLOT1_1
        Lock: SilverKey
    '95':
        North: DOOR3_1
        South: DOOR3_1
        East: SLOT1_2
        West: SLOT1_2
        Lock: SilverKey
    '100':
        Vertical: true
        East: DOOR2_2
        West: DOOR2_2
        North: SLOT1_1
        South: SLOT1_1
    '101':
        North: DOOR2_1
        South: DOOR2_1
        East: SLOT1_2
        West: SLOT1_2
