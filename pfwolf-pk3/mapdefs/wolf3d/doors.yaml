# Doors by map tile number (plane 0). What each key means is in the mapdefs reference:
# https://www.littleagames.com/pf-wolf/docs/latest/reference/mapdefs
doors:
    '90':
        open-sound: doors/open
        close-sound: doors/close
        Vertical: true
        East: DOOR1_2
        West: DOOR1_2
        North: SLOT1_1
        South: SLOT1_1
