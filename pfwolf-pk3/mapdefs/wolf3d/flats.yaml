# Floor and ceiling textures ("flats") for the flat plane, map plane 2, as ECWolf has them: the
# low byte of a tile's value is its floor's index here and the high byte its ceiling's (so a
# tile of 0x0302 has floor 2 and ceiling 3). Any texture works: a VSWAP wall, or a picture in
# the pk3's textures/ or flats/ folder, tiled once per map tile. Palette index 0xFF is
# see-through, as in sprites: the floor or ceiling color (or the level's sky) shows there.
#
# An index with no entry uses the map's default-floor / default-ceiling (game-info), and with no
# default the floor or ceiling color shows. Stock maps leave plane 2 at 0, so index 0 is left out
# to keep them looking as they always have. A level's sky (game-info sky:) is drawn
# behind the ceiling flats: it shows on tiles with no ceiling flat and through see-through pixels.
#
# skies: (by ceiling index) and floor-skies: (by floor index) give a tile a sky of its own, seen
# through its ceiling (or floor) as the level's sky is, in front of the level's sky: a day yard
# and a night yard on one level. A ceiling: texture on the same index is drawn over it; with
# none the tile has no ceiling at all, not even the default. See examples/mods/skies-demo.
#
# sides: (by floor index) is the texture on the sides of a floor tile's block (plane 3: a start
# and stop story), which has no wall texture of its own. With none, its sides take a wall beside it.
# ground: (by floor index) is what the ground under such a block shows where the ground is below
# the player's floor (a bridge deck over a valley): a texture, or sky for the floor sky (the
# tile's own, else the level's). With none, it's the tile's floor texture, as the block's top has.
#
# Keep the whole table in this one file: a mod's flats.yaml merges over it entry by entry.
flats:
  floor:
    1: GSTONEA1
    2: BSTONEA1
    3: WOOD1
  ceiling:
    1: GSTONEA1
    2: BSTONEA1
    3: WOOD1
