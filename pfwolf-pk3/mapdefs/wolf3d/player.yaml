# Object-plane tiles the player starts the level on. angles: 0=east, 90=north, 180=west,
# 270=south (as for things). With several starts on one map, the last one scanned wins.
# Starting weapons and ammo are a new game's, not the map's: `player.startitem` in
# actordefs/wolf3d/player.yaml.
player-starts:
  19:
    angles: 90
  20:
    angles: 0
  21:
    angles: 270
  22:
    angles: 180
  # Deathmatch starts: where players come into a deathmatch (and come back after dying), a
  # free one at random. Single-player levels don't use them.
  410:
    angles: 90
    deathmatch: true
  411:
    angles: 0
    deathmatch: true
  412:
    angles: 270
    deathmatch: true
  413:
    angles: 180
    deathmatch: true
