music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 50
  y: 100
indent: 24
# One item per skill in game-info (name and pic-name come from there)
items-source: "skills"
# "Bring 'em on!"
default-selection: 2
# Laid out for Wolf3D's four skills. With more or fewer the window grows or shrinks a row for
# each (no smaller than three, to hold the face) and it, the title and the skills stay centered;
# past eight the window is full and the skills scroll.
fit-items:
  rows: 4
  min-rows: 3
  max-rows: 8
  grow: [ "window" ]
  move: [ "title" ]
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    id: "title"
    type: "Label"
    params:
      - text: "$STR_HOWTOUGH"
      - x: 70
      - y: 68
      - color: "READHCOLOR"
  -
    id: "window"
    type: "Window"
    params:
      - x: 45
      - y: 90
      - width: 225
      - height: 67
