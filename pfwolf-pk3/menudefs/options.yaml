music: "WONDERIN"
type: "wolf3d-menu"
# Indented enough for the Messages checkbox between the cursor and the text
position:
  x: 52
  y: 82
indent: 48
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "Center"
      - y: 184
  -
    type: "Stripe"
    params:
      - y: 10
  # Window fits the item count: 13 per row plus 6
  -
    type: "Window"
    params:
      - x: 44
      - y: 79
      - width: 202
      - height: 84
  -
    type: "Graphic"
    params:
      - name: "c_options"
      - horizontal-orientation: "Center"
      - y: 0
# Change View and Video share V, and Messages and Mods share M: pressing it again moves to the other one
menu-items:
  -
      id: "sound"
      type: "MenuSwitcher"
      text: "$MENU_SOUND"
      short-key: S
      enabled: true
      action: "CP_Sound"
  -
      id: "control"
      type: "MenuSwitcher"
      text: "$MENU_CONTROL"
      short-key: C
      enabled: true
      action: "CP_Control"
  -
      id: "changeview"
      type: "MenuSwitcher"
      text: "$MENU_CHANGEVIEW"
      short-key: V
      enabled: true
      action: "CP_ChangeView"
  -
      id: "video"
      type: "MenuSwitcher"
      text: "$MENU_VIDEO"
      short-key: V
      enabled: true
      action: "CP_Video"
  # Whether item pickups, locked doors and deaths show messages over the view (msg_enabled)
  -
      id: "messages"
      type: "ToggleMenuItem"
      text: "$MENU_MESSAGES"
      short-key: M
      enabled: true
  # Which mods in the mods folder load over pfwolf.pk3 (mods.cfg); changing them restarts the game
  -
      id: "mods"
      type: "MenuSwitcher"
      text: "$MENU_MODS"
      short-key: M
      enabled: true
      action: "CP_Mods"
