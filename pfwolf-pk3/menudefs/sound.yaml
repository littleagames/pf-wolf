music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 24
  y: 62
indent: 56
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Window"
    params:
      - x: 16
      - y: 57
      - width: 288
      - height: 99
  -
    type: "Graphic"
    params:
      - name: "c_fxtitle"
      - horizontal-orientation: "center"
      - y: 38
# Each sound device is an on/off switch. A sound plays its best variant among the devices
# that are on (digitized, then AdLib, then PC speaker), or nothing if none of them are.
# The volume rows are sliders: left/right while highlighted.
menu-items:
  -
      id: "sound-pc"
      type: "ToggleMenuItem"
      text: "$STR_PC"
      enabled: true
  -
      id: "sound-adlib"
      type: "ToggleMenuItem"
      text: "$STR_ADLIB"
      enabled: true
  -
      id: "sound-digitized"
      type: "ToggleMenuItem"
      text: "$STR_DIGITIZED"
      enabled: true
  -
      id: "music"
      type: "ToggleMenuItem"
      text: "$STR_MUSIC"
      enabled: true
  -
      type: "BlankMenuItem"
  -
      id: "sound-volume"
      type: "SliderMenuItem"
      text: "$STR_SOUNDVOL"
      enabled: true
  -
      id: "music-volume"
      type: "SliderMenuItem"
      text: "$STR_MUSICVOL"
      enabled: true
