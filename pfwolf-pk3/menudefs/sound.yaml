menu-items:
  # Sound FX
  -
      id: "sfx-none"
      type: "ToggleMenuItem"
      text: "$STR_NONE"
      enabled: true
  -
      id: "sfx-pc"
      type: "ToggleMenuItem"
      text: "$STR_PC"
      enabled: true
  -
      id: "sfx-adlib"
      type: "ToggleMenuItem"
      text: "$STR_ALSB"
      enabled: true
  # Digi FX, gap of 2
  -
      type: "BlankMenuItem"
  -
      type: "BlankMenuItem"
  -
      id: "digi-none"
      type: "ToggleMenuItem"
      text: "$STR_NONE"
      enabled: true
  -
      id: "digi-soundsource"
      type: "ToggleMenuItem"
      text: "$STR_DISNEY"
      enabled: false
  -
      id: "digi-soundblaster"
      type: "ToggleMenuItem"
      text: "$STR_SB"
      enabled: true
  # Music, gap of 2
  -
      type: "BlankMenuItem"
  -
      type: "BlankMenuItem"
  -
      id: "music-none"
      type: "ToggleMenuItem"
      text: "$STR_NONE"
      enabled: true
  -
      id: "music-adlib"
      type: "ToggleMenuItem"
      text: "$STR_ALSB"
      enabled: true
