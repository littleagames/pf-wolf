music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 72
  y: 82
indent: 56
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Window"
    params:
      - x: 60
      - y: 77
      - width: 204
      - height: 60
  -
    type: "Graphic"
    params:
      - name: "c_fxtitle"
      - horizontal-orientation: "center"
      - y: 58
# Each sound device is an on/off switch. A sound plays its best variant among the devices
# that are on (digitized, then AdLib, then PC speaker), or nothing if none of them are.
menu-items:
  -
      id: "sound-pc"
      type: "ToggleMenuItem"
      text: "$STR_PC"
      enabled: true
  -
      id: "sound-adlib"
      type: "ToggleMenuItem"
      text: "$STR_ADLIB"
      enabled: true
  -
      id: "sound-digitized"
      type: "ToggleMenuItem"
      text: "$STR_DIGITIZED"
      enabled: true
  -
      id: "music"
      type: "ToggleMenuItem"
      text: "$STR_MUSIC"
      enabled: true
