music: "WONDERIN"
type: "wolf3d-menu"
# Indented enough for each mod's checkbox between the cursor and its name
position:
  x: 24
  y: 51
indent: 48
# One row per pk3, zip or folder in the mods folder, checked when mods.cfg switches it on; past 8
# they scroll. Tab (or X) opens the mod catalog in a browser, as the catalog-hint label says
# (left out in a build with no catalog)
items-source: "mods"
visible-rows: 8
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "$MENU_MODS"
      - horizontal-orientation: "center"
      - y: 30
      - color: "READHCOLOR"
  # Window fits 8 rows (13 per row) and the catalog's key under them
  -
    type: "Window"
    params:
      - x: 16
      - y: 48
      - width: 288
      - height: 123
  -
    id: "catalog-hint"
    type: "Label"
    params:
      - text: "$STR_MODS_CATALOG"
      - font: "SmallFont"
      - horizontal-orientation: "center"
      - y: 159
      - color: "READCOLOR"
