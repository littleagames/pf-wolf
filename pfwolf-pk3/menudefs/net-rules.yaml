music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 24
  y: 72
indent: 56
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "$STR_MP_RULES"
      - horizontal-orientation: "center"
      - y: 48
      - color: "READHCOLOR"
  # Window fits the item count: 13 per row plus 6
  -
    type: "Window"
    params:
      - x: 16
      - y: 67
      - width: 288
      - height: 58
# A deathmatch's rules, changed with left/right (or picking them); the values are drawn by code
# (Program.Multiplayer.cs)
menu-items:
  -
      id: "fraglimit"
      type: "ChoiceMenuItem"
      text: "$STR_MP_FRAGLIMIT"
      enabled: true
  -
      id: "timelimit"
      type: "ChoiceMenuItem"
      text: "$STR_MP_TIMELIMIT"
      enabled: true
  -
      id: "monsters"
      type: "ToggleMenuItem"
      text: "$STR_MP_MONSTERS"
      enabled: true
  -
      id: "itemrespawn"
      type: "ToggleMenuItem"
      text: "$STR_MP_ITEMRESPAWN"
      enabled: true
