music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 24
  y: 72
indent: 56
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "$STR_MP_RULES"
      - horizontal-orientation: "center"
      - y: 48
      - color: "READHCOLOR"
  # Window fits the item count: 13 per row plus 6
  -
    type: "Window"
    params:
      - x: 16
      - y: 67
      - width: 288
      - height: 84
# A match's rules, changed with left/right (or picking them); the values are drawn by code. The
# limit row is named for the mode (frags, captures, loot lead, points, waves to win); the hide
# and hunt times are Prop Hunt's only (Ui/MultiplayerMenu.cs)
menu-items:
  -
      id: "fraglimit"
      type: "ChoiceMenuItem"
      text: "$STR_MP_FRAGLIMIT"
      enabled: true
  -
      id: "timelimit"
      type: "ChoiceMenuItem"
      text: "$STR_MP_TIMELIMIT"
      enabled: true
  -
      id: "monsters"
      type: "ToggleMenuItem"
      text: "$STR_MP_MONSTERS"
      enabled: true
  -
      id: "itemrespawn"
      type: "ToggleMenuItem"
      text: "$STR_MP_ITEMRESPAWN"
      enabled: true
  -
      id: "hidetime"
      type: "ChoiceMenuItem"
      text: "$STR_MP_HIDETIME"
      enabled: true
  -
      id: "hunttime"
      type: "ChoiceMenuItem"
      text: "$STR_MP_HUNTTIME"
      enabled: true
