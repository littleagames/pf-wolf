music: "WONDERIN"
type: "wolf3d-menu"
# Customize Controls: a scrolling list of controls, each with two key/mouse slots and a
# controller slot. The list, its column titles and the help lines are drawn by code inside the
# window below (titles at y 48, rows from y 61, 11 apart, help lines at the bottom), so keep the
# window where it is.
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Stripe"
    params:
      - y: 10
  -
    type: "Graphic"
    params:
      - name: "c_customize"
      - x: 80
      - y: 0
  -
    type: "Window"
    params:
      - x: 5
      - y: 46
      - width: 310
      - height: 137

# The rows, in order. ControlMenuItem binds the control named in "control" (as bindaction and
# controls.cfg name it); HeaderMenuItem titles a group; BlankMenuItem leaves a gap; the "reset"
# item puts every control back to its default. Rows can be reordered, renamed or left out.
menu-items:
  - { type: "HeaderMenuItem", text: "$STR_CTL_MOVEMENT" }
  - { type: "ControlMenuItem", control: "moveforward", text: "$STR_CTL_FORWARD" }
  - { type: "ControlMenuItem", control: "movebackward", text: "$STR_CTL_BACKWARD" }
  - { type: "ControlMenuItem", control: "turnleft", text: "$STR_CTL_TURNLEFT" }
  - { type: "ControlMenuItem", control: "turnright", text: "$STR_CTL_TURNRIGHT" }
  - { type: "ControlMenuItem", control: "strafeleft", text: "$STR_CTL_STRAFELEFT" }
  - { type: "ControlMenuItem", control: "straferight", text: "$STR_CTL_STRAFERIGHT" }
  - { type: "ControlMenuItem", control: "strafe", text: "$STR_CTL_STRAFE" }
  - { type: "ControlMenuItem", control: "run", text: "$STR_CTL_RUN" }

  - { type: "HeaderMenuItem", text: "$STR_CTL_ACTION" }
  - { type: "ControlMenuItem", control: "attack", text: "$STR_CTL_ATTACK" }
  - { type: "ControlMenuItem", control: "use", text: "$STR_CTL_USE" }

  - { type: "HeaderMenuItem", text: "$STR_CTL_WEAPONS" }
  - { type: "ControlMenuItem", control: "readyknife", text: "$STR_CTL_KNIFE" }
  - { type: "ControlMenuItem", control: "readypistol", text: "$STR_CTL_PISTOL" }
  - { type: "ControlMenuItem", control: "readymachinegun", text: "$STR_CTL_MACHINEGUN" }
  - { type: "ControlMenuItem", control: "readychaingun", text: "$STR_CTL_CHAINGUN" }
  - { type: "ControlMenuItem", control: "nextweapon", text: "$STR_CTL_NEXTWEAPON" }
  - { type: "ControlMenuItem", control: "prevweapon", text: "$STR_CTL_PREVWEAPON" }

  - { type: "HeaderMenuItem", text: "$STR_CTL_GAME" }
  - { type: "ControlMenuItem", control: "esc", text: "$STR_CTL_MENU" }
  - { type: "ControlMenuItem", control: "pause", text: "$STR_CTL_PAUSE" }
  - { type: "ControlMenuItem", control: "automap", text: "$STR_CTL_AUTOMAP" }

  - { type: "HeaderMenuItem", text: "$STR_CTL_AUTOMAPKEYS" }
  - { type: "ControlMenuItem", control: "am_zoomin", text: "$STR_CTL_AMZOOMIN" }
  - { type: "ControlMenuItem", control: "am_zoomout", text: "$STR_CTL_AMZOOMOUT" }
  - { type: "ControlMenuItem", control: "am_panup", text: "$STR_CTL_AMPANUP" }
  - { type: "ControlMenuItem", control: "am_pandown", text: "$STR_CTL_AMPANDOWN" }
  - { type: "ControlMenuItem", control: "am_panleft", text: "$STR_CTL_AMPANLEFT" }
  - { type: "ControlMenuItem", control: "am_panright", text: "$STR_CTL_AMPANRIGHT" }
  - { type: "ControlMenuItem", control: "am_center", text: "$STR_CTL_AMCENTER" }
  - { type: "ControlMenuItem", control: "am_follow", text: "$STR_CTL_AMFOLLOW" }
  - { type: "ControlMenuItem", control: "am_rotate", text: "$STR_CTL_AMROTATE" }
  - { type: "ControlMenuItem", control: "am_style", text: "$STR_CTL_AMSTYLE" }
  - { type: "ControlMenuItem", control: "am_overlay", text: "$STR_CTL_AMOVERLAY" }
  - { type: "ControlMenuItem", control: "am_grid", text: "$STR_CTL_AMGRID" }

  - { type: "BlankMenuItem" }
  - { id: "reset", type: "MenuSwitcher", text: "$STR_CTL_RESET", enabled: true }
