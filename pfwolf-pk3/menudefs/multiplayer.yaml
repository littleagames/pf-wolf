music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 24
  y: 72
indent: 40
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "$MENU_MULTIPLAYER"
      - horizontal-orientation: "center"
      - y: 48
      - color: "READHCOLOR"
  # Window fits the item count: 13 per row plus 6
  -
    type: "Window"
    params:
      - x: 16
      - y: 67
      - width: 288
      - height: 84
# Handled by Ui/MultiplayerMenu.cs, by id; the values (your name, open port, streamer mode) are drawn by code
# in the small font, as the lobby's are
menu-items:
  -
      id: "host"
      type: "MenuSwitcher"
      text: "$STR_MP_HOST"
      short-key: H
      enabled: true
  -
      id: "join"
      type: "MenuSwitcher"
      text: "$STR_MP_JOIN"
      short-key: J
      enabled: true
  -
      id: "name"
      type: "ChoiceMenuItem"
      text: "$STR_MP_NAME"
      short-key: Y
      enabled: true
  # Whether hosting asks the router (UPnP / NAT-PMP) to open the port; drawn by code
  -
      id: "openport"
      type: "ChoiceMenuItem"
      text: "$STR_MP_OPENPORT"
      short-key: O
      enabled: true
  -
      id: "portcheck"
      type: "MenuSwitcher"
      text: "$STR_MP_PORTCHECK"
      short-key: C
      enabled: true
  # Hides internet addresses on screen and in the console, for streaming; drawn by code
  -
      id: "streamer"
      type: "ChoiceMenuItem"
      text: "$STR_MP_STREAMER"
      short-key: S
      enabled: true
