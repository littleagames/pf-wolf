music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 25
  y: 62
indent: 24
# One item per class in game-info's player-classes (name and pic-name come from there); only
# shown when there's more than one. The highlighted class's picture is drawn 175 right of the
# position, in up to 96x100.
items-source: "player-classes"
default-selection: 0
# Laid out for seven classes, the window's height kept for the picture: fewer are centered
# beside it (or, when no class has a picture, the window shrinks to them), more grow the window
# (and move the title up) to ten, past which they scroll
fit-items:
  rows: 7
  min-rows: 7
  max-rows: 10
  grow: [ "window" ]
  move: [ "title" ]
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    id: "title"
    type: "Label"
    params:
      - text: "$STR_WHICHCLASS"
      - horizontal-orientation: "center"
      - y: 36
      - color: "READHCOLOR"
  -
    id: "window"
    type: "Window"
    params:
      - x: 20
      - y: 52
      - width: 280
      - height: 111
