music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 24
  y: 62
indent: 56
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "$MENU_VIDEO"
      - horizontal-orientation: "center"
      - y: 38
      - color: "READHCOLOR"
  # Window fits the item count: 13 per row plus 6
  -
    type: "Window"
    params:
      - x: 16
      - y: 57
      - width: 288
      - height: 97
# Values are drawn by code. Fullscreen, window size, resolution and VSync ask to be kept
# once changed, and go back after a few seconds if nobody answers.
menu-items:
  -
      id: "fullscreen"
      type: "ToggleMenuItem"
      text: "$STR_FULLSCREEN"
      enabled: true
  # Greyed out while fullscreen
  -
      id: "window-size"
      type: "ChoiceMenuItem"
      text: "$STR_WINDOWSIZE"
      enabled: true
  # The size the game is drawn at: Auto (the window's), or 320x200 times a whole number
  -
      id: "render-scale"
      type: "ChoiceMenuItem"
      text: "$STR_RESOLUTION"
      enabled: true
  # How big the menus, text and status bar are: Auto is the most that fits
  -
      id: "ui-scale"
      type: "ChoiceMenuItem"
      text: "$STR_UISCALE"
      enabled: true
  -
      id: "vsync"
      type: "ToggleMenuItem"
      text: "$STR_VSYNC"
      enabled: true
  -
      id: "aspect"
      type: "ToggleMenuItem"
      text: "$STR_ASPECT"
      enabled: true
  -
      id: "filter"
      type: "ChoiceMenuItem"
      text: "$STR_FILTER"
      enabled: true
