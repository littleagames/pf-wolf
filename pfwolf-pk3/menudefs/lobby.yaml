music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 24
  y: 22
indent: 40
row-height: 11
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "$STR_MP_LOBBY"
      - horizontal-orientation: "center"
      - y: 4
      - color: "READHCOLOR"
  # The game's settings and what you can do: 10 rows, 11 each plus 6
  -
    type: "Window"
    params:
      - x: 16
      - y: 18
      - width: 288
      - height: 116
  # Who's in, and what they've said: 5 rows of 9 plus 4 (drawn by code: Ui/MultiplayerMenu.cs LobbyPanelY)
  -
    type: "Window"
    params:
      - x: 16
      - y: 135
      - width: 288
      - height: 49
# Handled by Ui/MultiplayerMenu.cs, by id. Only the host changes the mode, episode and
# skill; everyone picks their own class and color. The host starts the game ("go") once everyone else
# is ready; for them, "go" is that they're ready. The values are drawn by code. In any mode but
# co-op the episode row is "Map" and picks the arena (game-info maps with `deathmatch: true`, or
# the mode in their `modes`); in a team mode the color row is "Team" (red or blue).
menu-items:
  -
      id: "mode"
      type: "ChoiceMenuItem"
      text: "$STR_MP_MODE"
      enabled: true
  -
      id: "episode"
      type: "ChoiceMenuItem"
      text: "$STR_MP_EPISODE"
      enabled: true
  -
      id: "skill"
      type: "ChoiceMenuItem"
      text: "$STR_MP_SKILL"
      enabled: true
  -
      id: "class"
      type: "ChoiceMenuItem"
      text: "$STR_MP_CLASS"
      enabled: true
  # Your color (game-info player-colors), as the others see you
  -
      id: "color"
      type: "ChoiceMenuItem"
      text: "$STR_MP_COLOR"
      enabled: true
  # A match's rules (any mode but co-op): the host picks them on a screen of their own
  -
      id: "rules"
      type: "ChoiceMenuItem"
      text: "$STR_MP_RULES"
      enabled: true
  -
      id: "go"
      type: "ToggleMenuItem"
      text: "$STR_MP_READY"
      enabled: true
  -
      id: "chat"
      type: "MenuSwitcher"
      text: "$STR_MP_CHAT"
      short-key: T
      enabled: true
  # The host copies where others join to the clipboard (greyed for the others)
  -
      id: "copy"
      type: "MenuSwitcher"
      text: "$STR_MP_COPYADDRESS"
      enabled: true
  -
      id: "leave"
      type: "MenuSwitcher"
      text: "$STR_MP_LEAVE"
      enabled: true
