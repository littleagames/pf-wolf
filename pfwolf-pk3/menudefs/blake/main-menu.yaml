# Blake Stone's look (bstone's 3d_menu.cpp), in place of menudefs/main-menu.yaml
# The main options: items at bstone's MENU_X/MENU_Y, 9 apart, in its COAL font (Font5)
music: "MEETINGA"
type: "blake-menu"
position: { x: 111, y: 50 }
indent: 0
row-height: 9
font: "SmallFont"
item-shadow: "1"
cursor: { x: 77, y-offset: 1, width: 154, height: 9, color: "82", erase-color: "2", flash-tics: 40 }
components:
  # The LINC screen (game-info menu-backdrop) with its terminal cleared
  - { type: "Background", params: [ { color: "2" } ] }
  - { type: "Fill", params: [ { x: 32 }, { y: 28 }, { width: 244 }, { height: 132 }, { color: "2" } ] }
  - { type: "Label", params: [ { text: "MAIN OPTIONS" }, { font: "BlakeTitle" }, { horizontal-orientation: "center" }, { x: 31 }, { width: 244 }, { y: 31 }, { color: "86" }, { shadow-color: "1" } ] }
  - { type: "Label", params: [ { text: "UP/DN SELECTS - ENTER CHOOSES - ESC EXITS" }, { font: "BlakeSmall" }, { horizontal-orientation: "center" }, { x: 47 }, { width: 236 }, { y: 163 }, { color: "83" }, { shadow-color: "1" } ] }
# Items without an action are handled by the main menu loop (by id)
menu-items:
  - { id: "newgame", type: "MenuSwitcher", text: "NEW MISSION", short-key: N, enabled: true, action: "CP_NewGame" }
  - { id: "orderinginfo", type: "MenuSwitcher", text: "ORDERING INFO", short-key: O, enabled: true, highlighted: true, action: "CP_TextScreen", script: "ThankYouText" }
  - { id: "instructions", type: "MenuSwitcher", text: "INSTRUCTIONS", short-key: I, enabled: true, highlighted: true, action: "CP_TextScreen", script: "HelpText" }
  - { id: "story", type: "MenuSwitcher", text: "STORY", short-key: S, enabled: true, action: "CP_TextScreen", script: "StoryText" }
  - { type: "BlankMenuItem" }
  - { id: "options", type: "MenuSwitcher", text: "GAME OPTIONS", short-key: G, enabled: true, action: "CP_Options" }
  # Becomes "End Game" (no action) while a game is in progress
  - { id: "viewscores", type: "MenuSwitcher", text: "HIGH SCORES", short-key: H, enabled: true, action: "CP_ViewScores" }
  - { id: "loadgame", type: "MenuSwitcher", text: "LOAD MISSION", short-key: L, enabled: true, action: "CP_LoadGame" }
  - { id: "savegame", type: "MenuSwitcher", text: "SAVE MISSION", short-key: S, enabled: false, action: "CP_SaveGame" }
  - { type: "BlankMenuItem" }
  - { id: "backtodemo", type: "MenuSwitcher", text: "BACK TO DEMO", short-key: B, enabled: true }
  - { id: "quit", type: "MenuSwitcher", text: "LOGOFF", short-key: L, enabled: true }