# Blake Stone's look (bstone's 3d_menu.cpp), in place of menudefs/controller.yaml
# Dead zone and turn speed sliders and the stick layout, 120 right of the text; the controller's name is drawn by code
music: "MEETINGA"
type: "blake-menu"
position: { x: 52, y: 70 }
indent: 0
row-height: 11
font: "SmallFont"
item-shadow: "1"
cursor: { x: 34, y-offset: 0, width: 120, height: 11, color: "82", erase-color: "2", flash-tics: 40 }
components:
  # The LINC screen (game-info menu-backdrop) with its terminal cleared
  - { type: "Background", params: [ { color: "2" } ] }
  - { type: "Fill", params: [ { x: 32 }, { y: 28 }, { width: 244 }, { height: 132 }, { color: "2" } ] }
  - { type: "Label", params: [ { text: "CONTROLLER" }, { font: "BlakeTitle" }, { horizontal-orientation: "center" }, { x: 31 }, { width: 244 }, { y: 31 }, { color: "86" }, { shadow-color: "1" } ] }
  - { type: "Label", params: [ { text: "UP/DN SELECTS - LF/RT CHANGES - ESC EXITS" }, { font: "BlakeSmall" }, { horizontal-orientation: "center" }, { x: 47 }, { width: 236 }, { y: 163 }, { color: "83" }, { shadow-color: "1" } ] }
  - { type: "Label", params: [ { text: "$STR_JOYMODERNHINT" }, { horizontal-orientation: "center" }, { x: 32 }, { width: 244 }, { y: 112 }, { font: "BlakeSmall" }, { color: "86" } ] }
  - { type: "Label", params: [ { text: "$STR_JOYCLASSICHINT" }, { horizontal-orientation: "center" }, { x: 32 }, { width: 244 }, { y: 120 }, { font: "BlakeSmall" }, { color: "86" } ] }
menu-items:
  - { id: "joy-deadzone", type: "SliderMenuItem", text: "DEAD ZONE", enabled: true }
  - { id: "joy-turnspeed", type: "SliderMenuItem", text: "TURN SPEED", enabled: true }
  - { id: "joy-sticks", type: "ChoiceMenuItem", text: "STICKS", enabled: true }