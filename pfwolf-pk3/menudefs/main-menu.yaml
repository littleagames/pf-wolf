music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 76
  y: 55
indent: 24
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "Center"
      - y: 184
  -
    type: "Stripe"
    params:
      - y: 10
  # Window fits the item count: 9 items in Apogee's releases, 8 elsewhere (no "Read This!").
  # [wolf3d] takes in the packs built on wolf3d (Spear); "!wolf3d-shareware" leaves that one out.
  -
    type: "Window"
    game-packs: [ "wolf3d-shareware", "wolf3d-apogee" ]
    params:
      - x: 68
      - y: 52
      - width: 178
      - height: 123
  -
    type: "Window"
    game-packs: [ "wolf3d", "!wolf3d-shareware", "!wolf3d-apogee" ]
    params:
      - x: 68
      - y: 52
      - width: 178
      - height: 110
  -
    type: "Graphic"
    params:
      - name: "c_options"
      - horizontal-orientation: "Center"
      - y: 0
# Items without an action are handled by the main menu loop (by id)
menu-items:
  -
      id: "newgame"
      type: "MenuSwitcher"
      text: "$MENU_NEWGAME"
      short-key: N
      enabled: true
      action: "CP_NewGame"
  # Hosting or joining a game with others (Wolf3D and the games built on it)
  -
      id: "multiplayer"
      type: "MenuSwitcher"
      text: "$MENU_MULTIPLAYER"
      short-key: M
      enabled: true
      action: "CP_Multiplayer"
      game-packs: [ "wolf3d" ]
  # Sound, Control and Change View are in here
  -
      id: "options"
      type: "MenuSwitcher"
      text: "$MENU_OPTIONS"
      short-key: O
      enabled: true
      action: "CP_Options"
  -
      id: "loadgame"
      type: "MenuSwitcher"
      text: "$MENU_LOADGAME"
      short-key: L
      enabled: true
      action: "CP_LoadGame"
  -
      id: "savegame"
      type: "MenuSwitcher"
      text: "$MENU_SAVEGAME"
      short-key: S
      enabled: false
      action: "CP_SaveGame"
  -
      id: "readthis"
      type: "MenuSwitcher"
      text: "$MENU_READTHIS"
      short-key: R
      enabled: true
      action: "CP_ReadThis"
      # Only Apogee's releases (their VGAGRAPH layout) have the pictures the help text draws: id's
      # GT v1.4 (wolf3d's files) dropped "Read This!", and Spear has no help screens
      game-packs: [ "wolf3d-shareware", "wolf3d-apogee" ]
  # Becomes "End Game" (no action) while a game is in progress
  -
      id: "viewscores"
      type: "MenuSwitcher"
      text: "$MENU_VIEWSCORES"
      short-key: V
      enabled: true
      action: "CP_ViewScores"
  -
      id: "backtodemo"
      type: "MenuSwitcher"
      text: "$MENU_BACKTODEMO"
      short-key: B
      enabled: true
  -
      id: "quit"
      type: "MenuSwitcher"
      text: "$MENU_QUIT"
      short-key: Q
      enabled: true
