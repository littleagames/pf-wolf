music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 76
  y: 55
indent: 24
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "Center"
      - y: 184
  -
    type: "Stripe"
    params:
      - y: 10
  # Window fits the item count: 8 items in Wolf3D, 7 in Spear (no "Read This!")
  -
    type: "Window"
    game-packs: [ "wolf3d" ]
    params:
      - x: 68
      - y: 52
      - width: 178
      - height: 110
  -
    type: "Window"
    game-packs: [ "spear" ]
    params:
      - x: 68
      - y: 52
      - width: 178
      - height: 97
  -
    type: "Graphic"
    params:
      - name: "c_options"
      - horizontal-orientation: "Center"
      - y: 0
# Items without an action are handled by the main menu loop (by id)
menu-items:
  -
      id: "newgame"
      type: "MenuSwitcher"
      text: "$MENU_NEWGAME"
      short-key: N
      enabled: true
      action: "CP_NewGame"
  # Sound, Control and Change View are in here
  -
      id: "options"
      type: "MenuSwitcher"
      text: "$MENU_OPTIONS"
      short-key: O
      enabled: true
      action: "CP_Options"
  -
      id: "loadgame"
      type: "MenuSwitcher"
      text: "$MENU_LOADGAME"
      short-key: L
      enabled: true
      action: "CP_LoadGame"
  -
      id: "savegame"
      type: "MenuSwitcher"
      text: "$MENU_SAVEGAME"
      short-key: S
      enabled: false
      action: "CP_SaveGame"
  -
      id: "readthis"
      type: "MenuSwitcher"
      text: "$MENU_READTHIS"
      short-key: R
      enabled: true
      action: "CP_ReadThis"
      # Spear has no help screens
      game-packs: [ "wolf3d" ]
  # Becomes "End Game" (no action) while a game is in progress
  -
      id: "viewscores"
      type: "MenuSwitcher"
      text: "$MENU_VIEWSCORES"
      short-key: V
      enabled: true
      action: "CP_ViewScores"
  -
      id: "backtodemo"
      type: "MenuSwitcher"
      text: "$MENU_BACKTODEMO"
      short-key: B
      enabled: true
  -
      id: "quit"
      type: "MenuSwitcher"
      text: "$MENU_QUIT"
      short-key: Q
      enabled: true
