music: "WONDERIN"
type: "wolf3d-menu"
# Load Game: the list of saves, the highlighted one's picture and progress, and the help line
# are drawn by code (Program.LoadSaveScreen.cs) inside the window below: the list in its left
# half from y 49, the preview in its right half, the help line at the bottom. Keep the window
# where it is, and the same as save-game's.
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Stripe"
    params:
      - y: 10
  -
    type: "Graphic"
    params:
      - name: "c_loadgame"
      - x: 60
      - y: 0
  -
    type: "Window"
    params:
      - x: 5
      - y: 46
      - width: 310
      - height: 142
