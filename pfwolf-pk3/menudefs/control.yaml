music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 24
  y: 80
indent: 56
components:
  -
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Stripe"
    params:
      - y: 10
  -
    type: "Window"
    params:
      - x: 16
      - y: 75
      - width: 284
      - height: 99
  -
    type: "Graphic"
    params:
      - name: "c_control"
      - horizontal-orientation: "center"
      - y: 0
menu-items:
  -
      id: "mouse-enabled"
      type: "ToggleMenuItem"
      text: "$STR_MOUSEEN"
      enabled: false
  -
      id: "mouse-sensitivity"
      type: "MenuSwitcher"
      text: "$STR_SENS"
      enabled: false
      action: "MouseSensitivity"
  # Mouse look (m_look / m_invert in controls.cfg): the mouse's up and down looks rather than walks
  -
      id: "mouse-look"
      type: "ToggleMenuItem"
      text: "$STR_MOUSELOOK"
      enabled: false
  -
      id: "mouse-invert"
      type: "ToggleMenuItem"
      text: "$STR_MOUSEINVERT"
      enabled: false
  -
      id: "joystick-enabled"
      type: "ToggleMenuItem"
      text: "$STR_JOYEN"
      enabled: false
  -
      id: "controller-settings"
      type: "MenuSwitcher"
      text: "$STR_JOYSETTINGS"
      enabled: true
      action: "CP_ControllerSettings"
  -
      id: "customize"
      type: "MenuSwitcher"
      text: "$STR_CUSTOM"
      enabled: true
      action: "CustomControls"
