# An episode's level select (game-info level-select: Ui/NewGameMenu.cs), after the episode menu:
# its rows, the episode's levels, are made as it's shown; locked ones are greyed out
music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 24
  y: 26
indent: 24
visible-rows: 11
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Window"
    params:
      - x: 16
      - y: 19
      - width: 288
      - height: 162
  -
    id: "title"
    type: "Label"
    params:
      - text: "$STR_CHOOSELEVEL"
      - horizontal-orientation: "center"
      - y: 2
      - color: "READHCOLOR"
