music: "WONDERIN"
type: "wolf3d-menu"
# The Game Options settings (freelook, msg_enabled, am_stats, autosave, weaponbob,
# weaponbob_sway, alwaysrun, crosshair, hud_markers, s_muffle). Each starts as game-info setting-defaults has it, and is the player's own
# choice once they switch it. As wide as the Mods menu, so the longest names (Objective Markers,
# Muffle Thru Doors) clear the scroll marks at the window's right
position:
  x: 24
  y: 64
indent: 48
# Nine rows fit the window; the rest scroll into view with the cursor
visible-rows: 9
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "$MENU_GAMEOPTIONS"
      - horizontal-orientation: "center"
      - y: 42
      - color: "READHCOLOR"
  # Window fits the item count: 13 per row plus 6
  -
    type: "Window"
    params:
      - x: 16
      - y: 61
      - width: 288
      - height: 123
# Checkboxes drawn by code
menu-items:
  -
      id: "freelook"
      type: "ToggleMenuItem"
      text: "$STR_FREELOOK"
      short-key: L
      enabled: true
  -
      id: "messages"
      type: "ToggleMenuItem"
      text: "$MENU_MESSAGES"
      short-key: M
      enabled: true
  -
      id: "automapstats"
      type: "ToggleMenuItem"
      text: "$MENU_AUTOMAPSTATS"
      short-key: S
      enabled: true
  -
      id: "autosave"
      type: "ToggleMenuItem"
      text: "$STR_AUTOSAVE"
      short-key: A
      enabled: true
  -
      id: "weaponbob"
      type: "ToggleMenuItem"
      text: "$STR_WEAPONBOB"
      short-key: W
      enabled: true
  -
      id: "weaponbobsway"
      type: "ToggleMenuItem"
      text: "$STR_WEAPONBOBSWAY"
      short-key: B
      enabled: true
  -
      id: "alwaysrun"
      type: "ToggleMenuItem"
      text: "$STR_ALWAYSRUN"
      short-key: R
      enabled: true
  -
      id: "crosshair"
      type: "ToggleMenuItem"
      text: "$STR_CROSSHAIR"
      short-key: C
      enabled: true
  -
      id: "objectivemarkers"
      type: "ToggleMenuItem"
      text: "$STR_OBJECTIVEMARKERS"
      short-key: O
      enabled: true
  -
      id: "soundmuffling"
      type: "ToggleMenuItem"
      text: "$STR_SOUNDMUFFLING"
      short-key: U
      enabled: true
