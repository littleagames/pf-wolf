# Blake Stone text, added to the shared language/en-us.yaml. The status bar info area's messages
# are the game's own (bstone's 3d_msgs.cpp, 3d_act1.cpp, 3d_act2.cpp, 3d_agent.cpp), laid out as
# it lays them out: info area scripts (Ui/TextPresenter.cs DrawInfoScript), \n for bstone's \r, the
# spaces before a line centering it, ^SHnnn the item's picture (presenter.yaml shapes), ^FCnn the
# text's color (57 a heading, A6 the text). One with no picture or color starts with ^FCA6 (the
# area's own color, so nothing changes) to be a script, which keeps its line breaks and spaces.
# {Item:00} is the count of that item, in two digits; %a and %n are filled in by what shows them.

# The menus' questions, as bstone's (3d_menu.cpp): Blake Stone has one quit message
$BS_ENDSTR1: "      Quit to DOS?\n Are you sure (Y or N)?"
$ENDGAMESTR: "    End current game?\n Are you sure (Y or N)?"
$CURGAME: "   Continuing past this\n  point will end the game\n you're currently playing.\n\n Start a NEW game? (Y/N)"

