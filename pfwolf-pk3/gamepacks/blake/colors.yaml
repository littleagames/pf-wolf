# Named colors used by menus, text layout and intermission screens (see gamepacks/wolf3d/colors.yaml).
# Values are #RRGGBB; the engine draws the closest color in the game palette. Blake Stone's
# menus are green on black; the original control panel's look comes in a later phase.

# Menu frame
BORDCOLOR: "#00A600"
BORD2COLOR: "#28CF00"
DEACTIVE: "#004500"
BKGDCOLOR: "#002800"
