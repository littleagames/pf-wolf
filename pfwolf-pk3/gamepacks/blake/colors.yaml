# Named colors used by menus, text layout and intermission screens (see gamepacks/wolf3d/colors.yaml).
# Values are #RRGGBB; the engine draws the closest color in the game palette. The menu ones are
# bstone's control panel colors (3d_menu.cpp), exactly palette entries: green on the LINC
# terminal's near-black.

# Menu frame
BORDCOLOR: "#00A600"
BORD2COLOR: "#005C00"   # 0x53
DEACTIVE: "#005C00"     # 0x53, DISABLED_TEXT_COLOR
BKGDCOLOR: "#0C0C0C"    # 0x02, TERM_BACK_COLOR
STRIPE: "#003800"

# Menu text
READCOLOR: "#B0D040"    # 0x4A
READHCOLOR: "#90BC00"   # 0x47
VIEWCOLOR: "#004040"
TEXTCOLOR: "#00A400"    # 0x56, ENABLED_TEXT_COLOR
HIGHLIGHT: "#28CC28"    # 0x59, HIGHLIGHT_TEXT_COLOR

# Intermission bars
FIRSTCOLOR: "#9DFF9D"
SECONDCOLOR: "#00FF00"

# Read This! / help text background
BACKCOLOR: "#DEDEDE"

# Signon screen hardware-detected boxes
FILLCOLOR: "#FFFF55"

Black: "#000000"
White: "#FFFFFF"
Grey: "#8D8D8D"
Green: "#04A500"
DarkGreen: "#047100"
Yellow: "#E6DA00"
Purple: "#61009D"
"Dark Blue": "#00004C"
Navy: "#00007D"
Blue: "#0000E2"
Maroon: "#AA0000"
"Light Blue": "#20AAFF"
Lime: "#55FF55"
"Bright Yellow": "#FFFF55"
"Dark Yellow": "#404000"

# Automap
AutomapBackground: "#555555"
AutomapWall: "#008E00"
AutomapDoor: "#10C710"
AutomapPlayer: "#FF8000"
AutomapEnemy: "#FF0000"
AutomapCorpse: "#710000"
AutomapItem: "#20AAFF"
AutomapDecor: "#8D8D8D"
AutomapWallSprite: "#8D8D8D"
AutomapGrid: "#004040"
AutomapTitle: "#FFFF55"
