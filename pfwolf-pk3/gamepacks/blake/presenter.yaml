# The JAM text presenter (Program.TextPresenter.cs): Blake Stone's briefings, elevator messages,
# message boxes and help pages are scripts in its ^ codes. Colors are palette indices.

# The fonts a script's ^FNn picks from (fonts.yaml): ^FN0 isn't printable, so it's ^FN1's
fonts: [Presenter1, Presenter1, Presenter2, Presenter3, Presenter4]

# What ^SHnnn draws (nnn in hex: ^SH090 is 144), from bstone's shape table for Aliens of Gold
# v1.0 (jm_tp.cpp): pictures, and sprites and walls at 64x64. Only the ones the game's texts
# use are here: the briefings' mission pictures, the instructions' keys and items, the story's
# pictures and the ordering info's logos.
