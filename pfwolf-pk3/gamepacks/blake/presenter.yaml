# What ^ANnn animates (nn in hex: ^AN24 is 36), from bstone's animation table: sprites drawn at
# 64x64 one after another while the page is up (37x37 in the status bar's info area), each for
# tics; rebound goes back and forth. The ones the help pages and the attack messages (actordefs
# attackinfo) use are here; Planet Strike's own are in its presenter.yaml.
animations:
  4: { sprites: [RENTB8, RENTC8, RENTD8, RENTE8], tics: 20 }    # sector patrol walking
  5: { sprites: [TURRA1, TURRA2, TURRA3, TURRA4, TURRA5, TURRA6, TURRA7, TURRA8], tics: 20 }   # turret turning
  9: { sprites: [GSCIB8, GSCIC8, GSCID8, GSCIE8], tics: 20 }    # bio-technician walking
