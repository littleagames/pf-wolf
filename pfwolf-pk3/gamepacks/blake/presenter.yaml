# What ^PSnn plays: Blake Stone's sounds by their place in its sound list (bstone's audio.h)
sounds:
  65: bs/goldsternlaugh

# The box over the status bar that "Get Ready, Blake!" and the like are shown in (bstone's BMAmsg)
message-box:
  x: 0
  y: 152
  width: 320
  height: 48
  hi: 133
  med: 130
  lo: 128
  text-color: 175
  font: 1

# The window briefings and help pages are shown in (bstone's HelpPresenter)
briefing:
  pics:
    - { pic: H_TopWindow, x: 0, y: 0 }
    - { pic: H_LeftWindow, x: 0, y: 8 }
    - { pic: H_RightWindow, x: 312, y: 8 }
    - { pic: H_BottomInfo, x: 8, y: 176 }
  x1: 8
  y1: 8
  x2: 311
  y2: 175
  light: 123
  background: 125
  dark: 127
  shadow: 0
  font: 4
  info-line: "$BS_BRIEFINGHELP"
  info-font: 2
  info-color: 57
  page-x: 246
  page-y: 190
  # The instructions, story and ordering info from the menu (and F1): only Esc leaves them
  pages-info-line: "$BS_PAGESHELP"
  pages-music: RHUMBAAS
