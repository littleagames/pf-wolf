  24: { sprites: [SWATB8, SWATC8, SWATD8, SWATE8], tics: 20 }   # STAR trooper walking
  25: { sprites: [DGLDB8, DGLDC8, DGLDD8, DGLDE8], tics: 20 }   # Dr. Goldfire
  29: { sprites: [ELCKA0, ELCKB0, ELCKC0], tics: 20 }           # arc barrier
