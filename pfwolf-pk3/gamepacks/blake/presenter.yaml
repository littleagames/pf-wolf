  12: { sprites: [ESPRA0, ESPRB0, ESPRC0], tics: 20 }           # electro-sphere
  13: { sprites: [PROGB8, PROGC8, PROGD8, PROGE8], tics: 20 }   # STAR sentinel walking
  14: { sprites: [GENGA0, GENGB0, GENGC0, GENGD0], tics: 20 }   # genetic guard
  15: { sprites: [MSENA0, MSENB0, MSENC0, MSEND0], tics: 20 }   # mech-sentinel
  16: { sprites: [MHUMA0, MHUMB0, MHUMC0, MHUMD0], tics: 20 }   # mutant human
  18: { sprites: [CNTAF0, CNTAG0, CNTAH0, CNTAI0], tics: 20 }   # large canister alien
  20: { sprites: [CNSAF0, CNSAG0, CNSAH0, CNSAI0], tics: 20 }   # small canister alien
  22: { sprites: [MGURF0, MGURG0, MGURH0, MGURI0], tics: 20 }   # gurney mutant
