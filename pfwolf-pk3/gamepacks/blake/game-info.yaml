# Blake Stone: Aliens of Gold. Phase 0 of Blake Stone support: enough to start a mission and walk
# its floors. Elevators, briefings, the floor-select screen and the rest come in later phases.
default-map:
  # A map's own colors (its map-info code, mapdefs/blake/mapinfo.yaml) win over these
  ceiling-color: "#383838"
  floor-color: "#717171"
  # Blake Stone's distance lighting, as bstone has it for Aliens of Gold (shade_max 51, normal
  # shade divisor 6): no darkening within 4.5 tiles, then 80% x (1 - 4.52 / distance) toward black
  shading:
    fade-color: "#000000"
    fade-start: 4.52
    max-fade: 80
    fade-curve: inverse

signon:
  press-a-key: false

non-shareware-notice: false

title-pics:
  - Title

intro-music: THEME
high-scores-music: THEME
menu-fade-color: "#000000"

screen-fade-style: palette
menu-fade-style: palette
menu-fade-tics: 20
death-fade-style: fizzle
death-fade-tics: 70
death-fade-color: Maroon
death-turn-speed: 2
death-hold-tics: 100
level-fade-style: fizzle
level-fade-tics: 20

hud-messages:
  # Blake Stone always shows its pickup and door messages
  enabled: true
  pickup-style: Default
  lock-style: Default
  obituary-style: Obituary

skills:
  NOVICE:
    name: "Novice Agent"
    pic-name: C_BabyMode
    enemy-health: health.baby
  SKILLED:
    name: "Skilled Agent"
    pic-name: C_Easy
    enemy-health: health.easy
  EXPERT:
    name: "Expert Agent"
    pic-name: C_Normal
    enemy-health: health.normal
  VETERAN:
    name: "Veteran Agent"
    pic-name: C_Hard
    enemy-health: health.hard

# Each mission is 15 MAPTEMP slots: floor 0 (the basement) to floor 10, then four slots the game
# never uses. The game starts a mission on its basement for now; the elevator comes later.
# The missions' pictures (C_Episode1-6) are too tall for this episode menu; they come back with
# Blake Stone's own menus.
episodes:
  MISSION1:
    name: "Mission 1\nSTAR Institute"
    start-map: MAP01
  MISSION2:
    name: "Mission 2\nFloating Fortress"
    start-map: MAP16
