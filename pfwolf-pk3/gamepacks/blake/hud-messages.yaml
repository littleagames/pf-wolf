# Styles for messages (see gamepacks/wolf3d/hud-messages.yaml for every setting). Blake Stone
# shows its messages in the status bar's info area (statusbar.yaml info-area): `anchor: Status`
# puts a style's messages there, one at a time, the newest replacing the last. With no status
# bar showing (the full-screen view), they go over the view's top left.

Default:
  anchor: Status
  x: 0
  y: 0
  margin: 2
  font: HudMessage
  color: White
  duration: 280
  max-lines: 1

# What bio-techs say when talked to: longer, as Blake Stone shows them twice as long
Talk:
  parent: Default
  duration: 600

Center:
  anchor: Center
  color: Yellow
  duration: 140
  max-lines: 2

Obituary:
  parent: Center
  color: White
  duration: 350
  max-lines: 1

Bottom:
  anchor: Bottom
  y: -8
  max-lines: 2
