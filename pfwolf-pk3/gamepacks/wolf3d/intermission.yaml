# The level-end screen. A game pack that builds on this one (spear) uses it as is; a mod's
# intermission.yaml replaces values one by one. Positions are in 320x200 pixels.
#
# font, color: the text's (fonts.yaml font; a color name, #RRGGBB or palette index)
font: IntermissionFont
color: White

# bj: BJ at (x, y), turning to the next of his pics every breath-tics (70 a second) while the
# screen is up
bj:
  x: 0
  y: 16
  pics: [L_GUY, L_GUY2]
  breath-tics: 35

# labels: the text drawn as the screen opens, a $NAME language key or the text itself
labels:
  - { text: "floor\ncompleted", x: 112, y: 16 }
  - { text: "$STR_BONUS", x: 112, y: 56 }
  - { text: "$STR_TIME", x: 128, y: 80 }
  - { text: "$STR_PAR", x: 128, y: 96 }
  - { text: "$STR_RAT2KILL", x: 72, y: 112 }
  - { text: "$STR_RAT2SECRET", x: 40, y: 128 }
  - { text: "$STR_RAT2TREASURE", x: 8, y: 144 }

# values: where each number goes -- from x, or with its right edge at right (for the ones that
# count up). One left out isn't shown. floor, time and par; the bonus; the kill, secret and
# treasure ratios.
values:
  floor: { x: 208, y: 16 }
  time: { x: 208, y: 80 }
  par: { x: 208, y: 96 }
  bonus: { right: 288, y: 56 }
  kill: { right: 296, y: 112 }
  secret: { right: 296, y: 128 }
  treasure: { right: 296, y: 144 }

# sounds: the tally of the time bonus and the kill, secret and treasure ratios (sound names
# from sounds/). Any left out are silent.
#   tally:       every 10% as a ratio counts up, and as the time bonus counts up
#   tally-done:  the time bonus, or a ratio between 1% and 99%, finished counting
#   perfect:     a ratio reached 100%, and its bonus is added
#   none:        a ratio finished at 0%
sounds:
  tally: misc/end_bonus1
  tally-done: misc/end_bonus2
  perfect: misc/100percent
  none: misc/no_bonus

# victory: the screen when a cluster is won, in the same font and color. pics: pictures at
# (x, y), drawn over the labels. values: the won cluster's total time, and its floors' average
# kill, secret and treasure ratios.
victory:
  pics:
    - { pic: L_BJWINS, x: 8, y: 4 }
  labels:
    - { text: "$STR_YOUWIN", x: 144, y: 16 }
    - { text: "$STR_TOTALTIME", x: 112, y: 48 }
    - { text: "averages", x: 96, y: 96 }
    - { text: "$STR_RATKILL", x: 112, y: 112 }
    - { text: "$STR_RATSECRET", x: 80, y: 128 }
    - { text: "$STR_RATTREASURE", x: 48, y: 144 }
  values:
    time: { x: 113, y: 64 }
    kill: { right: 240, y: 112 }
    secret: { right: 240, y: 128 }
    treasure: { right: 240, y: 144 }
