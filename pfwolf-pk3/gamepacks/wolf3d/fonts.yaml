# Fonts text can be printed in, by name. Spear of Destiny starts from these. What each key
# means (vga, graphic and sheet fonts, shadows, outlines, glows) is in the fonts reference:
# https://www.littleagames.com/pf-wolf/docs/latest/reference/fonts

SmallFont:
  type: vga

LargeFont:
  type: vga

# Messages over the 3D view (hud-messages.yaml): the small font, with a shadow so it reads
# against walls and floors
HudMessage:
  type: vga
  source: SmallFont
  shadow: {}

# The status bar's numbers
StatusNumbers:
  type: graphic
  pattern: "FONTN{code:000}"
  chars: " 0123456789"
  cell-width: 8

# The intermission and victory screens' letters and numbers
IntermissionFont:
  type: graphic
  pattern: "FONTL{code:000}"
  chars: "0123456789:%!'ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  cell-width: 16
  line-height: 16
  upper-case: true
  advances:
    ":": 8
    "!": 8
    "'": 8
