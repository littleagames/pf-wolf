# Sprite color translations. How a range is written is in the translations reference:
# https://www.littleagames.com/pf-wolf/docs/latest/reference/translations
# Which one an actor is drawn through is in the manual:
# https://www.littleagames.com/pf-wolf/docs/latest/manual/sprite-colors
#
# Wolf3D's palette has 16-step ramps, light to dark: greys 16:31, red 32:47, yellow 64:79, green
# 96:111, cyan 112:127, blue 144:159, magenta 176:191, and skin to brown 192:223. A guard's tan
# uniform is that skin-to-brown ramp, 198:223, the same colors as his face, so his light tones
# (198:206) are only recolored below his head (the top 10 rows of the sprite); an SS's uniform
# is 144:159, an officer's 16:31, and the player's shirt (sprites/wolf3d/player) 96:111.

# The player's allies (factions.yaml allies), in the player's green
allies: ["207:223=102:111", "198:206=97:101 below 10"]
allies-ss: ["144:159=97:111"]
allies-officer: ["16:31=98:111"]

# Player colors (game-info player-colors), recoloring the player's green shirt; green is it as it is
green: []
red: ["96:111=32:47"]
blue: ["96:111=144:159"]
yellow: ["96:111=64:79"]
cyan: ["96:111=112:127"]
magenta: ["96:111=176:191"]
gray: ["96:111=16:31"]
brown: ["96:111=208:223"]

# Multiplayer team games (Gameplay/MatchModes): the flags on their poles (the banner's reds, 32:47,
# and pinks to red, 48:55, which line up with the light blues 136:143), and a flag carrier
# (sprites/wolf3d/player/flag, PLFG) in their team's shirt with the other team's banner: red's
# carry blue's flag, blue's red's
flag-red: []
flag-blue: ["32:47=144:159", "48:55=136:143"]
flag-neutral: ["32:47=16:31", "48:55=16:23"]
red-carrier: ["96:111=32:47", "32:47=144:159", "48:55=136:143"]
blue-carrier: ["96:111=144:159"]

# Any sprite in shades of grey (a ghostly or stone look)
grayscale: ["1:254=%[0,0,0]:[1,1,1]"]
