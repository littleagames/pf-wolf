    start-map: MAP31
    pic-name: C_EPISODE4
    key: A
  EP05:
    name: "Episode 5\nTrail of the Madman"
    start-map: MAP41
    pic-name: C_EPISODE5
    key: T
  EP06:
    name: "Episode 6\nConfrontation"
    start-map: MAP51
    pic-name: C_EPISODE6
    key: C

