# Wolfenstein 3D, and where each game-info setting is described. The packs built on it (spear,
# wolf3d-shareware, wolf3d-apogee, spear-demo through spear) start from this file, and theirs
# change only what differs; a mod's game-info.yaml works the same way. See
# gamepacks/gamepack-info.yaml for how files combine, and for !remove and !replace.
default-map:
  ceiling-color: "#383838"
  floor-color: "#717171"
  # Textures on every floor and ceiling tile the flat plane (plane 2, see mapdefs flats.yaml)
  # doesn't give one; left out, those tiles keep the colors above. Also settable per map.
  # default-floor: FLOOR1
  # default-ceiling: CEIL1
  # Distance shading, also settable per map (each value a map leaves out comes from here).
  # Left out on both, levels aren't shaded. The sky is never shaded; a state with
  # `modifiers: [bright]` (or an actor with the bright flag) is drawn at full light.
  #   fade-color: #RRGGBB the view fades toward with distance: black for night, grey for fog (default #000000)
  #   fade-start: tiles away, along the view, the fade starts (default 0)
  #   fade-end:   tiles away it reaches max-fade (default 16)
  #   max-fade:   percent toward fade-color at fade-end and beyond (default 100)
  #   light:      light everywhere, 0 (black) to 255 (full, the default)
  # shading:
  #   fade-color: "#000000"
  #   fade-start: 2
  #   fade-end: 20
  # Light zones, also settable per map (a map's zone takes each value it leaves out from the
  # zone of the same id here). A tile's zone is its value on plane 5 (0: none, the level's
  # light). Walls take the light of the tile they're seen from, floors and ceilings their
  # own tile's, sprites the tile they're on. Distance still fades zones as shading says.
  #   light: 0 (black) to 255 (full, the default)
  #   color: #RRGGBB the light is tinted with (default white: no tint)
  #   effect: none (default), flicker (jumps between low and the light at random, up to tics
  #           apart), pulse (glows down to low and back every tics) or strobe (the light for
  #           bright-tics, then low, every tics)
  #   low: the effect's dark end, 0-255 (default half the light)
  #   tics: the effect's timing, 70 a second (default flicker 8, pulse 70, strobe 35)
  #   bright-tics: how long a strobe stays at the light (default 5)
  #   ambient: a sound looped, unplaced, while the player is in the zone (none: silence); a zone
  #            without one leaves what's playing (Gameplay/ZoneAmbience.cs). A zone with only
  #            ambient keys isn't a light zone: its tiles keep the level's light.
  #   ambient-disguised: played in place of ambient while the player wears a disguise
  #   ambient-undetected: played in place of ambient while no enemy has noticed the player
  #            yet on the level (after ambient-disguised, when both apply)
  # Switches and actor states change zones as the level is played (A_SetZoneLight,
  # A_ToggleZoneLight, A_SetZoneEffect: see mapdefs walls.yaml), and saves keep them.
  # zones:
  #   1: { light: 70 }                          # a dim room
  #   2: { light: 255, color: "#FF4040" }       # red emergency lighting
  #   3: { light: 200, effect: flicker, low: 120 }   # a failing lamp
  # Scrolling walls and flats (Midnight Assault's conveyors and waterfalls), per map only, under
  # maps: NAME: scrollers:, by tag (plane 4): the textures of the tiles with that tag slide along.
  #   x: texels a tic (64 a tile, 70 tics a second) a wall face moves right as you look at it,
  #      and a floor or ceiling east; negative the other way (Midnight Assault's fast was 2,
  #      its medium 0.333)
  #   y: texels a tic a wall face moves down, and a floor or ceiling south
  #   walls, floor, ceiling: which surfaces of the tagged tiles scroll (all, left out). Not door
  #      jambs, doors, lintels, arch undersides or wall patches.
  #   active: false waits for a switch to start it (default true)
  # Switches and actor states start, stop and change them as the level is played
  # (A_StartScroll, A_StopScroll, A_ToggleScroll, A_SetScroll: see mapdefs walls.yaml), and
  # saves keep them.
  # maps:
  #   MAP01:
  #     scrollers:
  #       3: { x: 2 }                                   # a conveyor belt
  #       4: { y: 0.5, floor: false, ceiling: false }   # a waterfall down the walls

signon:
  pic: wolf3d-signon
  press-a-key: true
  # The pic's open area, where the startup info is printed (engine, game, mods, video, input,
  # sound, content and any warnings). Optional: font (SmallFont), label-color (TEXTCOLOR),
  # color (HIGHLIGHT), warning-color (READHCOLOR), background (BKGDCOLOR). Left out, none is printed.
  text-area: { x: 16, y: 79, width: 290, height: 101 }

non-shareware-notice: true

# pushwall-distance: 2      # tiles a pushwall slides, unless something stops it sooner (2 when left out)

# Drawn stacked top to bottom
title-pics:
  - Title

intro-music: NAZI_NOR
high-scores-music: ROSTER
menu-fade-color: "#AE0000"

# Fade styles are palette, fizzle, melt or mosaic, each lasting its -tics (70 a second)
screen-fade-style: palette
# screen-fade-tics: 60    # when set, every screen fade takes this long instead of its own length
menu-fade-style: palette
menu-fade-tics: 20
death-fade-style: fizzle
death-fade-tics: 70
death-fade-color: Maroon    # what the view fades to when the player dies
death-turn-speed: 2         # degrees a tic the dead player turns to face their killer
death-hold-tics: 100        # how long the color stays up after the fade (a key skips it)
# death-drop-height: 8      # Doom-style: the dead player's view drops to this many texels above the floor
#                           # (64 a story, 32 standing; 4-60) while turning; left out, it doesn't drop
# death-drop-speed: 1       # texels a tic the view drops
level-fade-style: fizzle
level-fade-tics: 20

# An extra life each time the score passes another this many points (0 or left out: never)
extra-life-score: 40000

# Options → Game Options before the player changes them; a mod can set any of these. Left out,
# each keeps the engine's default (shown). The player's own choice, once made, wins over these
# until they set it back with the console's `default` (e.g. `freelook default`).
#   look:          looking up and down at all: the look keys, a controller's right stick and
#                  mouse look (freelook; m_look stays the player's separate mouse choice)
#   messages:      messages over the view (msg_enabled; hud-messages enabled below still works)
#   automap-stats: the automap's level name, kills, treasure, secrets and time (am_stats)
#   autosave:      each new level saves itself as it starts (autosave)
#   weapon-bob:    the weapon in hand bobs as the player walks (weaponbob; a top-level weapon-bob still works)
#   always-run:    running without holding Run, which then walks (alwaysrun)
#   crosshair:     a crosshair in the middle of the view (crosshair), in crosshair-color
# setting-defaults:
#   look: true
#   messages: false
#   automap-stats: true
#   autosave: true
#   weapon-bob: false
#   always-run: false
#   crosshair: false
# crosshair-color: White      # a color name, #RRGGBB or palette index

# Messages over the view (styles in hud-messages.yaml). enabled is whether they're on before
# the player chooses (msg_enabled; setting-defaults messages wins); off keeps the original
# game's quiet screen. Each kind's style is used when the item, door or killer doesn't name its own.
hud-messages:
  enabled: false
  pickup-style: Default
  lock-style: Center
  obituary-style: Obituary

# The skills, easiest first, as the New Game menu lists them. A skill's place here (0 for the
# first) is what saves record and what mapdefs min-skill compares against.
#   name, pic-name: the menu's text and face picture
#   damage-taken:   how much of the damage the player is dealt they take (left out: 1)
#   enemy-health:   the actordefs property enemies take their health from (e.g. health.normal);
#                   an enemy without it, or a skill without one, uses the enemy's plain health
skills:
  BABY:
    name: "Can I play, Daddy?"
    pic-name: C_BABYMODE
    damage-taken: 0.25
    enemy-health: health.baby
  EASY:
    name: "Don't hurt me."
    pic-name: C_EASY
    enemy-health: health.easy
  MEDIUM:
    name: "Bring 'em on!"
    pic-name: C_NORMAL
    enemy-health: health.normal
  HARD:
    name: "I am Death incarnate!"
    pic-name: C_HARD
    enemy-health: health.hard

# The classes a new game can be played as (actordefs Player, or classes with Player as a parent;
# see actordefs player.yaml), keyed by class, in menu order. The first is the default. Left out,
# or with only one, there's no choosing and the game is played as that class (else Player).
#   name, pic-name: the class menu's text and picture
# class-menu: false keeps them for the multiplayer lobby's "Play as" only (default true).
# player-classes:
#   Player:
#     name: "B.J. Blazkowicz"

# The colors a player picks to be seen in by the others, playing with others (the lobby's Color):
# translations (translations.yaml) recoloring the player's sprites, in menu order; the first is
# the default. "green" is the player sprites' own shirt.
player-colors: [green, red, blue, yellow, cyan, magenta, gray, brown]

# Horde (multiplayer): the waves of enemies sent at the players, first to last, each its classes
# and how many of each. Past the last, each wave is the last again with `grow` more of each
# class; every player past the first brings half as many again. Between waves there's a break
# of `break-seconds`, when dead players come back; `spawn-tics` apart they come in, at most
# `max-alive` of a wave alive at once.
horde:
  waves:
    - enemies: { Mutant: 4 }
    - enemies: { Mutant: 6 }
    - enemies: { Mutant: 8 }
    - enemies: { Mutant: 10 }
    - enemies: { Mutant: 12 }
  grow: 2
  break-seconds: 10
  spawn-tics: 35
  max-alive: 12

# The skill demos are recorded and played back on (left out: the hardest). A demo only replays
# right on the skill it was recorded on, and id's were recorded on HARD.
demo-skill: HARD

# The page articles (Read This, end texts) are laid out on, 320x200: the screen filled with
# background, the frame's pictures drawn in order, the text between the margins (lines of 10
# pixels, in text-color until a ^C) and the page number ({0} the page, {1} how many; show: false
# leaves it out). Each value left out is these, Wolf3D's help window; a game can frame its pages
# with one full-screen picture instead (frame: [ { pic: HELPBACK, x: 0, y: 0 } ]).
article:
  background: BACKCOLOR
  frame:
    - { pic: h_topwindow, x: 0, y: 0 }
    - { pic: h_leftwindow, x: 0, y: 8 }
    - { pic: h_rightwindow, x: 312, y: 8 }
    - { pic: h_bottominfo, x: 8, y: 176 }
  margins: { top: 16, bottom: 32, left: 16, right: 16 }
  text-color: Black
  page-number: { x: 213, y: 183, color: "Dark Yellow", format: "pg {0} of {1}" }

# The New Game menu's episodes. Besides these keys, an episode can have locked-message (listed,
# but picking it shows that text: the shareware's), or starts-locked: true (greyed out, as its
# locked-name if it has one, until its key is unlocked for good by A_Unlock("EP02"), Lua
# game.unlock or the unlock command; kept in progress.cfg)
episodes:
  EP01:
    name: "Episode 1\nEscape from Wolfenstein"
    start-map: MAP01
    pic-name: C_EPISODE1
    key: E
  EP02:
    name: "Episode 2\nOperation: Eisenfaust"
    start-map: MAP11
    pic-name: C_EPISODE2
    key: O
  EP03:
