# Wolfenstein 3D. The packs built on it (spear, wolf3d-shareware, wolf3d-apogee, spear-demo
# through spear) start from this file, and theirs change only what differs; a mod's
# game-info.yaml works the same way. How files combine (and !remove, !replace) is in the manual:
# https://www.littleagames.com/pf-wolf/docs/latest/manual/combining-files
# What each setting does is in the game-info reference:
# https://www.littleagames.com/pf-wolf/docs/latest/reference/game-info
default-map:
  ceiling-color: "#383838"
  floor-color: "#717171"
  # Some of what's left out here, as examples (each also settable per map):
  # default-floor: FLOOR1
  # default-ceiling: CEIL1
  # sky: NightSky
  # floor-sky: RiverValley
  # shading:
  #   fade-color: "#000000"
  #   fade-start: 2
  #   fade-end: 20
  # zones:
  #   1: { light: 70 }                          # a dim room
  #   2: { light: 255, color: "#FF4040" }       # red emergency lighting
  #   3: { light: 200, effect: flicker, low: 120 }   # a failing lamp
  # Scrollers are per map only:
  # maps:
  #   MAP01:
  #     scrollers:
  #       3: { x: 2 }                                   # a conveyor belt
  #       4: { y: 0.5, floor: false, ceiling: false }   # a waterfall down the walls

signon:
  pic: wolf3d-signon
  press-a-key: true
  text-area: { x: 16, y: 79, width: 290, height: 101 }

# pushwall-distance: 2

intro-music: NAZI_NOR
high-scores-music: ROSTER
menu-fade-color: "#AE0000"

title-sequence:
  intro:
    # id's notice that this isn't shareware, until a key
    - menu-background: true
      stripe: 10
      lines:
        - { text: "Attention", x: 110, y: 15, color: READHCOLOR }
        - { text: "This game is NOT shareware.\nPlease do not distribute it.\nThanks.\n\n        Id Software", x: 40, y: 60, color: HIGHLIGHT }
      wait-for-key: true
    # The rating screen, as the title music starts
    - background: Light Blue
      pics: [{ pic: pg13, x: 216, y: 110 }]
      music: NAZI_NOR
      seconds: 7
  loop:
    - pics: [{ pic: Title }]
      seconds: 15
    - pics: [{ pic: credits }]
      seconds: 10
    - high-scores: true
      seconds: 10
    - demo: true

screen-fade-style: palette
# screen-fade-tics: 60
menu-fade-style: palette
menu-fade-tics: 20
death-fade-style: fizzle
death-fade-tics: 70
death-fade-color: Maroon
death-turn-speed: 2
death-hold-tics: 100
# death-drop-height: 8
# death-drop-speed: 1
level-fade-style: fizzle
level-fade-tics: 20

extra-life-score: 40000

# The engine's defaults, which a mod can change:
# setting-defaults:
#   look: true
#   messages: false
#   automap-stats: true
#   autosave: true
#   weapon-bob: false
#   always-run: false
#   crosshair: false
# crosshair-color: White

hud-messages:
  pickup-style: Default
  lock-style: Center
  obituary-style: Obituary

# Easiest first: a skill's place here is what saves record
skills:
  BABY:
    name: "Can I play, Daddy?"
    pic-name: C_BABYMODE
    damage-taken: 0.25
    enemy-health: health.baby
  EASY:
    name: "Don't hurt me."
    pic-name: C_EASY
    enemy-health: health.easy
  MEDIUM:
    name: "Bring 'em on!"
    pic-name: C_NORMAL
    enemy-health: health.normal
  HARD:
    name: "I am Death incarnate!"
    pic-name: C_HARD
    enemy-health: health.hard

# Left out, so Wolf3D is played as Player with no choosing:
# player-classes:
#   Player:
#     name: "B.J. Blazkowicz"

# "green" is the player sprites' own shirt
player-colors: [green, red, blue, yellow, cyan, magenta, gray, brown]

horde:
  waves:
    - enemies: { Mutant: 4 }
    - enemies: { Mutant: 6 }
    - enemies: { Mutant: 8 }
    - enemies: { Mutant: 10 }
    - enemies: { Mutant: 12 }
  grow: 2
  break-seconds: 10
  spawn-tics: 35
  max-alive: 12

# id's demos were recorded on HARD
demo-skill: HARD

article:
  background: BACKCOLOR
  frame:
    - { pic: h_topwindow, x: 0, y: 0 }
    - { pic: h_leftwindow, x: 0, y: 8 }
    - { pic: h_rightwindow, x: 312, y: 8 }
    - { pic: h_bottominfo, x: 8, y: 176 }
  margins: { top: 16, bottom: 32, left: 16, right: 16 }
  text-color: Black
  page-number: { x: 213, y: 183, color: "Dark Yellow", format: "pg {0} of {1}" }

