# Wolfenstein 3D Shareware: episode 1 of Wolf3D. Laid over gamepacks/wolf3d/game-info.yaml
# (the release's base-pack), which says what each setting does; anything not here is Wolf3D's,
# and `!remove` takes one of Wolf3D's out.

# Shareware: no "This game is NOT shareware" notice
non-shareware-notice: false

# Wolf3D's layout, but the level column is a plain floor number: one episode, so no "E1/L"
high-scores:
  show-episode: false

# Every episode is listed, as in the original; picking one with a locked-message (and no
# start-map) shows the message instead of starting it
episodes:
  EP02: { locked-message: $SHAREWARE_EPISODE, start-map: !remove }
  EP03: { locked-message: $SHAREWARE_EPISODE, start-map: !remove }
  EP04: { locked-message: $SHAREWARE_EPISODE, start-map: !remove }
  EP05: { locked-message: $SHAREWARE_EPISODE, start-map: !remove }
  EP06: { locked-message: $SHAREWARE_EPISODE, start-map: !remove }

clusters: { 2: !remove , 3: !remove , 4: !remove , 5: !remove , 6: !remove }

# Episode 1's floors (MAP01-MAP10) are Wolf3D's; the other episodes' aren't in the shareware
# data, and neither are the deathmatch arenas
maps:
  {
    MAP11: !remove , MAP12: !remove , MAP13: !remove , MAP14: !remove , MAP15: !remove ,
    MAP16: !remove , MAP17: !remove , MAP18: !remove , MAP19: !remove , MAP20: !remove ,
    MAP21: !remove , MAP22: !remove , MAP23: !remove , MAP24: !remove , MAP25: !remove ,
    MAP26: !remove , MAP27: !remove , MAP28: !remove , MAP29: !remove , MAP30: !remove ,
    MAP31: !remove , MAP32: !remove , MAP33: !remove , MAP34: !remove , MAP35: !remove ,
    MAP36: !remove , MAP37: !remove , MAP38: !remove , MAP39: !remove , MAP40: !remove ,
    MAP41: !remove , MAP42: !remove , MAP43: !remove , MAP44: !remove , MAP45: !remove ,
    MAP46: !remove , MAP47: !remove , MAP48: !remove , MAP49: !remove , MAP50: !remove ,
    MAP51: !remove , MAP52: !remove , MAP53: !remove , MAP54: !remove , MAP55: !remove ,
    MAP56: !remove , MAP57: !remove , MAP58: !remove , MAP59: !remove , MAP60: !remove ,
    DM01: !remove , DM02: !remove , DM03: !remove , DM04: !remove ,
  }
