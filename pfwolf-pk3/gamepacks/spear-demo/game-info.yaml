# Spear of Destiny demo: Spear's first two floors (see gamepacks/spear/game-info.yaml, and
# gamepacks/wolf3d/game-info.yaml for what each setting does). game-info isn't merged with the
# base pack's, so this is all of it.
default-map:
  ceiling-color: "#383838"
  floor-color: "#717171"

signon:
  pic: spear-signon
  press-a-key: false
  text-area: { x: 16, y: 79, width: 290, height: 101 }

title-pics:
  - Title1
  - Title2
title-palette: TITLEPAL

intro-music: XTOWER2
high-scores-music: XAWARD
menu-fade-color: "#0000CE"
menu-backdrop: C_Backdrop
menu-stripe:
  height: 22
  line-y: 23
  line-color: Black

screen-fade-style: palette
menu-fade-style: palette
menu-fade-tics: 20
death-fade-style: fizzle
death-fade-tics: 70
death-fade-color: Maroon
death-turn-speed: 2
death-hold-tics: 100
level-fade-style: fizzle
level-fade-tics: 20

extra-life-score: 40000

hud-messages:
  enabled: false
  pickup-style: Default
  lock-style: Center
  obituary-style: Obituary

high-scores:
  pic: HighScores
  pic-x: 0
  headers: []
  font: LargeFont
  color: HIGHLIGHT
  name-x: 16
  level-right: 194
  show-episode: false
  won-pic: C_WonSpear
  score-right: 292
  entry-background: "156"
  entry-bar-width: 145
  entry-width: 130

skills:
  BABY:
    name: "Can I play, Daddy?"
    pic-name: C_BABYMODE
    damage-taken: 0.25
    enemy-health: health.baby
  EASY:
    name: "Don't hurt me."
    pic-name: C_EASY
    enemy-health: health.easy
  MEDIUM:
    name: "Bring 'em on!"
    pic-name: C_NORMAL
    enemy-health: health.normal
  HARD:
    name: "I am Death incarnate!"
    pic-name: C_HARD
    enemy-health: health.hard

demo-skill: HARD

episodes:
  EP01:
    start-map: MAP01

maps:
  MAP01:
    next: MAP02
    floor-number: 1
    par-time: 90
    music: XTIPTOE
    ceiling-color: "#044000"
    cluster: 1
  # The demo ends here, as id's SPEARDEMO build does: after the intermission, its message,
  # then the high scores
  MAP02:
    end-message: $SPEARDEMO_END
    floor-number: 2
    par-time: 210
    music: XFUNKIE
    ceiling-color: "#404000"
    cluster: 1

end-strings:
  - $ENDSTR10
  - $ENDSTR11
  - $ENDSTR12
  - $ENDSTR13
  - $ENDSTR14
  - $ENDSTR15
  - $ENDSTR16
  - $ENDSTR17
  - $ENDSTR18
