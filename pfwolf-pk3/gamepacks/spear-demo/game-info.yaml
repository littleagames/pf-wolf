# Spear of Destiny demo: Spear's first two floors. Laid over gamepacks/spear/game-info.yaml
# (and so over gamepacks/wolf3d/game-info.yaml, which says what each setting does); anything
# not here is Spear's.

# Only its first two floors, with no win to reach
maps: !replace
  MAP01:
    next: MAP02
    floor-number: 1
    par-time: 90
    music: XTIPTOE
    ceiling-color: "#044000"
    cluster: 1
  # The demo ends here, as id's SPEARDEMO build does: after the intermission, its message,
  # then the high scores
  MAP02:
    end-message: $SPEARDEMO_END
    floor-number: 2
    par-time: 210
    music: XFUNKIE
    ceiling-color: "#404000"
    cluster: 1

clusters: !remove
