# The game packs, by release. A release with a `base-pack` starts from that pack's actordefs,
# mapdefs, menudefs and gamepacks files (and its base pack's, and so on), loaded under its own
# pack's names; its own files are then laid over them, and a mod's files over all of that.
#
# How the YAML files combine, file over file (a pack's over its base pack's, or several files of
# one asset, such as actordefs/wolf3d/guards.yaml and bosses.yaml):
#   game-info            key by key, all the way down: a pack gives only what it changes
#   actordefs            class by class: a class replaces one of the same name whole, unless it
#                        says `extend: true`, when it changes that one instead: its properties
#                        and states replace those of the same name, its flags are added to the
#                        class's (written ~FLAG, one is taken away), and its parent and radius,
#                        when given, replace the class's
#   mapdefs              entry by entry in each table (things:, walls:, doors:, ...)
#   sound-seq, intermission, presenter, elevator
#                        entry by entry in each section (sound-info:, values:, ...)
#   language, colors, fonts, hud-messages, statusbar, movies, raw-data-map
#                        entry by entry (a string, a color, a font, a status bar part, ...)
#   alias, sounds/sound-seq.yaml
#                        the later file replaces the earlier whole
#   menudefs             a pack's own menu (menudefs/{pack}/NAME.yaml) is used in place of the
#                        shared one; menus don't merge
# A mod's files (it can't carry menudefs) merge key by key all the way down, whichever they are,
# a class without extend too. Lists are always replaced whole. At any level a merge reaches, a
# value can be tagged:
#   key: !remove         takes the key out (a class, a property, a state, a map, a setting...)
#   key: !replace        followed by its own value: replaces what's there whole rather than
#                        merging into it (spear's game-info gives its own maps: this way)
# Where files merge, a key that's left out keeps what's there; to put a setting back to its
# default, !remove it.

wolf3d:
  title: Wolfenstein 3D
  game-info: wolf3d-game-info
  game-palette: wolfpal
  # The GT/id/Activision v1.4 files: their VGAGRAPH is gfxv_wl6.h's layout, which wolf3d's
  # raw-data-map and alias.yaml follow. (Apogee v1.4's has the same audio, maps and VSWAP, but
  # a VGAGRAPH with 12 more "Read This" pictures, as the shareware's does: wolf3d-apogee.)
  file-pack:
    description: Wolfenstein 3D v1.4 (GT/id/Activision)
    file-loaders:
      Wolf3DAudioFileLoader:
        header:
          file: audiohed.wl6
          md5: a41af25a2f193e7d4afbcc4301b3d1ce
        data:
          file: audiot.wl6
          md5: 2385b488b18f8721633e5b2bdf054853
        map: wolf3d-apogee-map
      Wolf3DMapFileLoader:
        header:
          file: maphead.wl6
          md5: b8d2a78bc7c50da7ec9ab1d94f7975e1
        data:
          file: gamemaps.wl6
          md5: a4e73706e100dc0cadfb02d23de46481
        map: wolf3d-apogee-map
      Wolf3DVgaFileLoader:
        dict:
          file: vgadict.wl6
          md5: ccad1a688ebafad9856eca085a20dfc4
        header:
          file: vgahead.wl6
          md5: 9059afb104a51140bd0c127b73717197
        data:
          file: vgagraph.wl6
          md5: f18b07d6ba988b8505415f7446235366
        map: wolf3d-apogee-map
      Wolf3DVswapFileLoader:
        data:
          file: vswap.wl6
          md5: a6d901dfb455dfac96db5e4705837cdb
        map: wolf3d-apogee-map

wolf3d-apogee:
  title: Wolfenstein 3D
  game-palette: wolfpal
  # Apogee's v1.4: the same audio, maps and VSWAP as wolf3d's GT files, under the same names, but
  # a VGAGRAPH with Apogee's layout (as the shareware's), so its own raw-data-map and alias.yaml.
  # Everything else comes from wolf3d's files.
  base-pack: wolf3d
  file-pack:
    description: Wolfenstein 3D v1.4 (Apogee)
    # Its files have wolf3d's names: the md5s are what tell the two apart, and a --game wolf3d
    # with these files plays this pack (GameEngineManager.PickGameType)
    strict-md5: true
    file-loaders:
      Wolf3DAudioFileLoader:
        header:
          file: audiohed.wl6
          md5: a41af25a2f193e7d4afbcc4301b3d1ce
        data:
          file: audiot.wl6
          md5: 2385b488b18f8721633e5b2bdf054853
        map: wolf3d-apogee-map
      Wolf3DMapFileLoader:
