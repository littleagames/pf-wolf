          file: maphead.wl6
          md5: b8d2a78bc7c50da7ec9ab1d94f7975e1
        data:
          file: gamemaps.wl6
          md5: a4e73706e100dc0cadfb02d23de46481
        map: wolf3d-apogee-map
      Wolf3DVgaFileLoader:
        dict:
          file: vgadict.wl6
          md5: adb10b0d6fdddba9fcc3d1a7c16937e7
        header:
          file: vgahead.wl6
          md5: a08905e2b0d299b3fad259f90c0efb1a
        data:
