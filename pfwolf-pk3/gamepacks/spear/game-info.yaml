    ceiling-color: "#28200C"
    cluster: 1
  # Ubermutant
  MAP16:
    next: MAP17
    floor-number: 16
    music: ULTIMATE
    ceiling-color: "#382C14"
    cluster: 1
  MAP17:
    next: MAP18
    floor-number: 17
    par-time: 360
    music: XPUTIT
    ceiling-color: "#006565"
    cluster: 1
