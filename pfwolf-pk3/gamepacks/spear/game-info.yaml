default-map:
  ceiling-color: "#383838"
  floor-color: "#717171"

signon:
  pic: spear-signon
  press-a-key: false

# Drawn stacked top to bottom
title-pics:
  - Title1
  - Title2
title-palette: TITLEPAL

intro-music: XTOWER2
high-scores-music: XAWARD
menu-fade-color: "#0000CE"
menu-backdrop: C_Backdrop

# Fade styles are palette, fizzle, melt or mosaic, each lasting its -tics (70 a second)
screen-fade-style: palette
# screen-fade-tics: 60    # when set, every screen fade takes this long instead of its own length
menu-fade-style: palette
menu-fade-tics: 20
death-fade-style: fizzle
death-fade-tics: 70
level-fade-style: fizzle
level-fade-tics: 20

skills:
  BABY:
    name: "Can I play, Daddy?"
    pic-name: C_BABYMODE
    spawn-filter: [1]
  EASY:
    name: "Don't hurt me."
    pic-name: C_EASY
    spawn-filter: [1, 2]
  MEDIUM:
    name: "Bring 'em on!"
    pic-name: C_NORMAL
    spawn-filter: [1, 2, 3]
  HARD:
    name: "I am Death incarnate!"
    pic-name: C_HARD
    spawn-filter: [1, 2, 3, 4]

episodes:
  EP01:
    start-map: MAP01

clusters:
  1:

maps:
  # Level order, music, par times and ceilings from id's Spear of Destiny tables.
  # Boss and secret levels have no par time.
  MAP01:
    next: MAP02
    floor-number: 1
    par-time: 90
    music: XTIPTOE
    ceiling-color: "#044000"
    cluster: 1
  MAP02:
    next: MAP03
    floor-number: 2
    par-time: 210
    music: XFUNKIE
    ceiling-color: "#404000"
    cluster: 1
  MAP03:
    next: MAP04
    floor-number: 3
    par-time: 165
    music: XDEATH
    ceiling-color: "#383838"
    cluster: 1
  MAP04:
    next: MAP05
    secret-next: MAP19
    floor-number: 4
    par-time: 210
    music: XGETYOU
    ceiling-color: "#382C14"
    cluster: 1
  # Trans Grosse
  MAP05:
    next: MAP06
    floor-number: 5
    music: ULTIMATE
    ceiling-color: "#28200C"
    cluster: 1
  MAP06:
    next: MAP07
    floor-number: 6
    par-time: 270
    music: DUNGEON
    ceiling-color: "#4C0000"
    cluster: 1
  MAP07:
    next: MAP08
    floor-number: 7
    par-time: 195
    music: GOINGAFT
    ceiling-color: "#004040"
    cluster: 1
  MAP08:
    next: MAP09
    floor-number: 8
    par-time: 165
    music: POW
    ceiling-color: "#00004C"
    cluster: 1
  MAP09:
    next: MAP10
    floor-number: 9
    par-time: 285
    music: TWELFTH
    ceiling-color: "#340059"
    cluster: 1
  # Barnacle Wilhelm
  MAP10:
    next: MAP11
    floor-number: 10
    music: ULTIMATE
    ceiling-color: "#004040"
    cluster: 1
  MAP11:
    next: MAP12
    floor-number: 11
    par-time: 390
    music: NAZI_OMI
    ceiling-color: "#383838"
