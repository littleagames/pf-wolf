default-map:
  ceiling-color: "#383838"
  floor-color: "#717171"

signon:
  pic: spear-signon
  press-a-key: false

# Drawn stacked top to bottom
title-pics:
  - Title1
  - Title2
title-palette: TITLEPAL

intro-music: XTOWER2
high-scores-music: XAWARD
menu-fade-color: "#0000CE"
menu-backdrop: C_Backdrop
# id's Spear stripe: a shorter black band, the backdrop showing through one row, then a black line
menu-stripe:
  height: 22
  line-y: 23
  line-color: Black

# Fade styles are palette, fizzle, melt or mosaic, each lasting its -tics (70 a second)
screen-fade-style: palette
# screen-fade-tics: 60    # when set, every screen fade takes this long instead of its own length
menu-fade-style: palette
menu-fade-tics: 20
death-fade-style: fizzle
death-fade-tics: 70
level-fade-style: fizzle
level-fade-tics: 20

# An extra life each time the score passes another this many points: see gamepacks/wolf3d/game-info.yaml
extra-life-score: 40000

# Messages over the view: see gamepacks/wolf3d/game-info.yaml
hud-messages:
  enabled: false
  pickup-style: Default
  lock-style: Center
  obituary-style: Obituary

# id's Spear layout: the title picture carries the column headings, the rows are in the big
# font, and a game won shows the Spear in place of its floor
high-scores:
  pic: HighScores
  pic-x: 0
  headers: []
  font: LargeFont
  color: HIGHLIGHT
  name-x: 16
  level-right: 194
  show-episode: false
  won-pic: C_WonSpear
  score-right: 292
  entry-background: "156"
  entry-bar-width: 145
  entry-width: 130

skills:
  BABY:
    name: "Can I play, Daddy?"
    pic-name: C_BABYMODE
    spawn-filter: [1]
  EASY:
    name: "Don't hurt me."
    pic-name: C_EASY
    spawn-filter: [1, 2]
  MEDIUM:
    name: "Bring 'em on!"
    pic-name: C_NORMAL
    spawn-filter: [1, 2, 3]
  HARD:
    name: "I am Death incarnate!"
    pic-name: C_HARD
    spawn-filter: [1, 2, 3, 4]

episodes:
  EP01:
    start-map: MAP01

# Winning, as id's Spear does it: a long fade to dark teal as the Angel falls, BJ collapsing,
# the win tally, then the ending screens (EndSpear), each in its own palette
clusters:
  1:
    victory-fade-color: "#004444"
    victory-music: XTHEEND
    victory-frames:
      - { pic: BJCOLPS1, x: 124, y: 44, tics: 140 }
      - { pic: BJCOLPS2, x: 124, y: 44, tics: 105 }
      - { pic: BJCOLPS3, x: 124, y: 44, tics: 105 }
      - { pic: BJCOLPS4, x: 124, y: 44, tics: 210 }
    # ENDSCR1/ENDSCR2 are id's ENDSCREEN11PIC/ENDSCREEN12PIC
    end-screens:
      - { pic: ENDSCR1, palette: END1PAL }
      - pic: ENDSCR3
        palette: END3PAL
        caption-color: "208"
        captions:
          - $STR_ENDGAME1
          - $STR_ENDGAME2
      - { pic: ENDSCR4, palette: END4PAL }
      - { pic: ENDSCR5, palette: END5PAL }
      - { pic: ENDSCR6, palette: END6PAL }
      - { pic: ENDSCR7, palette: END7PAL }
      - { pic: ENDSCR8, palette: END8PAL }
      - { pic: ENDSCR9, palette: END9PAL }
      - { pic: ENDSCR2, palette: END2PAL }

maps:
  # Level order, music, par times and ceilings from id's Spear of Destiny tables.
  # Boss and secret levels have no par time.
  MAP01:
    next: MAP02
    floor-number: 1
    par-time: 90
    music: XTIPTOE
    ceiling-color: "#044000"
    cluster: 1
  MAP02:
    next: MAP03
    floor-number: 2
    par-time: 210
    music: XFUNKIE
    ceiling-color: "#404000"
    cluster: 1
  MAP03:
    next: MAP04
    floor-number: 3
    par-time: 165
    music: XDEATH
    ceiling-color: "#383838"
    cluster: 1
  MAP04:
    next: MAP05
    secret-next: MAP19
    floor-number: 4
    par-time: 210
    music: XGETYOU
    ceiling-color: "#382C14"
    cluster: 1
  # Trans Grosse
  MAP05:
    next: MAP06
    floor-number: 5
    music: ULTIMATE
    ceiling-color: "#28200C"
    cluster: 1
  MAP06:
    next: MAP07
    floor-number: 6
    par-time: 270
    music: DUNGEON
    ceiling-color: "#4C0000"
    cluster: 1
  MAP07:
    next: MAP08
    floor-number: 7
    par-time: 195
    music: GOINGAFT
    ceiling-color: "#004040"
    cluster: 1
  MAP08:
    next: MAP09
    floor-number: 8
    par-time: 165
    music: POW
    ceiling-color: "#00004C"
    cluster: 1
  MAP09:
    next: MAP10
    floor-number: 9
    par-time: 285
    music: TWELFTH
    ceiling-color: "#340059"
    cluster: 1
  # Barnacle Wilhelm
  MAP10:
    next: MAP11
    floor-number: 10
    music: ULTIMATE
    ceiling-color: "#004040"
    cluster: 1
  MAP11:
    next: MAP12
    floor-number: 11
    par-time: 390
    music: NAZI_OMI
    ceiling-color: "#383838"
    cluster: 1
  MAP12:
    next: MAP13
    secret-next: MAP20
    floor-number: 12
    par-time: 270
    music: GETTHEM
    ceiling-color: "#382C14"
    cluster: 1
  MAP13:
    next: MAP14
    floor-number: 13
    par-time: 165
    music: SUSPENSE
    ceiling-color: "#28200C"
    cluster: 1
  MAP14:
    next: MAP15
    floor-number: 14
    par-time: 270
    music: SEARCHN
    ceiling-color: "#382C14"
    cluster: 1
  MAP15:
    next: MAP16
    floor-number: 15
    par-time: 360
    music: ZEROHOUR
    ceiling-color: "#28200C"
    cluster: 1
  # Ubermutant
  MAP16:
    next: MAP17
    floor-number: 16
    music: ULTIMATE
    ceiling-color: "#382C14"
    cluster: 1
  MAP17:
    next: MAP18
    floor-number: 17
    par-time: 360
    music: XPUTIT
    ceiling-color: "#006565"
    cluster: 1
  # Death Knight; the Spear of Destiny moves you to MAP21. Leaving any other way goes on
  # to the next map in order, as id's code does.
  MAP18:
    next: MAP19
    floor-number: 18
    music: ULTIMATE
    ceiling-color: "#483818"
    cluster: 1
  # Secret level, from MAP04
  MAP19:
    next: MAP05
    floor-number: 19
    music: XJAZNAZI
    ceiling-color: "#4C0000"
    cluster: 1
  # Secret level, from MAP12
  MAP20:
    next: MAP13
    floor-number: 20
    music: XFUNKIE
    ceiling-color: "#383838"
    cluster: 1
  # Angel of Death; killing it wins the game
  MAP21:
    floor-number: 18
    music: XEVIL
    ceiling-color: "#483818"
    cluster: 1

end-strings:
  - $ENDSTR10
  - $ENDSTR11
  - $ENDSTR12
  - $ENDSTR13
  - $ENDSTR14
  - $ENDSTR15
  - $ENDSTR16
  - $ENDSTR17
  - $ENDSTR18