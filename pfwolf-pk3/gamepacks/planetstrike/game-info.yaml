# Blake Stone: Planet Strike where it differs from Aliens of Gold: laid over
# gamepacks/blake/game-info.yaml (the release's base-pack). Anything not here is Aliens of
# Gold's, and `!replace` gives Planet Strike its own whole block in place of Aliens of Gold's
# rather than merging into it. (Lists, such as title-sequence's intro, are always replaced whole.)

# Planet Strike's weapon sprites fill more of their 64x64 than Aliens of Gold's, so bstone draws
# them 88 high where AOG's are 128 (the 3D view's height)
weapon-scale: 0.6875
# ...and bob it while Blake walks forwards or back (Aliens of Gold's doesn't), until the
# player turns Weapon Bob off in Game Options
setting-defaults:
  weapon-bob: true

# The title loop's music when it's come back to from the menu or a game (bstone's MENUSONG);
# the intro leaves the title music (PLOT) playing the first time
intro-music: LASTLAFF
high-scores-music: HISCORE

# The control panel's music, in place of each menu's (blake's menudefs play Aliens of Gold's)
menu-music: LASTLAFF

# TAB's popup has only the stats (bstone's PopupAutoMap with its map-in-stats switch off, as it
# starts), the floor's score a line further down than Aliens of Gold's
stats-popup: !replace
  pic: FloorStats
  x: 64
  y: 44
  stats: { x: 165, y: 66, font: 2, color: 175, score-gap: 13 }

title-sequence:
  # As the game starts (bstone's PreDemo): Apogee from and to blue, to the end of its fanfare,
  # the JAM logo movie, then the PC-13 rating
  intro:
    - pics: [{ pic: ApogeeLogo }]
      palette: Extra2PAL
      fade-from: "#6474D4"
      music: APOGFNFM
      music-loop: false
      until-music-ends: true
      seconds: 6            # with music off
      fade-to: "#6474D4"
    - movie: IntroMovie
      music: PLOT
    - background: "20"
      pics: [{ pic: ParentalWarning, y: 64 }]
      seconds: 2

  # Until a key is pressed (bstone's DemoLoop): the title (fizzling over to its second picture,
  # which has the copyright lines), the credits on the menu screen, then the high scores. A key
  # during the fizzle finishes it; a key after that goes to the menu.
  loop:
    - pics: [{ pic: TITLE1 }]
      palette: Extra3PAL
      fizzle-pic: TITLE2
      on-key: finish
      seconds: 6
    - pics: [{ pic: LincScreen }]
      text:
        script: CreditsText
        x1: 38
        y1: 28
        x2: 281
        y2: 170
        font: 2
        color: 175
        background: 2
        light: 133
      seconds: 6
    - high-scores: true
      seconds: 9

# One mission: areas 0 to 19 (MAP01-MAP20) and four secret areas (MAP21-MAP24), all kept as
# they're left. It starts in area 0, after its briefing.
episodes: !replace
  PLANETSTRIKE:
    name: "Planet Strike"
    start-map: MAP01
    briefing: Mission1Brief
    end-briefing: Mission1End
    end-movie: EndMovie

clusters: !replace
  1: { hub: true }

# Area names are the game's own (its LEVEL_DESCS text); music is bstone's songs table. Lighting is
# bstone's for the area number mod 6 (shade_max 36/51/62/63/18/52 over normal shade divisor
# 1/6/3/4/1/2): fade-start 4.52 x (divisor / 6) x (51 / shade_max) tiles, max-fade shade_max / 63.
# Areas 1, 7, 13 and 19 have Aliens of Gold's (the default map's). The four secret areas show
# "SECRET 1" to "SECRET 4" on the top bar (level-label) in place of "AREA: n".
