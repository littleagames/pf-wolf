      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: 'A_PlaySound("bs/gguardhalt", "positional")' }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: 'A_SpawnEnemy("ReptilianWarrior", "chase")' }
