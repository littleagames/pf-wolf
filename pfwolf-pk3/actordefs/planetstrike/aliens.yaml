MorphingMutantHuman2:
  parent: Monster
  properties:
    "tag": "$BS_MUTANTHUMAN2"
    "health": 1
    "monster.becomes": "MutantHuman2"
    "monster.wakedelay": [0]
    "switched": kill
  states:
    Spawn:
      - { sprite: MHUM, frames: [Q], tics-per-frame: -1, think: T_WaitToWake }
    Chase:
      - { sprite: MHUM, frames: [Q], tics-per-frame: -1 }
    Wake:
      - { sprite: MHUM, frames: [Q], tics-per-frame: 0, next-state: Death }
    Death:
      - { sprite: MHUM, frames: [Q, R, S, T, U, V, W, X, Y], tics-per-frame: 2 }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: 'A_PlaySound("bs/dogboyhalt", "positional")' }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: 'A_SpawnEnemy("MutantHuman2", "chase")' }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: A_Remove }

# Planet Strike's pod eggs hatch far quicker (7 tics a frame to Aliens of Gold's 45)
PodEgg:
  extend: true
  states:
    Death:
      - { sprite: PODA, frames: [B], tics-per-frame: 7, action: 'A_PlaySound("bs/podhatch", "positional")' }
      - { sprite: PODA, frames: [C, D], tics-per-frame: 7 }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: 'A_SpawnEnemy("PodAlien", "chase")' }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: A_Remove }
