# Planet Strike's sleepers (as actordefs/blake/aliens.yaml's): posts and a statue that come
# alive (bstone's morphing spider mutant, reptilian warrior and mutant human). Each stands as
# scenery until it's shot, a smart switch works it, or (with a time on the map, a 0xFA value
# east of it) that many seconds after Blake first sees it; then it changes over 9 frames into
# the enemy, which comes straight for him. Each counts as the enemy it becomes. Below their
# skill they're plain scenery (mapdefs/planetstrike/decorations.yaml).
MorphingSpiderMutant:
  parent: Monster
  properties:
    "tag": "$BS_SPIDERMUTANT"
    "health": 1
    "monster.becomes": "SpiderMutant"
    "monster.wakedelay": [0]
    "switched": kill
  states:
    Spawn:
      - { sprite: MSUP, frames: [N], tics-per-frame: -1, think: T_WaitToWake }
    # (only so it can be shot)
    Chase:
      - { sprite: MSUP, frames: [N], tics-per-frame: -1 }
    Wake:
      - { sprite: MSUP, frames: [N], tics-per-frame: 0, next-state: Death }
    Death:
      - { sprite: MSUP, frames: [N, O, P, Q, R, S, T, U, V], tics-per-frame: 2 }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: 'A_PlaySound("bs/scanhalt", "positional")' }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: 'A_SpawnEnemy("SpiderMutant", "chase")' }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: A_Remove }

