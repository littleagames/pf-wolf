# The classes every game starts from, each standing for something the engine does in code. What
# each brings is in the manual: https://www.littleagames.com/pf-wolf/docs/latest/manual/built-in-classes
# Their properties are in the actor properties reference:
# https://www.littleagames.com/pf-wolf/docs/latest/reference/actor-properties
Inventory:
  properties:
    "inventory.amount": 1
    "inventory.maxamount": 1
    "inventory.interhubamount": 1
    "inventory.pickupsound": "misc/i_pkup"
  states:
    Hide:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: -1
CustomInventory:
  parent: Inventory
Ammo:
  parent: Inventory
  properties:
    "inventory.pickupsound": "misc/ammo_pkup"
    "inventory.interhubamount": 9999

Health:
  parent: Inventory
  properties:
    "inventory.amount": 1
    "inventory.maxamount": 0
    "inventory.pickupsound": "misc/health_pkup"

BasicArmor:
  parent: Inventory
  properties:
    "armor.saveamount": 100
    "armor.savepercent": 33

Key:
  parent: Inventory
  properties:
    "inventory.pickupsound": "misc/k_pkup"
    "inventory.interhubamount": 0
    "key.lockedmessage": "$LOCKEDDOOR"
    "key.switchlockedmessage": "$LOCKEDSWITCH"
    "key.lockedsound": "player/usefail"
    "key.statusbaremptypic": "nokey"


GoldKey:
  parent: Key
  properties:
    "inventory.pickupmessage": "$GOTGOLDKEY"
    "key.lockedmessage": "$NEEDGOLDKEY"
    "key.switchlockedmessage": "$SWITCHNEEDGOLDKEY"
    "key.statusbarpic": "goldkey"
    "key.statusbarslot": 0
  states:
    Spawn:
      - sprite: GKEY
        frames: [A]
        tics-per-frame: -1

SilverKey:
  parent: Key
  properties:
    "inventory.pickupmessage": "$GOTSILVERKEY"
    "key.lockedmessage": "$NEEDSILVERKEY"
    "key.switchlockedmessage": "$SWITCHNEEDSILVERKEY"
    "key.statusbarpic": "silverkey"
    "key.statusbarslot": 1
  states:
    Spawn:
      - sprite: SKEY
        frames: [A]
        tics-per-frame: -1
ScoreItem:
  parent: Inventory
  flags: [COUNTITEM]
  properties:
    "inventory.amount": 1

BackpackItem:
  parent: Inventory
  flags: [INVENTORY.ALWAYSPICKUP]
  properties:
    "inventory.amount": 1
    "inventory.maxamount": 1
    "inventory.interhubamount": 1

Powerup:
  parent: Inventory
  flags: [INVENTORY.ALWAYSPICKUP]
  properties:
    "inventory.amount": 1
    "inventory.maxamount": 1000000
    "inventory.interhubamount": 0
    "powerup.duration": 2100        # 30 seconds
    "powerup.invulnerable": false
    "powerup.weapon": ""
    "powerup.weaponkills": false
    "powerup.damagetype": ""
    "powerup.attacksound": ""
    "powerup.face": ""
    "powerup.timerstyle": ""
    "powerup.flash": false
    "powerup.endsound": ""

Weapon:
  parent: Inventory
  properties:
    inventory.pickupsound: "misc/w_pkup"
    weapon.ammotype1: "None"
    weapon.ammogive1: 0
    weapon.ammouse1: 0

Monster: {}

BlakeMonster:
  parent: Monster

WeaponGiver:
  parent: Weapon
  properties:
    weapon.ammogive1: -1