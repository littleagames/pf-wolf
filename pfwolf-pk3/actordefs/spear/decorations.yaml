# Spear of Destiny decorations. Everything else comes from actordefs/wolf3d/ through the
# spear release's base-pack; these are the statics Spear replaced or added (see
# mapdefs/spear/decorations.yaml for their map-object numbers). Solid or not follows
# Spear's static-object table: its gibs and cages block, the red light doesn't.

# Replaces Wolf3D's sink (33)
