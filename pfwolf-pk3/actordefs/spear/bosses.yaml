# MAP21. Dodges and backs off (T_Will); fires sparks until it tires after three, then catches
# its breath. Its death wins the game.
AngelOfDeath:
  flags: [AMBUSH]
  states:
    Spawn: # s_angelstand
      - sprite: ANGL
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Chase: # s_angelchase1..4
      - sprite: ANGL
        frames: [A]
        tics-per-frame: 10
        think: T_Will
      - sprite: ANGL
        frames: [A]
        tics-per-frame: 3
      - sprite: ANGL
        frames: [B]
        tics-per-frame: 8
        think: T_Will
      - sprite: ANGL
        frames: [C]
        tics-per-frame: 10
        think: T_Will
      - sprite: ANGL
        frames: [C]
        tics-per-frame: 3
      - sprite: ANGL
        frames: [D]
        tics-per-frame: 8
        think: T_Will
    Attack: # s_angelshoot1
      - sprite: ANGL
        frames: [E]
        tics-per-frame: 10
        action: A_StartAttack
        next-state: Volley
    Volley: # s_angelshoot2..3, repeating until A_Relaunch breaks off
      - sprite: ANGL
        frames: [F]
        tics-per-frame: 20
        action: A_FireProjectile("Spark")
      - sprite: ANGL
        frames: [E]
        tics-per-frame: 10
        action: A_Relaunch
    Tired: # s_angeltired..7
      - sprite: ANGL
        frames: [G]
        tics-per-frame: 40
        action: A_PlaySound("angel/breath")
      - sprite: ANGL
        frames: [H]
        tics-per-frame: 40
      - sprite: ANGL
        frames: [G]
        tics-per-frame: 40
        action: A_PlaySound("angel/breath")
      - sprite: ANGL
        frames: [H]
        tics-per-frame: 40
      - sprite: ANGL
        frames: [G]
        tics-per-frame: 40
        action: A_PlaySound("angel/breath")
      - sprite: ANGL
        frames: [H]
        tics-per-frame: 40
      - sprite: ANGL
        frames: [G]
        tics-per-frame: 40
        action: A_PlaySound("angel/breath")
        next-state: Chase
    Death: # s_angeldie1..8
      - sprite: ANGL
        frames: [A]
        tics-per-frame: 1
        action: A_DeathScream
      - sprite: ANGL
        frames: [A]
        tics-per-frame: 105
      - sprite: ANGL
        frames: [I]
        tics-per-frame: 10
        action: A_Slurpie
      - sprite: ANGL
        frames: [J]
        tics-per-frame: 10
      - sprite: ANGL
        frames: [K]
        tics-per-frame: 10
      - sprite: ANGL
        frames: [L]
        tics-per-frame: 10
      - sprite: ANGL
        frames: [M]
        tics-per-frame: 10
      - sprite: ANGL
        frames: [N]
        tics-per-frame: 10
      - sprite: ANGL
        frames: [O]
        tics-per-frame: 10
        next-state: Victory
    Victory: # s_angeldie9: lies dead for 130 tics, then the game is won
      - sprite: ANGL
        frames: [P]
        tics-per-frame: 130
        action: A_Victory
  properties:
    "health.baby": 1450
    "health.easy": 1550
    "health.normal": 1650
    "health.hard": 2000
    "monster.chasespeed": 1536
    "points": 5000
    "seesound": "angel/sight"
    "deathsound": "angel/death"

# MAP21's ghosts. Drift after the player (T_Ghosts); shot down, they fade and lie dormant,
# then come back once nothing is in the way. Points only for the first kill.
Spectre:
  flags: [AMBUSH, POINTSONCE]
  states:
    Spawn: # s_spectrewait1..4
      - sprite: SPCT
        frames: [A]
        tics-per-frame: 10
        think: T_Stand
      - sprite: SPCT
        frames: [B]
        tics-per-frame: 10
        think: T_Stand
      - sprite: SPCT
        frames: [C]
        tics-per-frame: 10
        think: T_Stand
      - sprite: SPCT
        frames: [D]
        tics-per-frame: 10
        think: T_Stand
    Chase: # s_spectrechase1..4
      - sprite: SPCT
        frames: [A]
        tics-per-frame: 10
        think: T_Ghosts
      - sprite: SPCT
        frames: [B]
        tics-per-frame: 10
        think: T_Ghosts
      - sprite: SPCT
        frames: [C]
        tics-per-frame: 10
        think: T_Ghosts
      - sprite: SPCT
        frames: [D]
        tics-per-frame: 10
        think: T_Ghosts
    Death: # s_spectredie1..4
      - sprite: SPCT
        frames: [E]
        tics-per-frame: 10
      - sprite: SPCT
        frames: [F]
        tics-per-frame: 10
      - sprite: SPCT
        frames: [G]
        tics-per-frame: 10
      - sprite: SPCT
        frames: [H]
        tics-per-frame: 300
        next-state: Dormant
    Dormant: # s_spectrewake, retried every 10 tics until A_Dormant wakes it
      - sprite: SPCT
        frames: [H]
        tics-per-frame: 10
        action: A_Dormant
  properties:
    "health.baby": 5
    "health.easy": 10
    "health.normal": 15
    "health.hard": 25
    "monster.chasespeed": 800
    "points": 200
    "seesound": "ghost/sight"
