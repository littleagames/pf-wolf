# Spear of Destiny bosses, ported from the SPEAR section of wl_act2.cpp (Wolf4SDL): state
# timings, per-difficulty health (starthitpoints), chase speeds (FirstSighting), 5000 points
# and the gold key dropped by all but the Angel (KillActor). Where a death frame waits out the
# death scream, it uses the longer timing the original used with digitized sound.
# AMBUSH: spawned ready to attack as soon as they see the player, whatever the floor tile.

# MAP05. Stands, chases, and fires volleys like Hans.
TransGrosse:
  flags: [AMBUSH]
  states:
    Spawn: # s_transstand
      - sprite: TRNS
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Chase: # s_transchase1..4
      - sprite: TRNS
        frames: [A]
        tics-per-frame: 10
        think: T_Chase
      - sprite: TRNS
        frames: [A]
        tics-per-frame: 3
      - sprite: TRNS
        frames: [B]
        tics-per-frame: 8
        think: T_Chase
      - sprite: TRNS
        frames: [C]
        tics-per-frame: 10
        think: T_Chase
      - sprite: TRNS
        frames: [C]
        tics-per-frame: 3
      - sprite: TRNS
        frames: [D]
        tics-per-frame: 8
        think: T_Chase
    Attack: # s_transshoot1..8
      - sprite: TRNS
        frames: [E]
        tics-per-frame: 30
      - sprite: TRNS
        frames: [F]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: TRNS
        frames: [G]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: TRNS
        frames: [F]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: TRNS
        frames: [G]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: TRNS
        frames: [F]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: TRNS
        frames: [G]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: TRNS
        frames: [E]
        tics-per-frame: 10
        next-state: Chase
    Death: # s_transdie0..4
      - sprite: TRNS
        frames: [A]
        tics-per-frame: 1
        action: A_DeathScream
      - sprite: TRNS
        frames: [A]
        tics-per-frame: 105
      - sprite: TRNS
        frames: [H]
        tics-per-frame: 15
      - sprite: TRNS
        frames: [I]
        tics-per-frame: 15
      - sprite: TRNS
        frames: [J]
        tics-per-frame: 15
      - sprite: TRNS
        frames: [K]
        tics-per-frame: -1
  properties:
    "health.baby": 850
    "health.easy": 950
    "health.normal": 1050
    "health.hard": 1200
    "monster.chasespeed": 1536
    "points": 5000
    "seesound": "trans/sight"
    "deathsound": "trans/death"
    "dropitem": "GoldKey"

