# Lamps and chandeliers give off light. Any actor can, with the light.* properties (in the docs'
# Actor properties reference), and a state's `light:` changes it while the actor is on that
# state (actordefs reference): https://www.littleagames.com/pf-wolf/docs/latest/reference/
FloorLamp:
  radius: 32
  flags: [SOLID]
  properties:
    "prophunt.health": 60
    "light.intensity": 160
    "light.radius": 2.5
  states:
    Spawn:
      - sprite: FLMP
        frames: [A]
        modifiers: [bright]
        tics-per-frame: -1

TallFloorLamp:
  parent: FloorLamp
  states:
    Spawn:
      - sprite: LMP2
        frames: [A]
        modifiers: [bright]
        tics-per-frame: -1

Chandelier:
  properties:
    "prophunt.health": 50
    "light.intensity": 180
    "light.radius": 3
  states:
    Spawn:
      - sprite: CHAN
        frames: [A]
        modifiers: [bright]
        tics-per-frame: -1

Chandelier2:
  parent: Chandelier
  states:
    Spawn:
      - sprite: CHN2
        frames: [A]
        modifiers: [bright]
        tics-per-frame: -1

# A light a switch turns on and off (walls.yaml switch actions A_Activate / A_Deactivate on
# its tile's tag): Active shows it, Inactive hides it (TNT1 draws nothing). It starts on;
# SwitchLightOff starts off. Neither has a mapdefs id yet: place one with `summon`.
SwitchLight:
  parent: Chandelier
  states:
    Active:
      - sprite: CHAN
        frames: [A]
        modifiers: [bright]
        tics-per-frame: -1
    Inactive:
      - sprite: TNT1
        frames: [A]
        light: none
        tics-per-frame: -1

SwitchLightOff:
  parent: SwitchLight
  states:
    Spawn:
      - sprite: TNT1
        frames: [A]
        light: none
        tics-per-frame: -1

