# Prop Hunt (Gameplay/MatchModes/PropHunt.cs): "prophunt.health" is the most health a prop has
# looking like the decoration, 1-100 (inherited): big and sturdy things the most, small ones
# a shot or two. Left out, it goes by the radius (50, up to 100 at 32). NODISGUISE keeps a
# decoration from being a disguise at all.
Puddle:
  flags: [NODISGUISE]     # flat on the floor: no Prop Hunt prop looks like it
  states:
    Spawn:
      - sprite: WATR
        frames: [A]
        tics-per-frame: -1

Puddle2:
  parent: Puddle
  states:
    Spawn:
      - sprite: WTR2
        frames: [A]
        tics-per-frame: -1

