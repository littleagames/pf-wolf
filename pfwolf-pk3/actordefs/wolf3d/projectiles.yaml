# =============================================================================
# DRAFT - converted from WL_ACT2.C and WL_STATE.C
#
# Supporting projectile / FX actors spawned by the boss attacks in
# actordefs/wolf3d/bosses.yaml. None of these are placed on maps directly;
# they're only ever created at runtime by A_FireProjectile (Gift/Fat's
# rockets, Schabbs' needles, Fake Hitler's fire: vanilla's T_GiftThrow,
# T_SchabbThrow and T_FakeFire), at their `speed` (0x2000 without one), and
# moved by the A_Projectile think once spawned. A_Projectile(min, max) is
# the damage range on a player hit.
#
# This mirrors the actordefs/wolf3d/{decorations,ammo,weapons}.yaml schema
# (states: sprite/frames/tics-per-frame/think/action/next-state, plus a flat
# properties list). No "id" fields are set here because these actors aren't
# placed by map-object number the way decorations are.
#
# Sounds: attacksound values below use the new path-style names inferred
# from sounds/sound-seq.yaml, replacing old raw identifiers still used in
# the source ("MISSILEFIRE", "MISSILEHIT", "SCHABBSTHROW", "FLAMETHROWER")
# -- see the header comment in bosses.yaml for how those were inferred.
#
# Projectile flags: BURSTONPLAYER goes to its Death state on whoever it hits, as on a wall
# (without it, a projectile that hits someone just vanishes); HURTMONSTERS hurts the enemies
# it flies into too, not only the players (never its own shooter).
#
# Any actor, not only an enemy, can fire one (Gameplay/ProjectileActions.cs), which makes traps:
#   A_SpawnProjectile("Rocket"[, angle[, "relative"|"absolute"|"aim"]])
#       in degrees, positive turning left: relative to its facing (the default), absolute
#       from east (90 north), or aimed at the nearest player and turned by the angle. The
#       projectile's speed, speed.random, spread and attacksound apply. One standing inside a
#       wall (mapdefs `in-wall: true`) fires from just beyond the face it looks out of.
#   A_Jump(chance, "State"[, "State2"...])   chance in 256, to one of the states at random
#   A_JumpIfPlayerWithin(tiles, "State")     a player within that many tiles each way
#   A_JumpIfInSight("State"[, tiles])        a clear line to a player (in a wall: in front of its face)
# examples/mods/fireball-demo uses them all, and a Lua script's action (scripts/*.lua: see
# Scripting/GameScripts.cs and examples/README.md) for its ring of fireballs.
# =============================================================================

# Thrown by Gift/Fat (A_FireProjectile); trails Smoke, explodes (its Death state)
# on impact with a wall, or damages the player directly on contact.
Rocket:
  flags: [PROJECTILE]
  states:
    Spawn: # s_rocket / T_Projectile, A_Smoke
      - sprite: ROCK
        frames: [A]
        tics-per-frame: 3
        think: A_Projectile(30, 61) # (random()>>3) + 30
        action: A_SpawnThing("Smoke")
    Death: # s_boom1..3: its wall-impact explosion
      - sprite: BOOM
        frames: [A]
        tics-per-frame: 6
      - sprite: BOOM
        frames: [B]
        tics-per-frame: 6
      - sprite: BOOM
        frames: [C]
        tics-per-frame: 6
        action: A_Remove # legacy s_boom3 had no next state, which removed the object
  properties:
    "attacksound": "missile/fire" # was "MISSILEFIRE"
    "deathsound": "missile/hit" # was "MISSILEHIT"

# Spawned continuously behind a moving Rocket by A_SpawnThing.
Smoke:
  states:
    Spawn: # s_smoke1..4
      - sprite: SMOK
        frames: [A]
        tics-per-frame: 6 # legacy A_Smoke started each puff at ticcount 6, not s_smoke1's 3
      - sprite: SMOK
        frames: [B]
        tics-per-frame: 3
      - sprite: SMOK
        frames: [C]
        tics-per-frame: 3
      - sprite: SMOK
        frames: [D]
        tics-per-frame: 3
        action: A_Remove # legacy s_smoke4 had no next state, which removed the object

# Thrown by Schabbs (A_FireProjectile); no wall-impact effect, just vanishes.
# Damage on player hit: (random()>>3) + 20.
Needle:
  flags: [PROJECTILE]
  states:
    Spawn: # s_needle1..4 / T_Projectile
      - sprite: HYPO
        frames: [A]
        tics-per-frame: 6
        think: A_Projectile(20, 51)
      - sprite: HYPO
        frames: [B]
        tics-per-frame: 6
        think: A_Projectile(20, 51)
      - sprite: HYPO
        frames: [C]
        tics-per-frame: 6
        think: A_Projectile(20, 51)
      - sprite: HYPO
        frames: [D]
        tics-per-frame: 6
        think: A_Projectile(20, 51)
  properties:
    "attacksound": "schabbs/throw" # was "SCHABBSTHROW"

# Fake Hitler's flamethrower stream (A_FireProjectile); one spawned per Attack
# frame, forming a continuous line toward the player.
# Damage on player hit: random()>>3 (no floor added, unlike Rocket/Needle).
Fire:
  flags: [PROJECTILE]
  states:
    Spawn: # s_fire1..2 / T_Projectile
      - sprite: FIRE
        frames: [A]
        tics-per-frame: 6
        think: A_Projectile(0, 31)
      - sprite: FIRE
        frames: [B]
        tics-per-frame: 6
        think: A_Projectile(0, 31)
  properties:
    "attacksound": "flame/fire" # was "FLAMETHROWER"
    "speed": 4608 # 0x1200, slower than the rockets' and needles' 0x2000
