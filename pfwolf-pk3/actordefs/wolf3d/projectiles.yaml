# The bosses' projectiles and the rocket's smoke: Rocket (Giftmacher's and Fettgesicht's),
# Needle (Schabbs'), Fire (Fake Hitler's), as id's WL_ACT2.C has them, checked against it on
# 2026-10-21. A_Projectile(min, max) is id's T_Projectile, with its damage on a hit.
#
# Where PFWolf differs from id's on purpose:
#   - Fire moves every tic (A_Projectile is its think), as Wolf4SDL's does. id's ran
#     T_Projectile as the frame's action, so the flames moved once every 6 tics.
#   - The rocket's explosion and the smoke end with A_Remove; id's last states had no next
#     state, which removed them.
#
# Any actor can fire these (A_SpawnProjectile, for traps): examples/mods/fireball-demo shows how.
# =============================================================================

# Thrown by Gift/Fat (A_FireProjectile); trails Smoke, explodes (its Death state)
# on impact with a wall, or damages the player directly on contact.
Rocket:
  flags: [PROJECTILE]
  states:
    Spawn: # s_rocket / T_Projectile, A_Smoke
      - sprite: ROCK
        frames: [A]
        tics-per-frame: 3
        think: A_Projectile(30, 61) # (random()>>3) + 30
        action: A_SpawnThing("Smoke")
    Death: # s_boom1..3: its wall-impact explosion
      - sprite: BOOM
        frames: [A]
        tics-per-frame: 6
      - sprite: BOOM
        frames: [B]
        tics-per-frame: 6
      - sprite: BOOM
        frames: [C]
        tics-per-frame: 6
        action: A_Remove # legacy s_boom3 had no next state, which removed the object
  properties:
    "attacksound": "missile/fire" # id's MISSILEFIRESND
    "deathsound": "missile/hit" # id's MISSILEHITSND

# Spawned continuously behind a moving Rocket by A_SpawnThing.
Smoke:
  states:
    Spawn: # s_smoke1..4
      - sprite: SMOK
        frames: [A]
        tics-per-frame: 6 # legacy A_Smoke started each puff at ticcount 6, not s_smoke1's 3
      - sprite: SMOK
        frames: [B]
        tics-per-frame: 3
      - sprite: SMOK
        frames: [C]
        tics-per-frame: 3
      - sprite: SMOK
        frames: [D]
        tics-per-frame: 3
        action: A_Remove # legacy s_smoke4 had no next state, which removed the object

# Thrown by Schabbs (A_FireProjectile); no wall-impact effect, just vanishes.
# Damage on player hit: (random()>>3) + 20.
Needle:
  flags: [PROJECTILE]
  states:
    Spawn: # s_needle1..4 / T_Projectile
      - sprite: HYPO
        frames: [A]
        tics-per-frame: 6
        think: A_Projectile(20, 51)
      - sprite: HYPO
        frames: [B]
        tics-per-frame: 6
        think: A_Projectile(20, 51)
      - sprite: HYPO
        frames: [C]
        tics-per-frame: 6
        think: A_Projectile(20, 51)
      - sprite: HYPO
        frames: [D]
        tics-per-frame: 6
        think: A_Projectile(20, 51)
  properties:
    "attacksound": "schabbs/throw" # id's SCHABBSTHROWSND

# Fake Hitler's flamethrower stream (A_FireProjectile); one spawned per Attack
# frame, forming a continuous line toward the player.
# Damage on player hit: random()>>3 (no floor added, unlike Rocket/Needle).
Fire:
  flags: [PROJECTILE]
  states:
    Spawn: # s_fire1..2 / T_Projectile (id's as the action: see the top)
      - sprite: FIRE
        frames: [A]
        tics-per-frame: 6
        think: A_Projectile(0, 31)
      - sprite: FIRE
        frames: [B]
        tics-per-frame: 6
        think: A_Projectile(0, 31)
  properties:
    "attacksound": "flame/fire" # id's FLAMETHROWERSND
    "speed": 4608 # 0x1200, slower than the rockets' and needles' 0x2000
