# =============================================================================
# DRAFT - converted from Program.WL_ACT2.cs and Program.WL_STATE.cs
#
# Supporting projectile / FX actors spawned by the boss attacks in
# actordefs/wolf3d/bosses.yaml. None of these are placed on maps directly;
# they're only ever created at runtime by T_GiftThrow (Gift/Fat),
# T_SchabbThrow (Schabbs), T_FakeFire (Fake Hitler), or the T_Projectile
# think that moves them once spawned.
#
# This mirrors the actordefs/wolf3d/{decorations,ammo,weapons}.yaml schema
# (states: sprite/frames/tics-per-frame/think/action/next-state, plus a flat
# properties list). No "id" fields are set here because these actors aren't
# placed by map-object number the way decorations are.
#
# Sounds: attacksound values below use the new path-style names inferred
# from sounds/sound-seq.yaml, replacing old raw identifiers still used in
# the source ("MISSILEFIRE", "MISSILEHIT", "SCHABBSTHROW", "FLAMETHROWER")
# -- see the header comment in bosses.yaml for how those were inferred.
# =============================================================================

# Thrown by Gift/Fat (T_GiftThrow); explodes into Smoke/Boom on impact
# with a wall, or damages the player directly on contact.
Rocket:
  flags: [PROJECTILE]
  states:
    Spawn: # s_rocket / T_Projectile, A_Smoke
      - sprite: ROCK
        frames: [A]
        tics-per-frame: 3
        think: T_Projectile
        action: A_Smoke
  properties:
    "attacksound": "missile/fire" # was "MISSILEFIRE"
    "deathsound": "missile/hit" # was "MISSILEHIT"
    # Damage on player hit: (random()>>3) + 30.
    "projectile.damage": 30
    "projectile.smoke": Smoke
    "projectile.explosion": Boom

# Spawned continuously behind a moving Rocket by A_Smoke.
Smoke:
  states:
    Spawn: # s_smoke1..4
      - sprite: SMOK
        frames: [A]
        tics-per-frame: 3
      - sprite: SMOK
        frames: [B]
        tics-per-frame: 3
      - sprite: SMOK
        frames: [C]
        tics-per-frame: 3
      - sprite: SMOK
        frames: [D]
        tics-per-frame: 3
        action: A_Remove # legacy s_smoke4 had no next state, which removed the object

# Rocket's wall-impact explosion.
Boom:
  states:
    Spawn: # s_boom1..3
      - sprite: BOOM
        frames: [A]
        tics-per-frame: 6
      - sprite: BOOM
        frames: [B]
        tics-per-frame: 6
      - sprite: BOOM
        frames: [C]
        tics-per-frame: 6
        action: A_Remove # legacy s_boom3 had no next state, which removed the object

# Thrown by Schabbs (T_SchabbThrow); no wall-impact effect, just vanishes.
Needle:
  flags: [PROJECTILE]
  states:
    Spawn: # s_needle1..4 / T_Projectile
      - sprite: HYPO
        frames: [A]
        tics-per-frame: 6
        think: T_Projectile
      - sprite: HYPO
        frames: [B]
        tics-per-frame: 6
        think: T_Projectile
      - sprite: HYPO
        frames: [C]
        tics-per-frame: 6
        think: T_Projectile
      - sprite: HYPO
        frames: [D]
        tics-per-frame: 6
        think: T_Projectile
  properties:
    "attacksound": "schabbs/throw" # was "SCHABBSTHROW"
    # Damage on player hit: (random()>>3) + 20.
    "projectile.damage": 20

# Fake Hitler's flamethrower stream (T_FakeFire); one spawned per Attack
# frame, forming a continuous line toward the player.
Fire:
  flags: [PROJECTILE]
  states:
    Spawn: # s_fire1..2 / T_Projectile
      - sprite: FIRE
        frames: [A]
        tics-per-frame: 6
        think: T_Projectile
      - sprite: FIRE
        frames: [B]
        tics-per-frame: 6
        think: T_Projectile
  properties:
    "attacksound": "flame/fire" # was "FLAMETHROWER"
    # Damage on player hit: random()>>3 (no floor added, unlike Rocket/Needle).
    "projectile.damage": 0
