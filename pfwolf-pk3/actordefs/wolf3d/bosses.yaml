# dying outright.
# -----------------------------------------------------------------------
MechaHitler:
  states:
    Spawn: # s_mechastand / T_Stand
      - sprite: MECH
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    # No Pain state.
    Attack: # s_mechashoot1..6 / T_Shoot
      - sprite: MECH
        frames: [A]
