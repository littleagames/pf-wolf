# -----------------------------------------------------------------------
# Dr. Schabbs (classtypes.schabbobj / enemytypes.en_schabbs)
# Uses a custom dodge/retreat think (T_Schabb) instead of plain T_Chase,
# and throws a Needle projectile rather than shooting.
# -----------------------------------------------------------------------
Schabbs:
  states:
    Spawn: # s_schabbstand / T_Stand
      - sprite: SHAB
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    # No Pain state.
    Attack: # s_schabbshoot1..2 / T_SchabbThrow
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 30
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 10
        action: T_SchabbThrow
        next-state: Chase
    Chase: # s_schabbchase1..4 / T_Schabb (dodges/retreats, throws needles)
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 10
        think: T_Schabb
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 3
      - sprite: SHAB
        frames: [B]
        tics-per-frame: 8
        think: T_Schabb
      - sprite: SHAB
        frames: [C]
        tics-per-frame: 10
        think: T_Schabb
      - sprite: SHAB
        frames: [C]
        tics-per-frame: 3
      - sprite: SHAB
        frames: [D]
        tics-per-frame: 8
        think: T_Schabb
    # Single-frame state used elsewhere to trigger the end-of-level death
    # camera sequence before playing the real death animation.
    DeathCam:
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 1
        next-state: Death
    Death: # s_schabbdie1..6 / A_DeathScream, A_StartDeathCam
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 10
        action: A_DeathScream
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 10
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 10
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 10
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 10
      - sprite: SHAB
        frames: [A]
        tics-per-frame: 20
        action: A_StartDeathCam
  properties:
    "health.baby": 850
    "health.easy": 950
    "health.normal": 1550
    "health.hard": 2400
    "speed": 512
    "monster.chasespeedmultiplier": 3
    "points": 5000
    "seesound": "schabbs/sight" # inferred, was "SCHABBSHA"
    "attacksound": "schabbs/throw" # was "SCHABBSTHROW"
    "deathsound": "schabbs/death"
    # No dropitem -- KillActor has no PlaceItemType call for schabbobj.
    # Sets gamestate.killx/killy to the player's position on death (feeds
    # the death-cam sequence); not representable as a static property.
    # Reaction delay after first sighting: fixed 1 tic.

