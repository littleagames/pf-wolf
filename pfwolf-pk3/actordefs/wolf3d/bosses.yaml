# -----------------------------------------------------------------------
# Real Hitler (classtypes.realhitlerobj) -- not in enemytypes; spawned
# only by A_HitlerMorph when Mecha Hitler's suit is destroyed, already in
# the Chase state at 5x speed. Hitpoints come from a separate hardcoded
# array in A_HitlerMorph, not from `starthitpoints`.
# -----------------------------------------------------------------------
RealHitler:
  states:
    # Only present so the actor initializes cleanly; A_HitlerMorph spawns
    # directly into Chase and never uses this state in practice.
    Spawn:
      - sprite: HTLR
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    # No Pain state.
    Attack: # s_hitlershoot1..6 / T_Shoot
      - sprite: HTLR
        frames: [A]
        tics-per-frame: 30
      - sprite: HTLR
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: HTLR
        frames: [A]
        tics-per-frame: 10
