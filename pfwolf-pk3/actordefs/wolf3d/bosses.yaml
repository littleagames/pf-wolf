# =============================================================================
# DRAFT - converted from Program.WL_ACT2.cs and Program.WL_STATE.cs
#
# Unique story bosses: Hans Grosse, Gretel Grosse, Dr. Schabbs, Otto
# Giftmacher, General Fettgesicht, Fake Hitler, Mecha Hitler, Real Hitler.
# All of these are always ambush-spawned stationary (SpawnBoss et al. set
# FL_SHOOTABLE | FL_AMBUSH directly) -- none of them patrol, so unlike
# actordefs/wolf3d/guards.yaml, none of these define a "Path" state.
# Standard rank-and-file enemies (Guard/Officer/SS/Mutant/Dog) live in
# actordefs/wolf3d/guards.yaml, the Pac-Man-bonus-level ghosts live in
# actordefs/wolf3d/ghosts.yaml, and the projectile/FX actors these bosses'
# attacks spawn (Rocket/Needle/Fire/Smoke/Boom) live in
# actordefs/wolf3d/projectiles.yaml.
#
# This mirrors the actordefs/wolf3d/{decorations,ammo,weapons}.yaml schema
# (states: sprite/frames/tics-per-frame/think/action/next-state, plus a flat
# properties list). No "id" fields are set here because these actors aren't
# spawned directly by map-object number the way decorations are.
#
# Judgment calls made during this conversion (please double check):
#
# 1. Sounds: PlaySoundLocActor()/_audioManager.Play() calls in the source
#    still use old raw Wolf3D sound identifiers (e.g. "GUTENTAG", "KEIN",
#    "EINE", "ERLAUBEN", "SCHABBSHA", "TOT_HUND", "DIE", "BOSSFIRE") that
#    were never renamed to the new path-style names used everywhere else
#    (sounds/sound-seq.yaml). A few call sites (A_DeathScream) *have*
#    already been updated to path-style names, which is what let me infer
#    the rest by cross-referencing sounds/sound-seq.yaml's digitized/adlib/
#    pc entries (e.g. "GUTENTAG" is Hans's greeting shout -> hans/sight,
#    DSHANSIT). These inferred names are marked "# inferred" below --
#    please verify against actual Wolf3D sound lore before relying on them.
# 2. `rotate` in the C# statestruct is 0 for all of these (bosses use
#    single/front-facing sprites, never 8-directional). Not represented
#    here -- the engine determines this from how many rotation variants
#    exist for a given sprite name, so no flag is needed.
# 3. Health that varies by skill (all of these) is broken out as
#    `health.baby` / `health.easy` / `health.normal` / `health.hard`
#    (Wolf3D's four difficulties, in order) since there's no established
#    single-property convention for skill-scaled health yet.
# 4. `monster.chasespeedmultiplier` captures the `ob.speed *=` factor
#    FirstSighting applies once an enemy notices the player (source speed
#    is the `speed` property below; all of these use SPDPATROL=512 except
#    Real Hitler, which is born already fast).
# 5. Reaction delay (how many tics an enemy waits after first spotting the
#    player before acting, from SightPlayer) and other pure-behavior details
#    that don't fit the properties schema are left as comments rather than
#    invented property keys.
# 6. Not included here: the BJ-victory end-of-episode cutscene actor
#    (SpawnBJVictory / s_bjrun*/s_bjjump*) and the standalone death-cam
#    actor (s_deathcam) -- neither is an enemy.
# =============================================================================

# -----------------------------------------------------------------------
# Hans Grosse (classtypes.bossobj / enemytypes.en_boss)
# -----------------------------------------------------------------------
Hans:
  states:
    Spawn: # s_bossstand / T_Stand
      - sprite: HANS
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    # No Pain state -- Hans never flinches.
    Attack: # s_bossshoot1..8, a long volley / T_Shoot
      - sprite: HANS
        frames: [A]
        tics-per-frame: 30
      - sprite: HANS
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: HANS
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: HANS
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: HANS
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: HANS
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: HANS
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: HANS
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
    Chase: # s_bosschase1..4 / T_Chase
      - sprite: HANS
        frames: [A]
        tics-per-frame: 10
        think: T_Chase
      - sprite: HANS
        frames: [A]
        tics-per-frame: 3
      - sprite: HANS
        frames: [B]
        tics-per-frame: 8
        think: T_Chase
      - sprite: HANS
        frames: [C]
        tics-per-frame: 10
        think: T_Chase
      - sprite: HANS
        frames: [C]
        tics-per-frame: 3
      - sprite: HANS
        frames: [D]
        tics-per-frame: 8
        think: T_Chase
    Death: # s_bossdie1..4 / A_DeathScream
      - sprite: HANS
        frames: [A]
        tics-per-frame: 15
        action: A_DeathScream
      - sprite: HANS
        frames: [A]
        tics-per-frame: 15
      - sprite: HANS
        frames: [A]
        tics-per-frame: 15
      - sprite: HANS
        frames: [A]
        tics-per-frame: -1
  properties:
    "health.baby": 850
    "health.easy": 950
    "health.normal": 1050
    "health.hard": 1200
    "speed": 512
    "monster.chasespeedmultiplier": 3
    "points": 5000
    "seesound": "hans/sight" # inferred, was "GUTENTAG"
    "attacksound": "hans/attack" # was "BOSSFIRE"
    "deathsound": "hans/death"
    "dropitem": "GoldKey"
    # Sharpshooter like SS: T_Shoot halves Hans's effective distance
    # penalty (dist = dist * 2 / 3) when rolling to hit the player.
    "monster.sharpshooter": true
    # Reaction delay after first sighting: fixed 1 tic.

