        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: MECH
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: MECH
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: MECH
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: MECH
        frames: [A]
        tics-per-frame: 10
