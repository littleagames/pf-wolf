        tics-per-frame: 3
      - sprite: OFFI
        frames: [E]
        tics-per-frame: 8
        think: T_Chase
    Death: # s_ofcdie1..5 / A_DeathScream
      - sprite: OFFI
        frames: [A]
        tics-per-frame: 11
        action: A_DeathScream
      - sprite: OFFI
        frames: [A]
