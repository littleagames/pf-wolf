# -----------------------------------------------------------------------
# SS (classtypes.ssobj / enemytypes.en_ss)
# -----------------------------------------------------------------------
SS:
  states:
    Spawn: # s_ssstand / T_Stand
      - sprite: SSWV
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Path: # s_sspath1..4 / T_Path
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 20
        think: T_Path
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 5
      - sprite: SSWV
        frames: [B]
        tics-per-frame: 15
        think: T_Path
      - sprite: SSWV
        frames: [C]
        tics-per-frame: 20
        think: T_Path
      - sprite: SSWV
        frames: [C]
        tics-per-frame: 5
      - sprite: SSWV
        frames: [D]
        tics-per-frame: 15
        think: T_Path
    Pain: # s_sspain / s_sspain1
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
    # SS unload a long 9-frame burst (s_ssshoot1..9) instead of one shot.
    Attack:
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 20
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 20
        action: T_Shoot
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
    Chase: # s_sschase1..4 / T_Chase
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
        think: T_Chase
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 3
      - sprite: SSWV
        frames: [B]
        tics-per-frame: 8
        think: T_Chase
      - sprite: SSWV
        frames: [C]
        tics-per-frame: 10
        think: T_Chase
      - sprite: SSWV
        frames: [C]
        tics-per-frame: 3
      - sprite: SSWV
        frames: [D]
        tics-per-frame: 8
        think: T_Chase
    Death: # s_ssdie1..4 / A_DeathScream
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 15
        action: A_DeathScream
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 15
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 15
      - sprite: SSWV
        frames: [A]
        tics-per-frame: -1
  properties:
    "health": 100
    "speed": 512
    "monster.chasespeedmultiplier": 4
    "points": 500
    "seesound": "wolfss/sight" # inferred, was "SCHUTZAD"
    "attacksound": "wolfss/attack" # was "SSFIRE"
    "deathsound": "wolfss/death"
    "dropitem": "Clip"
    # SS are better shots: T_Shoot halves their effective distance penalty
    # (dist = dist * 2 / 3) when rolling to hit the player.
    "monster.sharpshooter": true
    # KillActor drops a MachineGun instead of a Clip if the player's
    # bestweapon is below wp_machinegun -- not represented by a single
    # `dropitem` value.
    # Reaction delay after first sighting: 1 + random()/6 tics.

# -----------------------------------------------------------------------
# Mutant (classtypes.mutantobj / enemytypes.en_mutant)
# -----------------------------------------------------------------------
Mutant:
  states:
    Spawn: # s_mutstand / T_Stand
      - sprite: MTNT
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Path: # s_mutpath1..4 / T_Path
      - sprite: MTNT
        frames: [B]
        tics-per-frame: 20
        think: T_Path
      - sprite: MTNT
        frames: [B]
        tics-per-frame: 5
      - sprite: MTNT
        frames: [C]
        tics-per-frame: 15
        think: T_Path
      - sprite: MTNT
        frames: [D]
        tics-per-frame: 20
        think: T_Path
      - sprite: MTNT
        frames: [D]
        tics-per-frame: 5
      - sprite: MTNT
        frames: [E]
        tics-per-frame: 15
        think: T_Path
    Pain: # s_mutpain / s_mutpain1
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
    # Mutant fires twice in one attack cycle (s_mutshoot1..4).
    Attack:
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 6
        action: T_Shoot
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 20
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 20
        next-state: Chase
    Chase: # s_mutchase1..4 / T_Chase
      - sprite: MTNT
        frames: [B]
        tics-per-frame: 10
        think: T_Chase
      - sprite: MTNT
        frames: [B]
        tics-per-frame: 3
      - sprite: MTNT
        frames: [C]
        tics-per-frame: 8
        think: T_Chase
      - sprite: MTNT
        frames: [D]
        tics-per-frame: 10
        think: T_Chase
      - sprite: MTNT
        frames: [D]
        tics-per-frame: 3
      - sprite: MTNT
        frames: [E]
        tics-per-frame: 8
        think: T_Chase
    Death: # s_mutdie1..5 / A_DeathScream
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 7
        action: A_DeathScream
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 7
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 7
      - sprite: MTNT
        frames: [A]
        tics-per-frame: 7
      - sprite: MTNT
        frames: [A]
        tics-per-frame: -1
  properties:
    "health.baby": 45
    "health.easy": 55
    "health.normal": 55
    "health.hard": 65
    "speed": 512
    "monster.chasespeedmultiplier": 3
    "points": 700
    "attacksound": "mutant/attack" # was "NAZIFIRE" (generic soldier gunfire); no seesound in source
    "deathsound": "mutant/death"
    "dropitem": "Clip"
    # Reaction delay after first sighting: 1 + random()/6 tics.

# -----------------------------------------------------------------------
# Dog (classtypes.dogobj / enemytypes.en_dog)
# Dogs are never placed via SpawnStand in the source (no "Can I play,
# daddy?" idle guard dogs) -- only SpawnPatrol is used -- but a Spawn
# group is still defined here since the engine requires one to exist.
# -----------------------------------------------------------------------
Dog:
  states:
    Spawn: # reuses the first Path frame; dogs have no dedicated stand pose
      - sprite: DOGY
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Path: # s_dogpath1..4 / T_Path
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 20
        think: T_Path
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 5
      - sprite: DOGY
        frames: [B]
        tics-per-frame: 15
        think: T_Path
      - sprite: DOGY
        frames: [C]
        tics-per-frame: 20
        think: T_Path
      - sprite: DOGY
        frames: [C]
        tics-per-frame: 5
      - sprite: DOGY
        frames: [D]
        tics-per-frame: 15
        think: T_Path
    # No Pain state -- dogs have 1 hitpoint, so any hit is fatal.
    # Attack is a lunge-and-bite instead of a ranged shot (s_dogjump1..5).
    Attack:
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
        action: T_Bite
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
    Chase: # s_dogchase1..4 / T_DogChase (lunges into Attack at bite range)
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
        think: T_DogChase
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 3
      - sprite: DOGY
        frames: [B]
        tics-per-frame: 8
        think: T_DogChase
      - sprite: DOGY
        frames: [C]
        tics-per-frame: 10
        think: T_DogChase
      - sprite: DOGY
        frames: [C]
        tics-per-frame: 3
      - sprite: DOGY
        frames: [D]
        tics-per-frame: 8
        think: T_DogChase
    Death: # s_dogdie1..3 + s_dogdead / A_DeathScream
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 15
        action: A_DeathScream
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 15
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 15
      - sprite: DOGY
        frames: [A]
        tics-per-frame: -1
  properties:
    "health": 1
    "speed": 1500
    "monster.chasespeedmultiplier": 2
    "points": 200
    "seesound": "dog/sight" # inferred, was "DOGBARK"
    "attacksound": "dog/attack" # T_Bite plays "DOGATTACK"
    "deathsound": "dog/death"
    # No dropitem -- KillActor has no case for dogobj.
    # Attack is melee only: T_Bite deals random()>>4 damage (chance 180/256)
    # when within MINACTORDIST of the player.
    # Reaction delay after first sighting: 1 + random()/8 tics.

# -----------------------------------------------------------------------
# DeadGuard -- pre-placed corpse decoration (mapdefs/wolf3d/decorations.yaml
# object 124), not a live enemy. SpawnDeadGuard (Program.WL_ACT2.cs) spawns
# this directly into s_grddie4, Guard's held final death frame, as an
# inertobj: static, non-blocking, no AI, never shootable/killable again.
# -----------------------------------------------------------------------
DeadGuard:
  states:
    Spawn:
      - sprite: GARD
        frames: [N]
        tics-per-frame: -1
