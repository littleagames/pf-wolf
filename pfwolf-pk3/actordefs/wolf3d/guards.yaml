# =============================================================================
# DRAFT - converted from Program.WL_ACT2.cs and Program.WL_STATE.cs
#
# Standard rank-and-file enemies: Guard, Officer, SS, Mutant, Dog. These are
# the enemies that can be placed on patrol (a "Path" state) as well as
# standing still ("Spawn"), and are spawned per-tile via mapdefs/wolf3d/
# enemies.yaml (which picks the Actor, State, facing Direction, and which
# Skills it appears on). The unique story bosses live in
# actordefs/wolf3d/bosses.yaml, the Pac-Man-bonus-level ghosts live in
# actordefs/wolf3d/ghosts.yaml, and the projectile/FX actors live in
# actordefs/wolf3d/projectiles.yaml.
#
# This mirrors the actordefs/wolf3d/{decorations,ammo,weapons}.yaml schema
# (states: sprite/frames/tics-per-frame/think/action/next-state, plus a flat
# properties list). No "id" fields are set here because these actors aren't
# spawned directly by map-object number the way decorations are -- see
# mapdefs/wolf3d/enemies.yaml for that. Every actor here defines a "Spawn"
# group (= the original T_Stand/"stand still until noticed" state, required
# because the engine's CreateActor always initializes CurrentState from the
# "Spawn" group) and a "Path" group, matching the "State: Spawn" / "State:
# Path" values already used in mapdefs/wolf3d/enemies.yaml.
#
# Judgment calls made during this conversion (please double check):
#
# 1. Sounds: PlaySoundLocActor()/_audioManager.Play() calls in the source
#    still use old raw Wolf3D sound identifiers (e.g. "HALT", "SPION",
#    "SSFIRE", "NAZIFIRE") that were never renamed to the new path-style
#    names used everywhere else (sounds/sound-seq.yaml). A few call sites
#    (A_DeathScream, SS's death sound) *have* already been updated to
#    path-style names, which is what let me infer the rest by
#    cross-referencing sounds/sound-seq.yaml's digitized/adlib/pc entries
#    (e.g. "HALT" is the guard's alert shout -> guard/sight, DSGRDSIT).
#    These inferred names are marked "# inferred" below -- please verify
#    against actual Wolf3D sound lore before relying on them.
# 2. `rotate` in the C# statestruct is 1 for Spawn/Path/Chase (8-directional
#    sprites) and 0 or 2 for Attack/Pain/Death (single/front-facing sprite).
#    Not represented here -- the engine determines this from how many
#    rotation variants exist for a given sprite name, so no flag is needed.
# 3. Health that's identical across all 4 skill levels is written as a
#    single `health` property. Mutant's health varies by skill, so it's
#    broken out as `health.baby` / `health.easy` / `health.normal` /
#    `health.hard` (Wolf3D's four difficulties, in order) since there's no
#    established single-property convention for skill-scaled health yet.
# 4. `monster.chasespeedmultiplier` captures the `ob.speed *=` factor
#    FirstSighting applies once an enemy notices the player (source speed
#    is the `speed` property below, i.e. SPDPATROL=512 or SPDDOG=1500).
# 5. Reaction delay (how many tics an enemy waits after first spotting the
#    player before acting, from SightPlayer) and other pure-behavior details
#    that don't fit the properties schema are left as comments rather than
#    invented property keys.
# 6. SS drop either a MachineGun or a Clip depending on the player's current
#    best weapon (KillActor) -- only `dropitem: Clip` is captured below;
#    the conditional MachineGun drop is called out in a comment.
# =============================================================================

# -----------------------------------------------------------------------
# Guard (classtypes.guardobj / enemytypes.en_guard)
# -----------------------------------------------------------------------
Guard:
  states:
    Spawn: # s_grdstand / T_Stand
      - sprite: GARD
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Path: # s_grdpath1..4 / T_Path
      - sprite: GARD
        frames: [B]
        tics-per-frame: 20
        think: T_Path
      - sprite: GARD
        frames: [B]
        tics-per-frame: 5
      - sprite: GARD
        frames: [C]
        tics-per-frame: 15
        think: T_Path
      - sprite: GARD
        frames: [D]
        tics-per-frame: 20
        think: T_Path
      - sprite: GARD
        frames: [D]
        tics-per-frame: 5
      - sprite: GARD
        frames: [E]
        tics-per-frame: 15
        think: T_Path
    # Pain has two variants (s_grdpain / s_grdpain1); DamageActor picks
    # between them based on hitpoints odd/even. Both just fall into Chase.
    Pain:
      - sprite: GARD
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
      - sprite: GARD
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
    Attack: # s_grdshoot1..3 / T_Shoot
      - sprite: GARD
        frames: [A]
        tics-per-frame: 20
      - sprite: GARD
        frames: [A]
        tics-per-frame: 20
        action: T_Shoot
      - sprite: GARD
        frames: [A]
        tics-per-frame: 20
        next-state: Chase
    Chase: # s_grdchase1..4 / T_Chase
      - sprite: GARD
        frames: [B]
        tics-per-frame: 10
        think: T_Chase
      - sprite: GARD
        frames: [B]
        tics-per-frame: 3
      - sprite: GARD
        frames: [C]
        tics-per-frame: 8
        think: T_Chase
      - sprite: GARD
        frames: [D]
        tics-per-frame: 10
        think: T_Chase
      - sprite: GARD
        frames: [D]
        tics-per-frame: 3
      - sprite: GARD
        frames: [E]
        tics-per-frame: 8
        think: T_Chase
    Death: # s_grddie1..4 / A_DeathScream
      - sprite: GARD
        frames: [A]
        tics-per-frame: 15
        action: A_DeathScream
      - sprite: GARD
        frames: [A]
        tics-per-frame: 15
      - sprite: GARD
        frames: [A]
        tics-per-frame: 15
      - sprite: GARD
        frames: [A]
        tics-per-frame: -1
  properties:
    "health": 25
    "speed": 512
    "monster.chasespeedmultiplier": 3
    "points": 100
    "seesound": "guard/sight" # inferred, was "HALT"
    "attacksound": "guard/attack" # was "NAZIFIRE" (generic soldier gunfire)
    "deathsound": "guard/death"
    "dropitem": "Clip"
    # Reaction delay after first sighting: 1 + random()/4 tics.

