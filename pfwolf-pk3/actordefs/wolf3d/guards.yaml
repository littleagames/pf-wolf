# -----------------------------------------------------------------------
# SS (classtypes.ssobj / enemytypes.en_ss)
# -----------------------------------------------------------------------
SS:
  parent: Monster
  states:
    # SS has a dedicated standing pose (SSWVW1..W8) distinct from its first
    # walk frame (SSWVA1..A8) -- unlike Guard/Officer/Mutant, whose Spawn
    # pose is frame "A" and whose first walk frame is "B". Confirmed by
    # rendering both: W is a static feet-together idle stance, A is a
    # mid-stride walk pose.
    Spawn: # s_ssstand / T_Stand
      - sprite: SSWV
        frames: [W]
        tics-per-frame: -1
        think: T_Stand
    Path: # s_sspath1..4 / T_Path
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 20
        think: T_Path
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 5
      - sprite: SSWV
        frames: [B]
        tics-per-frame: 15
        think: T_Path
      - sprite: SSWV
        frames: [C]
        tics-per-frame: 20
        think: T_Path
      - sprite: SSWV
        frames: [C]
        tics-per-frame: 5
      - sprite: SSWV
        frames: [D]
        tics-per-frame: 15
        think: T_Path
    Pain: # s_sspain
      - sprite: SSWV
        frames: [I]
        tics-per-frame: 10
        next-state: Chase
    Pain1: # s_sspain1
      - sprite: SSWV
        frames: [H]
        tics-per-frame: 10
        next-state: Chase
    # SS unload a long 9-frame burst (s_ssshoot1..9) instead of one shot.
    # Only 3 distinct single-view sprites exist (E/F/G) for this: E is the
    # opening "raise weapon" pose, then F (no visible flash, T_Shoot's hit
    # calc) and G (muzzle flash, purely cosmetic) alternate for the rest of
    # the burst -- matching Guard/Mutant's pattern of the calc frame being
    # drawn without a flash and the following frame carrying the flash.
    Attack:
      - sprite: SSWV
        frames: [E]
        tics-per-frame: 20
      - sprite: SSWV
        frames: [F]
        tics-per-frame: 20
        action: T_Shoot
      - sprite: SSWV
        frames: [G]
        tics-per-frame: 10
      - sprite: SSWV
        frames: [F]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: SSWV
        frames: [G]
        tics-per-frame: 10
      - sprite: SSWV
        frames: [F]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: SSWV
        frames: [G]
        tics-per-frame: 10
      - sprite: SSWV
        frames: [F]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: SSWV
        frames: [G]
        tics-per-frame: 10
        next-state: Chase
    Chase: # s_sschase1..4 / T_Chase
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 10
        think: T_Chase
      - sprite: SSWV
        frames: [A]
        tics-per-frame: 3
      - sprite: SSWV
        frames: [B]
        tics-per-frame: 8
        think: T_Chase
      - sprite: SSWV
        frames: [C]
        tics-per-frame: 10
        think: T_Chase
      - sprite: SSWV
        frames: [C]
        tics-per-frame: 3
      - sprite: SSWV
        frames: [D]
        tics-per-frame: 8
        think: T_Chase
    Death: # s_ssdie1..4 / A_DeathScream
      - sprite: SSWV
        frames: [J]
        tics-per-frame: 15
        action: A_DeathScream
      - sprite: SSWV
        frames: [K]
        tics-per-frame: 15
      - sprite: SSWV
        frames: [L]
        tics-per-frame: 15
      - sprite: SSWV
        frames: [M]
        tics-per-frame: -1
  properties:
    "tag": "SS Guard"
    "obituary": "$OB_SS"
    "health": 100
    "speed": 512
    "monster.chasespeedmultiplier": 4
    "points": 500
    "seesound": "wolfss/sight" # id's SCHUTZADSND
    "attacksound": "wolfss/attack" # id's SSFIRESND
    "deathsound": "wolfss/death"
    "dropitem": "DroppedClip"
    # Drops a MachineGun instead of the Clip while the player holds nothing as
    # good (KillActor's bestweapon < wp_machinegun).
    "dropweapon": "MachineGun"
    # SS are better shots: T_Shoot halves their effective distance penalty
    # (dist = dist * 2 / 3) when rolling to hit the player.
    "monster.sharpshooter": true
    "monster.reactiondelay": [1, 6] # tics after first sighting: 1 + random()/6

# -----------------------------------------------------------------------
# Mutant (classtypes.mutantobj / enemytypes.en_mutant)
# -----------------------------------------------------------------------
Mutant:
  parent: Monster
  states:
    Spawn: # s_mutstand / T_Stand
      - sprite: MTNT
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Path: # s_mutpath1..4 / T_Path
      - sprite: MTNT
        frames: [B]
        tics-per-frame: 20
        think: T_Path
      - sprite: MTNT
        frames: [B]
        tics-per-frame: 5
      - sprite: MTNT
        frames: [C]
        tics-per-frame: 15
        think: T_Path
      - sprite: MTNT
        frames: [D]
        tics-per-frame: 20
        think: T_Path
      - sprite: MTNT
        frames: [D]
        tics-per-frame: 5
      - sprite: MTNT
        frames: [E]
        tics-per-frame: 15
        think: T_Path
    Pain: # s_mutpain
      - sprite: MTNT
        frames: [J]
        tics-per-frame: 10
        next-state: Chase
    Pain1: # s_mutpain1
      - sprite: MTNT
        frames: [K]
        tics-per-frame: 10
        next-state: Chase
    # Mutant fires twice in one attack cycle (s_mutshoot1..4). Confirmed by
    # rendering: F/H show no muzzle flash (T_Shoot's hit-calc frames), G/I
    # show the chest flash (Mutant fires from its chest) on the following
    # frame -- same calc-then-flash pairing as Guard/SS.
    Attack:
      - sprite: MTNT
        frames: [F]
        tics-per-frame: 6
        action: T_Shoot
      - sprite: MTNT
        frames: [G]
        tics-per-frame: 20
      - sprite: MTNT
        frames: [H]
        tics-per-frame: 10
        action: T_Shoot
      - sprite: MTNT
        frames: [I]
        tics-per-frame: 20
        next-state: Chase
    Chase: # s_mutchase1..4 / T_Chase
      - sprite: MTNT
        frames: [B]
        tics-per-frame: 10
        think: T_Chase
      - sprite: MTNT
        frames: [B]
        tics-per-frame: 3
      - sprite: MTNT
        frames: [C]
        tics-per-frame: 8
        think: T_Chase
      - sprite: MTNT
        frames: [D]
        tics-per-frame: 10
        think: T_Chase
      - sprite: MTNT
        frames: [D]
        tics-per-frame: 3
      - sprite: MTNT
        frames: [E]
        tics-per-frame: 8
        think: T_Chase
    Death: # s_mutdie1..5 / A_DeathScream
      - sprite: MTNT
        frames: [L]
        tics-per-frame: 7
        action: A_DeathScream
      - sprite: MTNT
        frames: [M]
        tics-per-frame: 7
      - sprite: MTNT
        frames: [N]
        tics-per-frame: 7
      - sprite: MTNT
        frames: [O]
        tics-per-frame: 7
      - sprite: MTNT
        frames: [P]
        tics-per-frame: -1
  properties:
    "tag": "Mutant"
    "obituary": "$OB_MUTANT"
    "health.baby": 45
    "health.easy": 55
    "health.normal": 55
    "health.hard": 65
    "speed": 512
    "monster.chasespeedmultiplier": 3
    "points": 700
    "attacksound": "mutant/attack" # id's NAZIFIRESND; it has no sight sound
    "deathsound": "mutant/death"
    "dropitem": "DroppedClip"
    "monster.reactiondelay": [1, 6] # tics after first sighting: 1 + random()/6

# -----------------------------------------------------------------------
# Dog (classtypes.dogobj / enemytypes.en_dog)
# -----------------------------------------------------------------------
Dog:
  parent: Monster
  flags: [NODOORS] # vanilla's TryWalk: dogs never open doors (CHECKDIAG, not CHECKSIDE)
  states:
    Spawn: # no C state (see the top): the first walk frame, standing
      - sprite: DOGY
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Path: # s_dogpath1..4 / T_Path
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 20
        think: T_Path
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 5
      - sprite: DOGY
        frames: [B]
        tics-per-frame: 15
        think: T_Path
      - sprite: DOGY
        frames: [C]
        tics-per-frame: 20
        think: T_Path
      - sprite: DOGY
        frames: [C]
        tics-per-frame: 5
      - sprite: DOGY
        frames: [D]
        tics-per-frame: 15
        think: T_Path
    # No Pain state: dogs have 1 hitpoint, so any hit is fatal.
    # The bite: the leap (E), the bite (F), the landing (G), the leap again, then the first
    # walk frame (A) before chasing on. id drew that last one from the front; A turns with the
    # dog, which faces the player as it bites.
    Attack: # s_dogjump1..5 / T_Bite
      - sprite: DOGY
        frames: [E]
        tics-per-frame: 10
      - sprite: DOGY
        frames: [F]
        tics-per-frame: 10
        action: T_Bite
      - sprite: DOGY
        frames: [G]
        tics-per-frame: 10
      - sprite: DOGY
        frames: [E]
        tics-per-frame: 10
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
        next-state: Chase
    Chase: # s_dogchase1..4 / T_DogChase (lunges into Attack at bite range)
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
        think: T_DogChase
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 3
      - sprite: DOGY
        frames: [B]
        tics-per-frame: 8
        think: T_DogChase
      - sprite: DOGY
        frames: [C]
        tics-per-frame: 10
        think: T_DogChase
      - sprite: DOGY
        frames: [C]
        tics-per-frame: 3
      - sprite: DOGY
        frames: [D]
        tics-per-frame: 8
        think: T_DogChase
    Death: # s_dogdie1..3 + s_dogdead / A_DeathScream
      - sprite: DOGY
        frames: [H]
        tics-per-frame: 15
        action: A_DeathScream
      - sprite: DOGY
        frames: [I]
        tics-per-frame: 15
      - sprite: DOGY
        frames: [J]
        tics-per-frame: 15
        next-state: Dead
    # s_dogdead goes round itself every 15 tics rather than holding (which
    # demo playback depends on)
    Dead: # s_dogdead
      - sprite: DOGY
        frames: [K]
        tics-per-frame: 15
        next-state: Dead
  properties:
    "tag": "Dog"
    "obituary": "$OB_DOG"
    "health": 1
    "speed": 1500
    "monster.chasespeedmultiplier": 2
    "points": 200
    "seesound": "dog/sight" # id's DOGBARKSND
    "attacksound": "dog/attack" # T_Bite plays "DOGATTACK"
    "deathsound": "dog/death"
    # No dropitem -- KillActor has no case for dogobj.
    # Attack is melee only: T_Bite deals random()>>4 damage (chance 180/256)
    # when within MINACTORDIST of the player.
    "monster.reactiondelay": [1, 8] # tics after first sighting: 1 + random()/8

# -----------------------------------------------------------------------
# DeadGuard -- pre-placed corpse decoration (mapdefs/wolf3d/decorations.yaml
# object 124), not a live enemy. SpawnDeadGuard (WL_ACT2.C) spawns
# this directly into s_grddie4, Guard's held final death frame, as an
# inertobj: static, non-blocking, no AI, never shootable/killable again.
# -----------------------------------------------------------------------
DeadGuard:
  states:
    Spawn: # s_grddie4
      - sprite: GARD
        frames: [N]
        tics-per-frame: -1
