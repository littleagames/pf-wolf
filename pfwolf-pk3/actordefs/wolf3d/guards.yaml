# Wolfenstein 3D's soldiers and dogs: Guard, Officer, SS, Mutant, Dog (and the dead guard
# decoration), as id's WL_ACT2.C and WL_STATE.C have them. Each state group's comment names
# the C states it was made from; every frame's sprite, tics, think and action, and the health,
# points, speeds, chase speed-ups, reaction delays, drops and sounds, were checked against
# them (2026-10-21). mapdefs/wolf3d/enemies.yaml places them, standing (Spawn) or on patrol
# (Path).
#
# Where PFWolf differs from id's on purpose:
#   - A standing dog (map objects 134-137 and the like) stands still until it notices the
#     player. id's SpawnStand had no case for dogs, so one changed whatever was spawned before
#     it instead.
#   - A state's sprite turns with the actor when it has views for every direction; id's states
#     said so frame by frame. A dog's last bite frame (s_dogjump5) is the only place that shows:
#     id drew it from the front.
# =============================================================================

# -----------------------------------------------------------------------
# Guard (classtypes.guardobj / enemytypes.en_guard)
# -----------------------------------------------------------------------
Guard:
  parent: Monster
  states:
    Spawn: # s_grdstand / T_Stand
      - sprite: GARD
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Path: # s_grdpath1..4 / T_Path
      - sprite: GARD
        frames: [B]
        tics-per-frame: 20
        think: T_Path
      - sprite: GARD
        frames: [B]
        tics-per-frame: 5
      - sprite: GARD
        frames: [C]
        tics-per-frame: 15
        think: T_Path
      - sprite: GARD
        frames: [D]
        tics-per-frame: 20
        think: T_Path
      - sprite: GARD
        frames: [D]
        tics-per-frame: 5
      - sprite: GARD
        frames: [E]
        tics-per-frame: 15
        think: T_Path
    # Pain has two variants (s_grdpain / s_grdpain1); Monster.Damage picks
    # Pain with odd hitpoints left, Pain1 with even. Both just fall into Chase.
    Pain:
      - sprite: GARD
        frames: [I]
        tics-per-frame: 10
        next-state: Chase
    Pain1:
      - sprite: GARD
        frames: [J]
        tics-per-frame: 10
        next-state: Chase
    Attack: # s_grdshoot1..3 / T_Shoot
      - sprite: GARD
        frames: [F]
        tics-per-frame: 20
      - sprite: GARD
        frames: [G]
        tics-per-frame: 20
        action: T_Shoot
      - sprite: GARD
        frames: [H]
        tics-per-frame: 20
        next-state: Chase
    Chase: # s_grdchase1..4 / T_Chase
      - sprite: GARD
        frames: [B]
        tics-per-frame: 10
        think: T_Chase
      - sprite: GARD
        frames: [B]
        tics-per-frame: 3
      - sprite: GARD
        frames: [C]
        tics-per-frame: 8
        think: T_Chase
      - sprite: GARD
        frames: [D]
        tics-per-frame: 10
        think: T_Chase
      - sprite: GARD
        frames: [D]
        tics-per-frame: 3
      - sprite: GARD
        frames: [E]
        tics-per-frame: 8
        think: T_Chase
    Death: # s_grddie1..4 / A_DeathScream
      - sprite: GARD
        frames: [K]
        tics-per-frame: 15
        action: A_DeathScream
      - sprite: GARD
        frames: [L]
        tics-per-frame: 15
      - sprite: GARD
        frames: [M]
        tics-per-frame: 15
      - sprite: GARD
        frames: [N]
        tics-per-frame: -1
  properties:
    "tag": "Guard"
    "obituary": "$OB_GUARD"
    "health": 25
    "speed": 512
    "monster.chasespeedmultiplier": 3
    "points": 100
    "seesound": "guard/sight" # id's HALTSND
    "attacksound": "guard/attack" # id's NAZIFIRESND, every soldier's
    "deathsound": "guard/death"
    "dropitem": "DroppedClip"
    "monster.reactiondelay": [1, 4] # tics after first sighting: 1 + random()/4

