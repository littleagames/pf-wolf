    - COUNTITEM
    - INVENTORY.ALWAYSPICKUP
    - bright
  states:
    Spawn:
      - sprite: ONUP
        frames: [A]
        tics-per-frame: -1
    Pickup:
      - sprite: TNT1
        frames: [A]
