# The Pac-Man ghosts of Wolfenstein 3D's E3M10, as id's WL_ACT2.C and WL_STATE.C have them
# (SpawnGhosts, T_Ghosts), checked against them on 2026-10-21: a two-frame chase at the dogs'
# speed, through doors without opening them (PHASEDOORS), hurting the player on touch
# (TOUCHDAMAGE). They have no health, so they can't be shot.
#
# Where PFWolf differs from id's on purpose: id counted each ghost in the level's kill total,
# so the level's kill ratio could never reach 100%; PFWolf leaves them out of it.
#
# Their seesound and deathsound are never heard in Wolf3D: a ghost never notices the player
# (T_Ghosts doesn't look) and never dies. They're there for a mod that changes that.
# =============================================================================

Blinky:
  parent: Monster
  flags: [AMBUSH, PHASEDOORS, TOUCHDAMAGE]
  states:
    Spawn: # s_blinkychase1..2 / T_Ghosts
      - sprite: BLKY
        frames: [A]
        tics-per-frame: 10
        think: T_Ghosts
      - sprite: BLKY
        frames: [B]
        tics-per-frame: 10
        think: T_Ghosts
  properties:
    "tag": "Blinky"
    "obituary": "$OB_GHOST"
    "speed": 1500
    "seesound": "ghost/sight"
    "deathsound": "ghost/death"

