# =============================================================================
# DRAFT - converted from Program.WL_ACT2.cs and Program.WL_STATE.cs
#
# Ghosts (classtypes.ghostobj / enemytypes.en_blinky, en_clyde, en_pinky,
# en_inky) -- Pac-Man-style bonus-level enemies. SpawnGhosts never sets
# hitpoints or a dropitem, and increments the kill counters immediately at
# spawn time rather than on death, so these appear to be intended as
# invulnerable, instant-scoring enemies rather than normal shootable
# monsters. Each ghost only has a 2-frame idle/chase loop (T_Ghosts) and no
# Path/Pain/Attack/Death states exist in the source at all.
#
# This mirrors the actordefs/wolf3d/{decorations,ammo,weapons}.yaml schema
# (states: sprite/frames/tics-per-frame/think/action/next-state, plus a flat
# properties list). No "id" fields are set here because these actors aren't
# spawned directly by map-object number the way decorations are.
# =============================================================================

Blinky:
  states:
    Spawn:
      - sprite: BLKY
        frames: [A]
        tics-per-frame: 10
        think: T_Ghosts
      - sprite: BLKY
        frames: [B]
        tics-per-frame: 10
        think: T_Ghosts
  properties:
    "speed": 1500
    "seesound": "ghost/sight"
    "deathsound": "ghost/death"

