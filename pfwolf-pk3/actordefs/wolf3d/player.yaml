# The player's class. How the player, player classes and the states other players see work is
# in the manual: https://www.littleagames.com/pf-wolf/docs/latest/manual/player-classes
# What each property does is in the actor properties reference:
# https://www.littleagames.com/pf-wolf/docs/latest/reference/actor-properties
Player:
  states:
    Spawn:
      - sprite: PLMP
        frames: [A]
        tics-per-frame: -1
    See:
      - sprite: PLMP
        frames: [B, C, D, E]
        tics-per-frame: 8
    Missile:
      - sprite: PLMP
        frames: [F, G, H, I]
        tics-per-frame: 5
    Pain:
      - sprite: PLMP
        frames: [J]
        tics-per-frame: 10
    Pain1:
      - sprite: PLMP
        frames: [K]
        tics-per-frame: 10
    Death:
      - sprite: PLMP
        frames: [J, K]
        tics-per-frame: 10
      - sprite: PLAY
        frames: [L, M, N]
        tics-per-frame: 10
      - sprite: PLAY
        frames: [O]
        tics-per-frame: -1
  properties:
    "tag": "B.J. Blazkowicz"
    "deathsound": "player/death"
    "player.startitem":
      Knife: 1
      Pistol: 1
      Clip: 8
    "player.starthealth": 100
    "player.startlives": 3
    "player.maxhealth": 100
    "player.maxlives": 9
    # Left out here, as examples:
    # "player.damagedealt": 1
    # "player.damagetaken": 1
