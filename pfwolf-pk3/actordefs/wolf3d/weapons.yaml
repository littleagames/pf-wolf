GatlingGunUpgrade:
  # No embedded id -- resolved via mapdefs/wolf3d/decorations.yaml object 51
  # instead, which correctly points here rather than at plain "GatlingGun":
  # classic Wolf3D pickup behavior for the floor chaingun is to only grant
  # the actual chaingun if the player already has the machine gun,
  # otherwise it grants the machine gun, which is exactly what this
  # "WeaponGiver" actor's dropitem list below does.
  parent: "WeaponGiver"
  properties:
    "inventory.pickupsound": "weapon/gatling/pickup"
    "weapon.ammogive1": 6
    "dropitem": [GatlingGun, MachineGun]
  flags: [INVENTORY.ALWAYSPICKUP]
  states:
    Spawn:
      - sprite: CGUN
        frames: [A]
        tics-per-frame: -1

BlueGatlingGunUpgrade:
  id: 156
  parent: "GatlingGunUpgrade"
  properties:
    "inventory.pickupsound": "weapon/bluegatling/pickup"
    "dropitem": [BlueGatlingGun, BlueAK47]
  states:
    Spawn:
      - sprite: BGUN
        frames: [A]
        tics-per-frame: -1
