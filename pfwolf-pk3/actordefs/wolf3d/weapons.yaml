WolfWeapon:
  parent: "Weapon"
  properties:
    "weapon.ammotype1": "Clip"
    "weapon.ammouse1": 1
    "weapon.ammogive1": 6
    "weapon.yadjust": 19
  flags: [WEAPON.NOGRIN, WEAPON.DONTBOB]
  states:
    Select:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_Raise
        next-state: Select
    Deselect:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_Lower
        next-state: Deselect

Knife:
  parent: "WolfWeapon"
  properties:
    "inventory.icon": "KNIFE"
    "weapon.ammouse1": 0
    "weapon.selectionorder": 3700
    "attacksound": "weapon/knife/attack"
  flags: [WEAPON.NOAUTOFIRE, WEAPON.NOALERT]
  states:
    Ready:
      - sprite: KNIF
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: KNIF
        frames: [B, C]
        tics-per-frame: 3
      - sprite: KNIF
        frames: [D]
        tics-per-frame: 3
        action: "A_CustomPunch(random(0,15), true, CPF_ALWAYSPLAYSOUND)"
      - sprite: KNIF
        frames: [E]
        tics-per-frame: 3
        next-state: Ready

