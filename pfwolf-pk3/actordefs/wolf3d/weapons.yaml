# Player weapon states follow the engine's state rules: tics are 70Hz, a frame's action runs
# when the frame ENDS, 0 tics ends the frame the moment it's entered, and -1 holds forever.
# A state without a next-state loops back to its own first frame (there's no ZDoom-style fall
# through into the next label), so Fire names Hold explicitly.
# The Fire/Hold timings reproduce vanilla attackinfo: every frame lasts 6 tics, and the
# attack fires at the end of C (end of D too for the gatling gun's second shot).
WolfWeapon:
  parent: "Weapon"
  properties:
    "weapon.ammotype1": "Clip"
    "weapon.ammouse1": 1
    "weapon.ammogive1": 6
    "weapon.yadjust": 19
  flags: [WEAPON.NOGRIN, WEAPON.DONTBOB]
  states:
    Select:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 1
        action: A_Raise
        next-state: Select
    Deselect:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 1
        action: A_Lower
        next-state: Deselect

Knife:
  parent: "WolfWeapon"
  properties:
    "inventory.type": Knife
    "inventory.icon": "Knife"
    "weapon.slot": 1
    "weapon.ammouse1": 0
    "weapon.selectionorder": 3700
    "attacksound": "weapon/knife/attack"
  flags: [WEAPON.NOAUTOFIRE, WEAPON.NOALERT]
  states:
    Ready:
      - sprite: KNIF
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: KNIF
        frames: [B]
        tics-per-frame: 6
      - sprite: KNIF
        frames: [C]
        tics-per-frame: 6
        action: "A_CustomPunch(random(0,15), true, CPF_ALWAYSPLAYSOUND)"
      - sprite: KNIF
        frames: [D, E]
        tics-per-frame: 6
        next-state: Ready

