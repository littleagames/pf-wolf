# Holding fire loops C-D (a shot every 12 tics); A_ReFire at the end of D jumps back to Hold.
MachineGun:
  parent: "WolfWeapon"
  properties:
    "attacksound": "weapon/machine/attack"
    "inventory.type": MachineGun
    "weapon.slot": 3
    "inventory.icon": "MachineGun"
    "inventory.pickupsound": "weapon/machine/pickup"
    "weapon.selectionorder": 1300
  flags: [INVENTORY.ALWAYSPICKUP]
  states:
    Spawn:
      - sprite: MGUN
        frames: [A]
        tics-per-frame: -1
    Ready:
      - sprite: MCHG
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: MCHG
        frames: [B]
        tics-per-frame: 6
        next-state: Hold
    Hold:
      - sprite: MCHG
        frames: [C]
        tics-per-frame: 6
        modifiers: [bright]
        action: A_GunAttack
      - sprite: MCHG
        frames: [D]
        tics-per-frame: 6
        action: A_ReFire
      - sprite: MCHG
        frames: [E]
        tics-per-frame: 6
        next-state: Ready

