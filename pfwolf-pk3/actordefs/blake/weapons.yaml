  properties:
    "inventory.type": RapidAssaultWeapon
    "inventory.icon": "WeaponPic3"
    "inventory.pickupsound": "bs/getburstrifle"
    "inventory.pickupmessage": "$BS_GOTRAPIDASSAULT"
    "weapon.slot": 3
    "weapon.selectionorder": 1300
    "attacksound": "bs/atkburstrifle"
  states:
    Spawn:
      - sprite: RAWP
        frames: [A]
        tics-per-frame: -1
    Ready:
      - sprite: RAWG
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: RAWG
        frames: [B]
        tics-per-frame: 6
        next-state: Hold
    Hold:
      - sprite: RAWG
        frames: [C]
        tics-per-frame: 6
        modifiers: [bright]
        action: A_GunAttack(2, 4, 4)
      - sprite: RAWG
        frames: [D]
        tics-per-frame: 5
        action: A_ReFire
      - sprite: RAWG
        frames: [E]
        tics-per-frame: 5
        next-state: Ready

