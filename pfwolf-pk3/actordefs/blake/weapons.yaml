# Throws a plasma grenade (projectiles.yaml) for 4 charge units; holding fire, one every 12 tics
PlasmaDischargeUnit:
  parent: "BlakeEnergyWeapon"
  properties:
    "inventory.type": PlasmaDischargeUnit
    "inventory.icon": "WeaponPic5"
    "inventory.pickupsound": "bs/getcannon"
    "inventory.pickupmessage": "$BS_GOTPLASMADISCHARGE"
    "weapon.slot": 5
    "weapon.selectionorder": 500
    "weapon.ammouse1": 4
    "attacksound": "bs/atkgrenade"
  states:
    Spawn:
      - sprite: PDUP
        frames: [A]
        tics-per-frame: -1
    Ready:
      - sprite: PDUG
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: PDUG
        frames: [B]
        tics-per-frame: 6
        next-state: Hold
    Hold:
      - sprite: PDUG
        frames: [C]
        tics-per-frame: 6
        modifiers: [bright]
        action: A_FireMissile("PlasmaGrenade", 1)
      - sprite: PDUG
        frames: [D]
        tics-per-frame: 6
        action: A_ReFire
      - sprite: PDUG
        frames: [E]
        tics-per-frame: 6
        next-state: Ready
