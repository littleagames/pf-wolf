# Blake Stone's weapons, timed as bstone's attackinfo table (3d_agent.cpp) has them: each frame's
# tics, and the shot at the end of C. Hitscan shots use Blake Stone's damage: a random 0-255
# divided by 2 within 2 tiles, else by 4 (A_GunAttack(2, 4, 4)). The energy weapons share one
# supply of charge units (items.yaml ChargeUnit); picking one up gives 6 of them.
BlakeWeapon:
  parent: "Weapon"
  properties:
    "weapon.yadjust": 19
  flags: [WEAPON.NOGRIN, WEAPON.DONTBOB]
  states:
    Select:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 1
        action: A_Raise
        next-state: Select
    Deselect:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 1
        action: A_Lower
        next-state: Deselect

# Uses no ammo, but takes 50 tics to charge between shots (the status bar's wait/ready light)
AutoChargePistol:
  parent: "BlakeWeapon"
  properties:
    "inventory.type": AutoChargePistol
    "inventory.icon": "WeaponPic1"
    "weapon.slot": 1
    "weapon.selectionorder": 3700
    "weapon.chargetics": 50
    "attacksound": "bs/atkautocharge"
  flags: [WEAPON.NOAUTOFIRE]
  states:
    Ready:
      - sprite: ACPG
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: ACPG
        frames: [B]
        tics-per-frame: 6
      - sprite: ACPG
        frames: [C]
        tics-per-frame: 6
        modifiers: [bright]
        action: A_GunAttack(2, 4, 4)
      - sprite: ACPG
        frames: [D, E]
        tics-per-frame: 6
        next-state: Ready

BlakeEnergyWeapon:
  parent: "BlakeWeapon"
  properties:
    "weapon.ammotype1": "ChargeUnit"
    "weapon.ammouse1": 1
    "weapon.ammogive1": 6
  flags: [INVENTORY.ALWAYSPICKUP]

# One shot a press
SlowFireProtector:
  parent: "BlakeEnergyWeapon"
  properties:
    "inventory.type": SlowFireProtector
    "inventory.icon": "WeaponPic2"
    "inventory.pickupsound": "bs/getpistol"
    "inventory.pickupmessage": "$BS_GOTSLOWFIRE"
    "weapon.slot": 2
    "weapon.selectionorder": 1900
    "attacksound": "bs/atkcharged"
  flags: [WEAPON.NOAUTOFIRE, INVENTORY.ALWAYSPICKUP]
  states:
    Spawn:
      - sprite: SFPP
        frames: [A]
        tics-per-frame: -1
    Ready:
      - sprite: SFPG
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: SFPG
        frames: [B]
        tics-per-frame: 6
      - sprite: SFPG
        frames: [C]
        tics-per-frame: 6
        modifiers: [bright]
        action: A_GunAttack(2, 4, 4)
      - sprite: SFPG
        frames: [D, E]
        tics-per-frame: 6
        next-state: Ready

# Holding fire: a shot every 11 tics
RapidAssaultWeapon:
