# Blake Stone's bosses, as bstone has them: the six aliens guarding the gold access cards, one
# to a mission, and Dr. Goldfire, who warps in at his spawn sites, and warps out again when shot
# down, to come back later. Health is by skill (novice ... veteran). The map numbers that place
# them are in mapdefs/blake/bosses.yaml.

# The aliens: built like the rest (actordefs/blake/aliens.yaml), shooting from range; each leaves
# the floor's gold access card
BlakeBoss:
  parent: BlakeAlien
  properties:
    "dropitem": "GoldCard"
    "attacksound": "bs/atkcharged"

SpiderMutant:
  parent: BlakeBoss
  properties:
    "tag": "$BS_SPIDERMUTANT"
    "health.baby": 800
    "health.easy": 1000
    "health.normal": 2000
    "health.hard": 3000
    "points": 5000
    "monster.chasespeedmultiplier": 3
    "seesound": "bs/scanhalt"
    "deathsound": "bs/blueboydeath"
  states:
    Spawn:
      - { sprite: MSUP, frames: [A], tics-per-frame: -1, think: T_Stand }
    Chase:
      - { sprite: MSUP, frames: [A], tics-per-frame: 10, think: T_BlakeChase }
      - { sprite: MSUP, frames: [A], tics-per-frame: 5 }
      - { sprite: MSUP, frames: [B], tics-per-frame: 8, think: T_BlakeChase }
      - { sprite: MSUP, frames: [C], tics-per-frame: 10, think: T_BlakeChase }
      - { sprite: MSUP, frames: [C], tics-per-frame: 5 }
      - { sprite: MSUP, frames: [D], tics-per-frame: 8, think: T_BlakeChase }
    Pain:
      - { sprite: MSUP, frames: [H], tics-per-frame: 15, next-state: Chase }
    Attack:
      - { sprite: MSUP, frames: [E], tics-per-frame: 10 }
      - { sprite: MSUP, frames: [F], tics-per-frame: 10, action: A_FireProjectile("SpiderShot") }
      - { sprite: MSUP, frames: [G], tics-per-frame: 10, next-state: Chase }
    Death:
      - { sprite: MSUP, frames: [H], tics-per-frame: 18, think: T_BlowBack, action: A_DeathScream }
      - { sprite: MSUP, frames: [I], tics-per-frame: 20, think: T_BlowBack }
      - { sprite: MSUP, frames: [J], tics-per-frame: 22, think: T_BlowBack }
      - { sprite: MSUP, frames: [K], tics-per-frame: 20, think: T_BlowBack }
      - { sprite: MSUP, frames: [L], tics-per-frame: 18, think: T_BlowBack }
      - { sprite: MSUP, frames: [M], tics-per-frame: -1 }

