# The spider mutant's and acid dragon's spit: 0-15, bursting on a wall or on Blake
SpiderShot:
  flags: [PROJECTILE, BURSTONPLAYER, bright]
  properties:
    "speed": 7168
    "spread": 2
    "attacksound": "bs/spitattack"
  states:
    Spawn:
      - { sprite: MSPR, frames: [A, C, B], tics-per-frame: 2, think: "A_Projectile(0, 15)" }
    Death:
      - { sprite: MSPR, frames: [D, E, F], tics-per-frame: 5 }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: A_Remove }

AcidShot:
  parent: SpiderShot
  states:
    Spawn:
      - { sprite: ADPR, frames: [A, C, B], tics-per-frame: 2, think: "A_Projectile(0, 15)" }
    Death:
      - { sprite: ADPR, frames: [E, F, G], tics-per-frame: 5 }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: A_Remove }

# -----------------------------------------------------------------------
# Dr. Goldfire: warps in at one of the floor's spawn sites (GoldfireSite), patrols and fights
# like a pro guard; shot down, he laughs and warps out, to come back 30 seconds to 4 minutes
# later somewhere else. On floor 9 he's fifteen times as tough, comes straight away, and leaves
# the gold access card the first time.
# -----------------------------------------------------------------------
Goldfire:
  parent: BlakeEnemy
  flags: [NOTCOUNTED]
  properties:
    "tag": "$BS_GOLDFIRE"
    "health.baby": 50
    "health.easy": 63
    "health.normal": 125
    "health.hard": 188
    "monster.floorhealth": [9, 15]
    "points": 5000
    "monster.chasespeedmultiplier": 3
    "monster.reactiondelay": [1, 4]
    "seesound": "bs/goldsternhalt"
    "attacksound": "bs/atkcharged"
    "dropitem": "GoldCard"
    "dropitem.onfloor": 9
  states:
    # Warping in
    Spawn:
      - { sprite: DGLD, frames: [P], tics-per-frame: 15, action: A_PlaySound("bs/warpin") }
      - { sprite: DGLD, frames: [O, N, M, L], tics-per-frame: 15, next-state: Path }
    Path:
      - { sprite: DGLD, frames: [B], tics-per-frame: 20, think: T_Path }
      - { sprite: DGLD, frames: [B], tics-per-frame: 5 }
      - { sprite: DGLD, frames: [C], tics-per-frame: 15, think: T_Path }
      - { sprite: DGLD, frames: [D], tics-per-frame: 20, think: T_Path }
      - { sprite: DGLD, frames: [D], tics-per-frame: 5 }
      - { sprite: DGLD, frames: [E], tics-per-frame: 15, think: T_Path }
    Pain:
      - { sprite: DGLD, frames: [I], tics-per-frame: 15, next-state: Chase }
    Attack:
      - { sprite: DGLD, frames: [F], tics-per-frame: 20 }
      - { sprite: DGLD, frames: [G], tics-per-frame: 20, action: T_BlakeShoot }
      - { sprite: DGLD, frames: [H], tics-per-frame: 10 }
      - { sprite: DGLD, frames: [G], tics-per-frame: 10, action: T_BlakeShoot }
      - { sprite: DGLD, frames: [H], tics-per-frame: 10 }
      - { sprite: DGLD, frames: [G], tics-per-frame: 10, action: T_BlakeShoot }
      - { sprite: DGLD, frames: [H], tics-per-frame: 10, next-state: Chase }
    Chase:
      - { sprite: DGLD, frames: [B], tics-per-frame: 10, think: T_BlakeChase }
      - { sprite: DGLD, frames: [B], tics-per-frame: 3 }
      - { sprite: DGLD, frames: [C], tics-per-frame: 8, think: T_BlakeChase }
      - { sprite: DGLD, frames: [D], tics-per-frame: 10, think: T_BlakeChase }
      - { sprite: DGLD, frames: [D], tics-per-frame: 3 }
      - { sprite: DGLD, frames: [E], tics-per-frame: 8, think: T_BlakeChase }
    # Shot down: laughs, taps his wrist and warps out
    Death:
      - { sprite: DGLD, frames: [A], tics-per-frame: 45, action: 'A_PlaySound("bs/goldsternlaugh", "positional")' }
      - { sprite: DGLD, frames: [J], tics-per-frame: 25 }
      - { sprite: DGLD, frames: [K], tics-per-frame: 25, action: A_PlaySound("bs/elev_button") }
      - { sprite: DGLD, frames: [J], tics-per-frame: 15 }
      - { sprite: DGLD, frames: [K], tics-per-frame: 25, action: A_PlaySound("bs/elev_button") }
      - { sprite: DGLD, frames: [A], tics-per-frame: 15 }
      - { sprite: DGLD, frames: [L], tics-per-frame: 30, action: A_PlaySound("bs/warpout") }
      - { sprite: DGLD, frames: [M, N, O], tics-per-frame: 30 }
      - { sprite: DGLD, frames: [P], tics-per-frame: 40, action: A_WarpSiteGone }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: A_Remove }

# One of Goldfire's spawn sites (invisible)
GoldfireSite:
  flags: [WARPSITE]
  properties:
    "warpsite.class": "Goldfire"
    "warpsite.firstwait": [5, 15]
    "warpsite.wait": [30, 240]
    "warpsite.quickfloor": 9
  states:
    Spawn:
      - { sprite: TNT1, frames: [A], tics-per-frame: -1 }
