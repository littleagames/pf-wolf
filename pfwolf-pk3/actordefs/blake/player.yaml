# Blake Stone's player (see actordefs/wolf3d/player.yaml for every property). Phase 0: Blake
# starts with the auto charge pistol and nothing else; the energy weapons and their charge packs
# come in a later phase.
Player:
  properties:
    "tag": "Blake Stone"
    "deathsound": "player/death"
    "player.startitem":
      AutoChargePistol: 1
    "player.starthealth": 100
    "player.startlives": 3
    "player.maxhealth": 100
    "player.maxlives": 9
