# Blake Stone's player (see actordefs/wolf3d/player.yaml for every property): he starts with the
# auto charge pistol and 8 charge units (bstone's STARTAMMO).
Player:
  properties:
    "tag": "Blake Stone"
    "deathsound": "player/death"
    "player.startitem":
      AutoChargePistol: 1
      ChargeUnit: 8
    "player.starthealth": 100
    "player.startlives": 3
    "player.maxhealth": 100
    "player.maxlives": 9
