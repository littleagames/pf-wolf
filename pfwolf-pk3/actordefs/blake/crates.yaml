# Blake Stone's blastable crates, as bstone has them: one shot (of anything) blows a crate up,
# hurting everything near, and leaves what was hidden in it. There are three kinds of crate, each
# with eighteen things it can hide (bstone's ExpCrateShapes), one class for each; their map
# numbers (432-485) are in mapdefs/blake/crates.yaml. Not counted as enemies.
BlakeCrate:
  flags: [NOTCOUNTED, STATIONARY]
  properties:
    "health": 1
    "deathsound": ["bs/explode1", "bs/explode2"]
  states:
    Spawn:
      - { sprite: CRT1, frames: [A], tics-per-frame: -1 }
    # (only so it can be shot)
    Chase:
      - { sprite: CRT1, frames: [A], tics-per-frame: -1 }
    Death:
      - { sprite: GREN, frames: [F], tics-per-frame: 24, action: A_DeathScream, modifiers: [bright] }
      - { sprite: GREN, frames: [G, H], tics-per-frame: 24, modifiers: [bright] }
      - { sprite: GREN, frames: [I], tics-per-frame: 24, action: 'A_Explode(20, 20, 2, "hurtplayer")', modifiers: [bright] }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: A_Remove }

BlakeCrate2:
  parent: BlakeCrate
  states:
    Spawn:
      - { sprite: CRT2, frames: [B], tics-per-frame: -1 }
    Chase:
      - { sprite: CRT2, frames: [B], tics-per-frame: -1 }

BlakeCrate3:
  parent: BlakeCrate
  states:
    Spawn:
      - { sprite: CRT3, frames: [C], tics-per-frame: -1 }
    Chase:
      - { sprite: CRT3, frames: [C], tics-per-frame: -1 }

