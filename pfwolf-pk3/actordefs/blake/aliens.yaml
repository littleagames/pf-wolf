# -----------------------------------------------------------------------
# Sleepers: each counts as the enemy it becomes (monster.becomes). A canister shot open lets
# its alien out; a gurney mutant wakes when shot or, with a time on the map (a 0xFA value east of
# it), that many seconds after Blake first sees it, and can't be shot till then; a pod egg
# hatches 5-24 seconds (or the map's time) after Blake first sees it, or when shot.
# -----------------------------------------------------------------------
ScanCanister:
  parent: Monster
  flags: [STATIONARY]
  properties:
    "tag": "$BS_SCANALIEN"
    "health": 1
    "monster.becomes": "ScanAlien"
    "deathsound": "bs/scanbreak"
  states:
    Spawn:
      - { sprite: CNSA, frames: [A], tics-per-frame: -1 }
    # (only so it can be shot)
    Chase:
      - { sprite: CNSA, frames: [A], tics-per-frame: -1 }
    Death:
      - { sprite: CNSA, frames: [B], tics-per-frame: 30, action: A_DeathScream }
      - { sprite: CNSA, frames: [C, D], tics-per-frame: 30 }
      - { sprite: CNSA, frames: [E], tics-per-frame: 0, action: A_SpawnEnemy("ScanAlien") }
      - { sprite: CNSA, frames: [E], tics-per-frame: 0, action: A_BlockTile }
      - { sprite: CNSA, frames: [E], tics-per-frame: -1 }

LcanCanister:
  parent: ScanCanister
  properties:
    "tag": "$BS_LCANALIEN"
    "monster.becomes": "LcanAlien"
    "deathsound": "bs/lcanbreak"
  states:
    Spawn:
      - { sprite: CNTA, frames: [A], tics-per-frame: -1 }
    Chase:
      - { sprite: CNTA, frames: [A], tics-per-frame: -1 }
    Death:
      - { sprite: CNTA, frames: [B], tics-per-frame: 30, action: A_DeathScream }
      - { sprite: CNTA, frames: [C, D], tics-per-frame: 30 }
      - { sprite: CNTA, frames: [E], tics-per-frame: 0, action: A_SpawnEnemy("LcanAlien") }
      - { sprite: CNTA, frames: [E], tics-per-frame: 0, action: A_BlockTile }
      - { sprite: CNTA, frames: [E], tics-per-frame: -1 }

GurneySleeper:
  parent: Monster
  flags: [STATIONARY]
  properties:
    "tag": "$BS_GURNEYMUTANT"
    "health": 1
    "monster.becomes": "GurneyMutant"
    "monster.wakedelay": [0]
    "monster.wakeprotected": true
  states:
    Spawn:
      - { sprite: MGUR, frames: [A], tics-per-frame: -1, think: T_WaitToWake }
    Chase:
      - { sprite: MGUR, frames: [A], tics-per-frame: -1 }
    Wake:
      - { sprite: MGUR, frames: [B], tics-per-frame: 0, next-state: Death }
    Death:
      - { sprite: MGUR, frames: [B, C, D], tics-per-frame: 30 }
      - { sprite: MGUR, frames: [E], tics-per-frame: 0, action: A_SpawnEnemy("GurneyMutant") }
      - { sprite: MGUR, frames: [E], tics-per-frame: 0, action: A_BlockTile }
      - { sprite: MGUR, frames: [E], tics-per-frame: -1 }

PodEgg:
  parent: Monster
  properties:
    "switched": kill      # a smart switch on its tile hatches it (Program.SmartSwitch.cs)
    "tag": "$BS_PODALIEN"
    "health": 1
    "monster.becomes": "PodAlien"
    "monster.wakedelay": [5, 24]
  states:
    Spawn:
      - { sprite: PODA, frames: [A], tics-per-frame: -1, think: T_WaitToWake }
    Chase:
      - { sprite: PODA, frames: [A], tics-per-frame: -1 }
    Wake:
      - { sprite: PODA, frames: [B], tics-per-frame: 0, next-state: Death }
    Death:
      - { sprite: PODA, frames: [B], tics-per-frame: 45, action: 'A_PlaySound("bs/podhatch", "positional")' }
      - { sprite: PODA, frames: [C, D], tics-per-frame: 45 }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: 'A_SpawnEnemy("PodAlien", "chase")' }
      - { sprite: TNT1, frames: [A], tics-per-frame: 0, action: A_Remove }

# An egg that never hatches (bstone's, below a pod egg's skill): just there in the way
PodEggDud:
  radius: 32
  flags: [SOLID]
  states:
    Spawn:
      - { sprite: PODA, frames: [A], tics-per-frame: -1 }

# -----------------------------------------------------------------------
# Their shots: they burst on a wall or on Blake, for 0-15
# -----------------------------------------------------------------------
