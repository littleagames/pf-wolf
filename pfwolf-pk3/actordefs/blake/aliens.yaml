# Blake Stone's mutants and aliens, as bstone has them (its "offset objects": 3d_act2.cpp's
# s_ofs_* states, the same for all of them, each with its own pictures). They notice Blake once
# he can see them, face no way in particular (they see all round), and take turns at closing in
# and attacking (monster.shootmode). One within a tile goes at him hand to hand (Melee) when it
# can; further off it spits or shoots (Attack). Health is by skill (novice, skilled, expert,
# veteran). The map numbers that place them are in mapdefs/blake/aliens.yaml; their shots are at
# the end.

BlakeAlien:
  parent: BlakeEnemy
  flags: [NOTICEWHENSEEN]
  properties:
    "monster.shootmode": true
    "monster.ammo": [30, 89]
    "monster.reactiondelay": [1]
    "attacksound": "bs/atkcharged"

# -----------------------------------------------------------------------
# Genetic guard: shoots, and punches up close; leaves its slow fire protector or a charge pack
# -----------------------------------------------------------------------
GeneticGuard:
  parent: BlakeAlien
  properties:
    "tag": "$BS_GENETICGUARD"
    "health.baby": 20
    "health.easy": 60
    "health.normal": 180
    "health.hard": 240
    "points": 10000
    "monster.chasespeedmultiplier": 3
    "seesound": "bs/gguardhalt"
    "meleesound": "bs/punchattack"
    "deathsound": "bs/gguarddeath"
    "dropweapon": "SlowFireProtector"
    "dropweapon.ifmissing": true
    "dropitem": "ChargePack"
  states:
    Spawn:
      - { sprite: GENG, frames: [A], tics-per-frame: -1, think: T_Stand }
    Chase:
      - { sprite: GENG, frames: [A], tics-per-frame: 10, think: T_BlakeChase }
      - { sprite: GENG, frames: [A], tics-per-frame: 5 }
      - { sprite: GENG, frames: [B], tics-per-frame: 8, think: T_BlakeChase }
      - { sprite: GENG, frames: [C], tics-per-frame: 10, think: T_BlakeChase }
      - { sprite: GENG, frames: [C], tics-per-frame: 5 }
      - { sprite: GENG, frames: [D], tics-per-frame: 8, think: T_BlakeChase }
    Pain:
      - { sprite: GENG, frames: [L], tics-per-frame: 15, next-state: Chase }
    Attack:
      - { sprite: GENG, frames: [I], tics-per-frame: 20 }
      - { sprite: GENG, frames: [J], tics-per-frame: 20, action: T_BlakeShoot }
      - { sprite: GENG, frames: [K], tics-per-frame: 10, next-state: Chase }
    Melee:
      - { sprite: GENG, frames: [E], tics-per-frame: 20 }
      - { sprite: GENG, frames: [F], tics-per-frame: 20, action: "A_Melee(220, 1, 31)" }
      - { sprite: GENG, frames: [H], tics-per-frame: 30, next-state: Chase }
    Death:
      - { sprite: GENG, frames: [L], tics-per-frame: 18, think: T_BlowBack, action: A_DeathScream }
      - { sprite: GENG, frames: [M], tics-per-frame: 20, think: T_BlowBack }
      - { sprite: GENG, frames: [N], tics-per-frame: 22, think: T_BlowBack }
      - { sprite: GENG, frames: [O], tics-per-frame: 20, think: T_BlowBack }
      - { sprite: GENG, frames: [P], tics-per-frame: 18, think: T_BlowBack }
      - { sprite: GENG, frames: [Q], tics-per-frame: -1 }

