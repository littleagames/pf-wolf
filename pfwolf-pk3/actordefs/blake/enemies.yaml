        tics-per-frame: 20
        think: T_Path
      - sprite: GSCI
        frames: [D]
        tics-per-frame: 5
      - sprite: GSCI
        frames: [E]
        tics-per-frame: 15
        think: T_Path
    Pain:
      - sprite: GSCI
        frames: [I]
        tics-per-frame: 15
        next-state: Chase
    Attack:
      - sprite: GSCI
        frames: [F]
        tics-per-frame: 6
      - sprite: GSCI
        frames: [G]
        tics-per-frame: 20
        action: T_Shoot
      - sprite: GSCI
        frames: [H]
