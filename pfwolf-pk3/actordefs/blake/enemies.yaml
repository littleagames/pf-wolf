# An informant: never attacks, isn't counted as an enemy, and is worth nothing shot. Talked to,
# it gives a hint (the map's for the room it's in, else a general one); talked to again, its
# charge pack, then its food tokens. Its class (C#'s Informant, by its name) is what makes it one.
Informant:
  parent: Scientist
  properties:
    "tag": "$BS_INFORMANT"
    "health.baby": 1
    "health.easy": 1
    "health.normal": 1
    "health.hard": 1
    "monster.ammo": 0
    "deathsound": ["bs/informantdeath", "bs/informdeath2", "bs/informdeath3"]
    "talk.header": "$BS_INTERROGATE_INFORMANT"
    "talk.hints": "InformantHints"
    "talk.gifts": ["ChargePack", "FoodTokens5"]
    "talk.giftmessages": ["$BS_INFORMANT_AMMO", "$BS_INFORMANT_TOKENS"]
    "talk.killedmessage": "$BS_KILLEDINFORMANT"
