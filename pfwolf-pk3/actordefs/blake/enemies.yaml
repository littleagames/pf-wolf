# -----------------------------------------------------------------------
# Bio-techs: half are informants, half plain scientists (spawn.random). A scientist left alone
# while it patrols only turns on Blake when it hears trouble or sees him standing about; talked
# to, it says something nice (then turns mean if asked again) or something mean and attacks.
# -----------------------------------------------------------------------
BioTech:
  properties:
    "spawn.random": [Scientist, Informant]
  states:
    Spawn:
      - sprite: GSCI
        frames: [A]
        tics-per-frame: -1

Scientist:
  parent: BlakeEnemy
  flags: [SMART, FRIENDLY, RANDOMTURN, TALKATIVE]
  properties:
    "tag": "$BS_SCIENTIST"
    "health.baby": 6
    "health.easy": 9
    "health.normal": 23
    "health.hard": 28
    "points": 500
    "monster.chasespeedmultiplier": 3
    "monster.reactiondelay": [2, 0]
    "monster.ammo": 8
    "seesound": "bs/scientisthalt"
    "attacksound": "bs/atkcharged"
    "deathsound": ["bs/scientistdeath", "bs/scideath2", "bs/scideath3"]
    # A charge pack, or one time in four a food token; nothing once it's out of shots
    "dropitem": "ChargePack"
    "dropitem.alt": "FoodToken"
    "dropitem.altchance": 65
    "dropitem.needsammo": true
    "talk.header": "$BS_INTERROGATE"
    "talk.friendly": "NiceScientistHints"
    "talk.hostile": "MeanScientistHints"
    "talk.style": "Talk"
    "talk.sound": "bs/interrogate"
  states:
    Spawn:
