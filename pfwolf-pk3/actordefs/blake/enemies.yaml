# Blake Stone's guards and bio-techs, as bstone has them (3d_act2.cpp's states, 3d_state.cpp's
# AI): health by skill (novice, skilled, expert, veteran), points, reaction delays and sounds are
# its. They chase dodging (T_Chase), shoot back when hurt (monster.painattack) and slide
# back from the shot that kills them (T_BlowBack); see Program.BlakeAI.cs for what the flags and
# properties do. The map numbers that place them are in mapdefs/blake/enemies.yaml.

# What they all share: patrollers turn aside when blocked, none open a door needing a card, and
# one that walks into Blake turns back
BlakeEnemy:
  parent: BlakeMonster
  flags: [PATROLTURNS, NOLOCKEDDOORS, STEPBACK]
  properties:
    "speed": 512
    "monster.painattack": 192

# -----------------------------------------------------------------------
# Rent-a-cop: runs off for a charge pack or food when out of shots or hurt
# -----------------------------------------------------------------------
RentACop:
  parent: BlakeEnemy
  flags: [SMART]
  properties:
    "tag": "$BS_RENTACOP"
    "health.baby": 6
    "health.easy": 9
    "health.normal": 25
    "health.hard": 38
    "points": 1025
    "monster.chasespeedmultiplier": 3
    "monster.reactiondelay": [1, 4]
    "monster.ammo": 8
    "seesound": "bs/halt"
    "attacksound": "bs/atkcharged"
    "deathsound": ["bs/rentdeath1", "bs/rentdeath2"]
    # Its slow fire protector while Blake hasn't one, else a charge pack, or (one time in four,
    # or always once it's out of shots) a food token
    "dropweapon": "SlowFireProtector"
    "dropweapon.ifmissing": true
    "dropitem": "ChargePack"
    "dropitem.alt": "FoodToken"
    "dropitem.altchance": 65
  states:
    Spawn:
      - sprite: RENT
        frames: [A]
        tics-per-frame: -1
        think: T_Stand
    Path:
      - sprite: RENT
        frames: [B]
        tics-per-frame: 20
        think: T_Path
      - sprite: RENT
        frames: [C]
        tics-per-frame: 5
      - sprite: RENT
        frames: [C]
        tics-per-frame: 15
        think: T_Path
      - sprite: RENT
        frames: [D]
        tics-per-frame: 20
        think: T_Path
      - sprite: RENT
        frames: [D]
        tics-per-frame: 5
      - sprite: RENT
        frames: [E]
        tics-per-frame: 15
        think: T_Path
    Pain:
      - sprite: RENT
        frames: [I]
        tics-per-frame: 15
        next-state: Chase
    Attack:
      - sprite: RENT
        frames: [F]
        tics-per-frame: 20
      - sprite: RENT
        frames: [G]
        tics-per-frame: 20
        action: T_Shoot
      - sprite: RENT
        frames: [H]
        tics-per-frame: 20
        next-state: Chase
    Chase:
      - sprite: RENT
        frames: [B]
        tics-per-frame: 10
        think: T_Chase
      - sprite: RENT
        frames: [B]
        tics-per-frame: 3
      - sprite: RENT
        frames: [C]
        tics-per-frame: 8
        think: T_Chase
      - sprite: RENT
        frames: [D]
        tics-per-frame: 10
        think: T_Chase
      - sprite: RENT
        frames: [D]
        tics-per-frame: 3
      - sprite: RENT
        frames: [E]
        tics-per-frame: 8
        think: T_Chase
    Death:
      - sprite: RENT
        frames: [J]
        tics-per-frame: 17
        think: T_BlowBack
        action: A_DeathScream
      - sprite: RENT
        frames: [K]
        tics-per-frame: 21
        think: T_BlowBack
      - sprite: RENT
        frames: [L]
        tics-per-frame: 16
        think: T_BlowBack
      - sprite: RENT
        frames: [M]
        tics-per-frame: 13
        think: T_BlowBack
      - sprite: RENT
        frames: [N]
        tics-per-frame: -1

