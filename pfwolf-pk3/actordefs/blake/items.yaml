# Blake Stone's pickups, with what they give as bstone's GetBonus does (3d_agent.cpp). The weapons
# are in weapons.yaml; the map numbers that place these are in mapdefs/blake/decorations.yaml.

# --- Access cards: each opens the doors its number locks (mapdefs/blake/doors.yaml door-locks),
# and is used up unlocking one. Blake carries at most one of each.
BlakeCard:
  parent: Key
  properties:
    "inventory.maxamount": 1
    "inventory.pickupsound": "bs/getkey"
    "key.lockedsound": "player/usefail"

RedCard:
  parent: BlakeCard
  properties:
    "key.statusbarslot": 0
    "key.statusbarcolor": "201"
    "key.statusbaremptycolor": "17"
    "inventory.pickupmessage": "$BS_GOTREDCARD"
    "key.lockedmessage": "$BS_REDDENIED"
  states:
    Spawn:
      - sprite: RCRD
        frames: [A]
        tics-per-frame: -1

YellowCard:
  parent: BlakeCard
  properties:
    "key.statusbarslot": 1
    "key.statusbarcolor": "185"
    "key.statusbaremptycolor": "49"
    "inventory.pickupmessage": "$BS_GOTYELLOWCARD"
    "key.lockedmessage": "$BS_YELLOWDENIED"
  states:
    Spawn:
      - sprite: YCRD
        frames: [A]
        tics-per-frame: -1

GreenCard:
  parent: BlakeCard
  properties:
    "key.statusbarslot": 2
    "key.statusbarcolor": "91"
    "key.statusbaremptycolor": "81"
    "inventory.pickupmessage": "$BS_GOTGREENCARD"
    "key.lockedmessage": "$BS_GREENDENIED"
  states:
    Spawn:
      - sprite: GCRD
        frames: [A]
        tics-per-frame: -1

BlueCard:
  parent: BlakeCard
  properties:
    "key.statusbarslot": 3
    "key.statusbarcolor": "156"
    "key.statusbaremptycolor": "145"
    "inventory.pickupmessage": "$BS_GOTBLUECARD"
    "key.lockedmessage": "$BS_BLUEDENIED"
  states:
    Spawn:
      - sprite: BCRD
        frames: [A]
        tics-per-frame: -1

GoldCard:
  parent: BlakeCard
  properties:
    "key.statusbarslot": 4
    "key.statusbarcolor": "43"
    "key.statusbaremptycolor": "33"
    "inventory.pickupmessage": "$BS_GOTGOLDCARD"
    "key.lockedmessage": "$BS_GOLDDENIED"
  states:
    Spawn:
      - sprite: OCRD
        frames: [A]
        tics-per-frame: -1

# --- Health: each heals up to 100. Food leaves its remains behind (Pickup spawns them).
FirstAidKit:
  parent: Health
  properties:
    "inventory.amount": 30
    "inventory.pickupsound": "bs/health1"
    "inventory.pickupmessage": "$BS_GOTFIRSTAID"
  states:
    Spawn:
      - sprite: FAID
        frames: [A]
        tics-per-frame: -1

Ham:
  parent: Health
  properties:
    "inventory.amount": 20
    "monster.healthgain": 12     # a running enemy on it eats it, for this much
    "inventory.pickupsound": "bs/health1"
    "inventory.pickupmessage": "$BS_GOTMEAT"
  states:
    Spawn:
      - sprite: HAMM
        frames: [A]
        tics-per-frame: -1
    Pickup:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnThing("HamBone")

ChickenLeg:
  parent: Health
  properties:
    "inventory.amount": 15
    "monster.healthgain": 8     # a running enemy on it eats it, for this much
    "inventory.pickupsound": "bs/health1"
    "inventory.pickupmessage": "$BS_GOTMEAT"
  states:
    Spawn:
      - sprite: CKLG
        frames: [A]
        tics-per-frame: -1
    Pickup:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnThing("ChickenBone")

Sandwich:
  parent: Health
  properties:
    "inventory.amount": 10
    "inventory.pickupsound": "bs/health1"
    "monster.healthgain": 8     # a running enemy on it eats it, for this much
    "inventory.pickupmessage": "$BS_GOTSANDWICH"
  states:
    Spawn:
      - sprite: SNDW
        frames: [A]
        tics-per-frame: -1
    Pickup:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnThing("SandwichWrapper")

CandyBar:
  parent: Health
  properties:
    "inventory.amount": 8
    "inventory.pickupsound": "bs/health1"
    "monster.healthgain": 8     # a running enemy on it eats it, for this much
    "inventory.pickupmessage": "$BS_GOTCANDY"
  states:
    Spawn:
      - sprite: CNDY
        frames: [A]
        tics-per-frame: -1
    Pickup:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnThing("CandyWrapper")

WaterBowl:
  parent: Health
  properties:
    "inventory.amount": 5
    "inventory.pickupsound": "bs/health1"
    "inventory.pickupmessage": "$BS_GOTWATER"
    "monster.healthgain": 2     # a running enemy on it eats it, for this much
  states:
    Spawn:
      - sprite: WBWL
        frames: [A]
        tics-per-frame: -1
    Pickup:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnThing("EmptyWaterBowl")

# Only drunk from when nearly dead: bstone takes it at 15 health or less. A health item heals up
# to its maxamount and isn't taken at or above it, so this one stops at 16.
WaterPuddle:
  parent: Health
  properties:
    "inventory.amount": 5
    "inventory.maxamount": 16
    "inventory.pickupsound": "bs/health1"
    "inventory.pickupmessage": "$BS_GOTPUDDLE"
  states:
    Spawn:
      - sprite: WPUD
        frames: [A]
        tics-per-frame: -1

# --- Ammo: the energy weapons share one supply of charge units, at most 100
ChargeUnit:
  parent: Ammo
  properties:
    "inventory.type": ChargeUnit
    "monster.ammogain": 8         # a running enemy out of ammo on it takes it, for this many shots
    "inventory.amount": 8
    "inventory.maxamount": 100
    "inventory.pickupsound": "bs/getammo"
    "inventory.pickupmessage": "$BS_GOTCHARGEUNIT"
  states:
    Spawn:
      - sprite: CHGU
        frames: [A]
        tics-per-frame: -1

# bstone gives 1 to 8 units at random; a fixed 4 until pickups can give random amounts
ChargePack:
  parent: ChargeUnit
  properties:
    "inventory.amount": 4
    "inventory.pickupmessage": "$BS_GOTCHARGEPACK"
  states:
    Spawn:
      - sprite: CHRG
        frames: [A]
        tics-per-frame: -1

# --- Food tokens, spent at the food units: at most 25
