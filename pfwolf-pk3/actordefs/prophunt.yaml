# Prop Hunt (Gameplay/MatchModes/PropHunt.cs). Shared by every game pack; a pack's own actordefs
# can redefine them.
#
# A prop's part: the loadout and weapons it has (PlayerState.RoleClass) whatever class the player
# picked. Its look is the decoration it's disguised as, never this class's, so it needs no sprites.
# A decoration class with `flags: [NODISGUISE]` is one no prop can look like (puddles, flat on
# the floor; the modes' flags).
PropPlayer:
  parent: Player
  properties:
    # Nothing to fight with, and never picks up a weapon or ammo
    "player.weapons": [PropHands]
    "player.startitem":
      PropHands: 1

# A prop's empty hands: nothing to see, and firing taunts the hunters with a sound from where
# the prop stands (A_Taunt picks one of its sounds at random), at most once every 2 seconds.
# Each `prophunt.health` on a decoration class sets the most health a prop has as it (1-100);
# left out, it goes by the decoration's size: 50, up to 100 for a solid one (radius 32).
PropHands:
  parent: Weapon
  properties:
    "inventory.type": PropHands
    "weapon.slot": 1
    "weapon.selectionorder": 9000
  states:
    Ready:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 140
        action: A_Taunt("guard/sight", "ss/sight", "officer/sight", "dog/sight", "hans/sight", "misc/yeah", "misc/slurpie")
        next-state: Ready
