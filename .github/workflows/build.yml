# Builds the game, the editor and the tests on Windows, Linux and macOS, and runs the tests
# headless (docs/dev/mac-linux-plan.md). The runners have no game data files, so the tests that
# need them (Category GameData) skip.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # No window and no sound card: SDL's dummy drivers, OpenAL Soft's null output
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # AnyCPU, not -p:Platform=x64: macos-latest is Apple Silicon
      - name: Build
        run: dotnet build Tests/PFWolf.Tests/PFWolf.Tests.csproj -c Release

      - name: Test
        run: dotnet test Tests/PFWolf.Tests/PFWolf.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
