# Builds the game, the editor and the tests on Windows, Linux and macOS, and runs the tests
# headless (docs/dev/mac-linux-plan.md). The runners have no game data files, so the tests that
# need them (Category GameData) skip.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # No window and no sound card: SDL's dummy drivers, OpenAL Soft's null output
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      ALSOFT_DRIVERS: "null"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # AnyCPU, not -p:Platform=x64: macos-latest is Apple Silicon
      - name: Build
        run: dotnet build Tests/PFWolf.Tests/PFWolf.Tests.csproj -c Release

      - name: Test
        run: dotnet test Tests/PFWolf.Tests/PFWolf.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults

      # The failed tests as annotations on the run, which can be read without signing in (the
      # logs can't): a count with every name, then the first ones' messages (GitHub shows ten
      # errors and ten warnings a step)
      - name: Failed tests
        if: failure()
        shell: pwsh
        run: |
          function Escape([string]$text) { $text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A' }
          function EscapeTitle([string]$text) { (Escape $text) -replace ':', '%3A' -replace ',', '%2C' }
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $failed = Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
              Select-Xml -Path $_.FullName -XPath '//t:UnitTestResult[@outcome="Failed"]' -Namespace $ns | ForEach-Object { $_.Node }
          }
          $names = ($failed | ForEach-Object { $_.testName }) -join '; '
          Write-Output "::error title=$($failed.Count) tests failed::$(Escape $names)"
          $i = 0
          foreach ($result in $failed) {
              $message = "$($result.Output.ErrorInfo.Message) $($result.Output.ErrorInfo.StackTrace)"
              if ($message.Length -gt 1500) { $message = $message.Substring(0, 1500) }
              $level = if ($i -lt 9) { 'error' } else { 'warning' }
              Write-Output "::$level title=$(EscapeTitle $result.testName)::$(Escape $message)"
              if (++$i -ge 19) { break }
          }

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
