# Merged into Wolfenstein 3-D's game-info.yaml only (game-info.yaml at the mod's root is for
# every game the mod is for), and the releases built on it (the shareware's own file takes the
# arenas out again).
#
# Deathmatch arenas (maps/wolf3d/DM01.wad..., made by examples/tools/make-deathmatch-maps.ps1):
# picked by name in the multiplayer lobby; in no episode, but `map DM01` warps to one to try it
# out. No exits: a match ends on its frag or time limit. Without the mod there are none, and
# every mode starts on an episode, as a co-op game does.
maps:
  DM01:
    name: "Four Corners"
    deathmatch: true
    floor-number: 1
    music: GETTHEM
    cluster: 1
    # Plane 5's light zones (the generator's ZoneIds)
    zones:
      1: { light: 210, color: "#D8E4FF" }               # steel base (NW), cool
      2: { light: 210, color: "#FFE0B0" }               # wood base (NE), warm lamplight
      3: { light: 190 }                                 # grey stone base (SW)
      4: { light: 200, color: "#C4D2FF" }               # blue stone base (SE)
      5: { light: 110 }                                 # halls, from the bases
      6: { light: 170 }                                 # joint rooms (machine guns)
      7: { light: 48 }                                  # secret passages
      8: { light: 150, effect: flicker, low: 70 }       # weapon vaults, a failing lamp
      9: { light: 130 }                                 # arena
      10: { light: 255 }                                # the arena's middle (chaingun)
  DM02:
    name: "Hell's Highways"
    deathmatch: true
    floor-number: 2
    music: ULTIMATE
    cluster: 1
    # Walls are 2 stories; the lane walls, fire walls and arches 3 (plane 3: the generator's Heights)
    wall-height: 2
    # graphics/HHSKY.png, drawn above the horizon in place of the ceiling
    sky: HHSKY
    floor-color: "#3C1C10"
    zones:
      1: { light: 200, color: "#C8D8FF" }               # west base (grey stone), cool
      2: { light: 200, color: "#C8D8FF" }               # east base (blue stone), cool
      3: { light: 170, color: "#FFB080" }               # outer lanes, fiery
      4: { light: 150, color: "#FF9A8A" }               # middle lane, red
      5: { light: 255 }                                 # the middle (rocket launcher)
      6: { light: 110 }                                 # connectors and base corridors
      7: { light: 220 }                                 # armories (chaingun)
      8: { light: 40 }                                  # secret passages
      9: { light: 160, effect: flicker, low: 60 }       # stashes
  DM03:
    name: "The Wheel"
    deathmatch: true
    floor-number: 3
    music: WARMARCH
    cluster: 1
    zones:
      1: { light: 200, color: "#D8F0C8" }               # mossy stone spawn (NW), green
      2: { light: 200, color: "#FFE0B0" }               # wood spawn (NE), warm lamplight
      3: { light: 190 }                                 # grey brick spawn (SW)
      4: { light: 200, color: "#C4D2FF" }               # blue panel spawn (SE), cool
      5: { light: 120 }                                 # spawn halls
      6: { light: 140, color: "#FFD8C0" }               # ring
      7: { light: 220 }                                 # corridors (weapons)
      8: { light: 170 }                                 # hub
      9: { light: 255, color: "#C8F0FF", effect: pulse, low: 160 } # the pillar's vault (extra life)
      10: { light: 40 }                                 # secret passages
      11: { light: 150, effect: flicker, low: 60 }      # stashes
  DM04:
    name: "The Red Pit"
    deathmatch: true
    floor-number: 4
    music: NAZI_RAP
    cluster: 1
  # Made for Heist: `modes` lists what it's an arena for; the DM arenas above, listing none, are
  # arenas for every mode but Heist
  HE01:
    name: "The Vault"
    deathmatch: true
    modes: [heist, team-deathmatch]
    floor-number: 5
    music: SEARCHN
    cluster: 1
  # Made for Prop Hunt: storerooms full of decorations to look like
  PH01:
    name: "The Storerooms"
    deathmatch: true
    modes: [prop-hunt, deathmatch, team-deathmatch]
    floor-number: 6
    music: CORNER
    cluster: 1
