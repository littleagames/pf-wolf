# Merged into Wolfenstein 3-D's game-info.yaml only (game-info.yaml at the mod's root is for
# every game the mod is for), and the releases built on it (the shareware's own file takes the
# arenas out again).
#
# Deathmatch arenas (maps/wolf3d/DM01.wad..., made by examples/tools/make-deathmatch-maps.ps1):
# picked by name in the multiplayer lobby; in no episode, but `map DM01` warps to one to try it
# out. No exits: a match ends on its frag or time limit. Without the mod there are none, and
# every mode starts on an episode, as a co-op game does.
maps:
  DM01:
    name: "Four Corners"
    deathmatch: true
    floor-number: 1
    music: GETTHEM
    cluster: 1
    # Plane 5's light zones (the generator's ZoneIds)
    zones:
      1: { light: 210, color: "#D8E4FF" }               # steel base (NW), cool
      2: { light: 210, color: "#FFE0B0" }               # wood base (NE), warm lamplight
      3: { light: 190 }                                 # grey stone base (SW)
      4: { light: 200, color: "#C4D2FF" }               # blue stone base (SE)
      5: { light: 110 }                                 # halls, from the bases
      6: { light: 170 }                                 # joint rooms (machine guns)
      7: { light: 48 }                                  # secret passages
      8: { light: 150, effect: flicker, low: 70 }       # weapon vaults, a failing lamp
      9: { light: 130 }                                 # arena
      10: { light: 255 }                                # the arena's middle (chaingun)
  DM02:
    name: "Cellblock"
    deathmatch: true
    floor-number: 2
    music: SUSPENSE
    cluster: 1
  DM03:
    name: "Wooden Halls"
    deathmatch: true
    floor-number: 3
    music: WARMARCH
    cluster: 1
  DM04:
    name: "The Red Pit"
    deathmatch: true
    floor-number: 4
    music: NAZI_RAP
    cluster: 1
  # Made for Heist: `modes` lists what it's an arena for; the DM arenas above, listing none, are
  # arenas for every mode but Heist
  HE01:
    name: "The Vault"
    deathmatch: true
    modes: [heist, team-deathmatch]
    floor-number: 5
    music: SEARCHN
    cluster: 1
  # Made for Prop Hunt: storerooms full of decorations to look like
  PH01:
    name: "The Storerooms"
    deathmatch: true
    modes: [prop-hunt, deathmatch, team-deathmatch]
    floor-number: 6
    music: CORNER
    cluster: 1
