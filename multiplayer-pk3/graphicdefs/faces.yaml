# The enemy player classes' status bar faces (actordefs/players.yaml player.face and the rest):
# each a 24x32 bust, the size of B.J.'s face, cut from the enemy's own sprite on the grey B.J.'s
# faces have behind them. The face looks around through three of the standing frame's sides
# (8, 1 and 2), grins with its attack frame, winces with its pain frame and shows its first death
# frame once dead. The dog has no pain frame, so it doesn't wince.

# Guard
GUARDFACE8: { source: GARDA8, x: 19, y: 13, width: 24, height: 32, background: "#484848" }
GUARDFACE1: { source: GARDA1, x: 19, y: 13, width: 24, height: 32, background: "#484848" }
GUARDFACE2: { source: GARDA2, x: 19, y: 13, width: 24, height: 32, background: "#484848" }
GUARDGRIN:  { source: GARDG0, x: 20, y: 14, width: 24, height: 32, background: "#484848" }
GUARDOUCH:  { source: GARDI0, x: 24, y: 14, width: 24, height: 32, background: "#484848" }
GUARDDEAD:  { source: GARDK0, x: 23, y: 9, width: 24, height: 32, background: "#484848" }

