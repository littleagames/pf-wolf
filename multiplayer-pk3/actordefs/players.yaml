# The dog has no stand or pain frames: it stands, and flinches, on its first walk frame. E to G
# is its leap and bite.
DogPlayer:
  parent: "Player"
  states:
    Spawn:
      - sprite: DOGY
        frames: [A]
        tics-per-frame: -1
    See:
      - sprite: DOGY
        frames: [A, B, C, D]
        tics-per-frame: 8
    Missile:
      - sprite: DOGY
        frames: [E, F, G]
        tics-per-frame: 6
    Pain:
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
    Pain1:
      - sprite: DOGY
        frames: [A]
        tics-per-frame: 10
    Death:
      - sprite: DOGY
        frames: [H, I, J]
        tics-per-frame: 15
      - sprite: DOGY
        frames: [K]
        tics-per-frame: -1
  properties:
    "tag": "Dog"
    "deathsound": "dog/death"
    # No pain frame, so no player.faceouch: it doesn't wince
    "player.face": [DOGFACE8, DOGFACE1, DOGFACE2]
    "player.facegrin": DOGGRIN
    "player.facedead": DOGDEAD
    # Eyes a quarter of a story up, not half (texels, 64 a story)
    "player.eyeheight": 16
    # Bites, and never picks up a weapon or ammo
    "player.weapons": [DogBite]
    "player.startitem":
      DogBite: 1

# The dog's only weapon: a knife's bite (0-15, as an enemy dog's), with nothing in hand to see.
# Never on the map; DogPlayer starts with it.
DogBite:
  parent: "WolfWeapon"
  properties:
    "inventory.type": DogBite
    "weapon.slot": 1
    "weapon.ammouse1": 0
    "weapon.selectionorder": 3800
    "attacksound": "dog/attack"
  flags: [WEAPON.NOAUTOFIRE, WEAPON.NOALERT]
  states:
    Ready:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 6
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 6
        action: "A_CustomPunch(random(0,15), true, CPF_ALWAYSPLAYSOUND)"
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 12
        next-state: Ready
