        tics-per-frame: 8
    Missile:
      - sprite: SSWV
        frames: [E, F, G]
        tics-per-frame: 6
    Pain:
      - sprite: SSWV
        frames: [H]
        tics-per-frame: 10
    Pain1:
      - sprite: SSWV
        frames: [I]
        tics-per-frame: 10
    Death:
      - sprite: SSWV
        frames: [J, K, L]
        tics-per-frame: 15
