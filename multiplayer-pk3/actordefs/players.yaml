# Playing as one of the enemies: player classes (pfwolf-pk3 actordefs/wolf3d/player.yaml) that
# look like a Guard, Officer, SS, Mutant or Dog to the other players (and the camera, spectating).
# Picked in the lobby's "Play as" (game-info.yaml player-classes; class-menu: false keeps them
# out of single player's new-game menu).
#
# Only the look changes: each plays as B.J. does (health, speed, weapons), except the dog, which
# bites (DogBite) and nothing else, and sees from lower down. Its player.weapons keeps every
# other weapon, and the ammo for them, on the floor for the others.
#
# Each body's states use the enemy's own frames, seen from all 8 sides with this mod's SplitWolf
# sprites (sprites/enemies/): Spawn standing, See walking, Missile while the weapon fires, Pain or
# Pain1 when hurt, Death once dead. A class with its own body sprites keeps them whatever weapon
# it holds (weapon.bodysprite only stands in for Player's PLMP), and every state is given, since
# one left out would be Player's (B.J.'s) own.

GuardPlayer:
  parent: "Player"
  states:
    Spawn:
      - sprite: GARD
        frames: [A]
        tics-per-frame: -1
    See:
      - sprite: GARD
        frames: [B, C, D, E]
        tics-per-frame: 8
    Missile:
      - sprite: GARD
        frames: [F, G, H]
        tics-per-frame: 6
    Pain:
      - sprite: GARD
        frames: [I]
        tics-per-frame: 10
    Pain1:
      - sprite: GARD
        frames: [J]
        tics-per-frame: 10
    Death:
      - sprite: GARD
        frames: [K, L, M]
        tics-per-frame: 15
      - sprite: GARD
        frames: [N]
        tics-per-frame: -1
  properties:
    "tag": "Guard"
    "deathsound": "guard/death"
    # The status bar face (graphicdefs/faces.yaml)
    "player.face": [GUARDFACE8, GUARDFACE1, GUARDFACE2]
    "player.facegrin": GUARDGRIN
    "player.faceouch": GUARDOUCH
    "player.facedead": GUARDDEAD

OfficerPlayer:
