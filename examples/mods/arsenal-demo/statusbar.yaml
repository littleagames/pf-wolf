# Wolf3D's status bar has no power meter. This adds one along the bottom of the level, score and
# lives box: it fills as a grenade's throw cooks (fire held), green, then yellow, then red.
# box is [x, y, width, height] from the bar's top left, the width at full power; box-fill: bar
# puts that piece of the bar's own picture back as the meter shrinks.
power-meter:
  x: 0
  y: 0
  box: [10, 33, 94, 3]
  box-fill: bar
  color: "#E02020"
  levels:
    - { below: 60, lit: ["#30C030"] }
    - { below: 90, lit: ["#E0D020"] }
