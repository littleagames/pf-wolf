# Wolf3D's status bar has no power meter. This adds one along the bottom of the level, score and
# lives box: riding the boat, it shows the throttle. box is [x, y, width, height] from the bar's
# top left, the width at full throttle; box-fill: bar puts that piece of the bar's own picture
# back as the meter shrinks.
power-meter:
  x: 0
  y: 0
  box: [10, 33, 94, 3]
  box-fill: bar
  color: "#30A0E0"
