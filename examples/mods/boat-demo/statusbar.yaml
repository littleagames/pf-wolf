# Wolf3D's status bar has no power meter. This adds one along the bottom of the level, score and
# lives box: while the player rides the boat, it shows the throttle, green, then yellow, then
# red near full. (The same meter shows a grenade cooking, or a guard's suspicion, in mods that
# have them.) box is [x, y, width, height] from the bar's top left, the width at full power.
power-meter:
  x: 0
  y: 0
  box: [10, 33, 94, 3]
  color: Red
  levels:
    - { below: 60, lit: ["#30C030"] }
    - { below: 90, lit: ["#E0D020"] }
