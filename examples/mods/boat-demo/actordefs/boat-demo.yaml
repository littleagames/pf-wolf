# The Boat Demo's actors. Vehicles and mounted guns are in the engine (Gameplay/Vehicles.cs and
# Gameplay/MountedWeapons.cs); everything here is properties and states.
#
#   Boat            what the player rides: using it from the pier runs its Use state's A_Board,
#                   and the boat goes, with the player on its tile riding it. Forward and back
#                   are the throttle (the status bar's meter shows it), turning steers, and it
#                   carries them the way they face. It stops at the docks; use beside one gets
#                   them off, and the boat is put back where they were.
#   Dock            a marker on each dock tile (never placed itself): the boat can't go onto it,
#                   and a rider gets off onto it
#   KeepOut         a marker on each river tile: no one walks onto it, enemy or player (the
#                   boat's how you cross; riding it isn't walking)
#   GunNest         the sandbagged gun: using it runs A_Mount, putting the player on its tile
#                   with the NestGun in hand. They can turn but not move, and take half damage
#                   behind the sandbags; use again steps them off behind it.
#   NestGun         the gun they man: a gatling gun (its rate of fire and damage) in Midnight
#                   Assault's nest gun's pictures and sound, that needs no ammo, only ever held
#                   while manning the nest (weapon.mounted)
#
# The boat, the nest, its gun and their sounds are Midnight Assault's
# (examples/tools/make-boat-demo.ps1).

Boat:
  properties:
    usemessage: "Press Use to board the boat"
    # Global units a tic (65536 a tile): its top speed, and how fast forward and back change it
    vehicle.maxspeed: 3600
    vehicle.accel: 40
    vehicle.brake: 90
    vehicle.exitmessage: "You step onto the dock."
    vehicle.exitsound: boat/dock
    vehicle.noexit: "No dock here: pull alongside one to get out."
    # Kept up while a dock is beside the boat
    vehicle.dockmessage: "Press use to step onto the dock"
  flags: [SOLID]
  states:
    # Rocking on the water
    Spawn:
      - sprite: BDBT
        frames: [A, B, C, D, C, B]
        tics-per-frame: 12
        next-state: Spawn
    Use:
      - sprite: BDBT
        frames: [A]
        tics-per-frame: 1
        action: A_Board("boat/motor", "Forward and back work the throttle. Steer alongside a dock and press use to get out.")
        next-state: Spawn

Dock:
  properties:
    docktile: true

KeepOut:
  properties:
    blocktile: all

GunNest:
  properties:
    usemessage: "Press use to man the gun; use again to step off"
  flags: [SOLID]
  states:
    Spawn:
      - sprite: BDNS
        frames: [A]
        tics-per-frame: -1
    Use:
      - sprite: BDNS
        frames: [A]
        tics-per-frame: 1
        action: A_Mount("NestGun", "boat/gunpivot")
        next-state: Spawn

NestGun:
  parent: GatlingGun
  properties:
    attacksound: boat/nestgun
    weapon.mounted: true
    # the share of a hit the player takes while manning it, in percent
    weapon.mountdamage: 50
    weapon.mountnoroom: "No room to step off the gun."
    weapon.ammouse1: 0
    weapon.ammogive1: 0
  # The gatling gun's fire (two shots each 12 tics while fire's held), Midnight Assault's gun
  states:
    Ready:
      - sprite: BDMG
        frames: [A]
        tics-per-frame: 1
        action: A_WeaponReady
        next-state: Ready
    Fire:
      - sprite: BDMG
        frames: [B]
        tics-per-frame: 6
        next-state: Hold
    Hold:
      - sprite: BDMG
        frames: [C]
        tics-per-frame: 6
        modifiers: [bright]
        light: { intensity: 200, radius: 3, color: "#FFF0D0" }
        action: A_GunAttack
      - sprite: BDMG
        frames: [D]
        tics-per-frame: 6
        action: A_GunAttack
      - sprite: BDMG
        frames: [D]
        tics-per-frame: 0
        action: A_ReFire
      - sprite: BDMG
        frames: [A]
        tics-per-frame: 1
        next-state: Ready
