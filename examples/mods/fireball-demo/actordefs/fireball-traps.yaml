# Fireball traps: walls (and a pile of bones) that spit fireballs.
#
# The wall shooters stand inside their walls (mapdefs `in-wall: true`) and fire out of the face
# their map facing points out of. They're plain actors (no health, nothing to shoot) drawn as
# nothing (TNT1). Each waits until a player is in sight in front of its face
# (A_JumpIfInSight), then fires with A_SpawnProjectile: straight out, fanned, or aimed.
#
# A frame's action runs as the frame ends, so "wait, then fire" is one frame with the wait as
# its tics; 0-tic frames run in the same tic. A state's frames loop unless next-state says
# where to go.

# The fireball: Fake Hitler's flame (FIRE), glowing. A_Projectile(min, max) is its damage on a
# hit. HURTMONSTERS: it burns enemies too, not only players. BURSTONPLAYER: it bursts (its
# Death state) on whoever it hits, as on a wall.
Fireball:
  flags: [PROJECTILE, HURTMONSTERS, BURSTONPLAYER]
  states:
    Spawn:
      - sprite: FIRE
        frames: [A, B]
        tics-per-frame: 6
        modifiers: [bright]
        think: A_Projectile(3, 10)
    Death:
      - sprite: BOOM
        frames: [A, B]
        tics-per-frame: 6
        modifiers: [bright]
      - sprite: BOOM
        frames: [C]
        tics-per-frame: 6
        modifiers: [bright]
        action: A_Remove
  properties:
    "speed": 4608 # 1/65536 tile a tic: a little over half a rocket's (8192), so it can be dodged
    "attacksound": "flame/fire"
    "deathsound": "missile/hit"
    "light.intensity": 160
    "light.radius": 2
    "light.color": "#FF8030"

# Straight out of its face every second and a half, while a player is in sight within 8 tiles
WallFireball:
  states:
    Spawn:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 10
        action: A_JumpIfInSight("Fire", 8)
    Fire:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnProjectile("Fireball")
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 105
        next-state: Spawn

# Five at once, fanned across 60 degrees centred on the player (A_FireBurst, this mod's
# scripts/fireball-patterns.lua)
WallFireballFan:
  parent: WallFireball
  states:
    Fire:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_FireBurst("Fireball", 5, 60)
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 140
        next-state: Spawn

# While a player is in sight, about three a second, sweeping back and forth across 90 degrees
# (45 either side of straight out of its face) (A_Sweep)
WallFireballSweep:
  parent: WallFireball
  states:
    Fire:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 12
        action: A_Sweep("Fireball", 90, 15)
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        next-state: Spawn

# A HomingFireball straight out of its face every two and a half seconds
WallFireballHoming:
  parent: WallFireball
  states:
    Fire:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnProjectile("HomingFireball")
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 175
        next-state: Spawn

# A fireball that steers toward the player it can see, up to 12 degrees each frame for its
# first 30 frames (A_Home), then flies straight on. Slower, and redder, so it can be outrun.
HomingFireball:
  parent: Fireball
  states:
    Spawn:
      - sprite: FIRE
        frames: [A, B]
        tics-per-frame: 6
        modifiers: [bright]
        think: A_Projectile(3, 10)
        action: A_Home(12, 30)
  properties:
    "speed": 3584
    "light.color": "#FF3020"

# Slower fireballs for the spiral, so its arms can be seen winding out
SpiralFireball:
  parent: Fireball
  properties:
    "speed": 3072

# A pile of skulls that, with a player within 4 tiles, sprays a two-armed spiral: a pair of
# fireballs every 8 tics, each pair turned 20 degrees on (A_FireSpiral). Once the player is
# out of reach it rests for half a second before looking again.
FireballSpiral:
  states:
    Spawn:
      - sprite: SKPI
        frames: [A]
        tics-per-frame: 10
        action: A_JumpIfPlayerWithin(4, "Fire")
    Fire:
      - sprite: SKPI
        frames: [A]
        tics-per-frame: 8
        action: A_FireSpiral("SpiralFireball", 20, 2)
      - sprite: SKPI
        frames: [A]
        tics-per-frame: 0
        action: A_JumpIfPlayerWithin(4, "Fire")
      - sprite: SKPI
        frames: [A]
        tics-per-frame: 35
        next-state: Spawn

# At the player, a quick burst of two, then a rest; now and then (64 in 256) a third
WallFireballAimed:
  parent: WallFireball
  states:
    Fire:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnProjectile("Fireball", 0, "aim")
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 14
        action: A_SpawnProjectile("Fireball", 0, "aim")
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 14
        action: A_Jump(64, "Third")
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 120
        next-state: Spawn
    Third:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 0
        action: A_SpawnProjectile("Fireball", 0, "aim")
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 120
        next-state: Spawn

# A WallFireball a switch turns off and on (A_Deactivate / A_Activate on its tile's tag).
# Active waits for a player as Spawn does; Inactive holds still.
SwitchedWallFireball:
  parent: WallFireball
  states:
    Active:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: 10
        action: A_JumpIfInSight("Fire", 12)
    Inactive:
      - sprite: TNT1
        frames: [A]
        tics-per-frame: -1

# A pile of bones on the floor that, with a player within 4 tiles, throws a ring of eight
# fireballs every way every two seconds, each ring turned 22 degrees from the last.
# A_FireRing is a Lua script's action: this mod's scripts/fireball-patterns.lua.
FireballRing:
  states:
    Spawn:
      - sprite: BON1
        frames: [A]
        tics-per-frame: 10
        action: A_JumpIfPlayerWithin(4, "Fire")
    Fire:
      - sprite: BON1
        frames: [A]
        tics-per-frame: 0
        action: A_FireRing("Fireball", 8, 22)
      - sprite: BON1
        frames: [A]
        tics-per-frame: 140
        next-state: Spawn
