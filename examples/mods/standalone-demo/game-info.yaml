# The whole game-info: a standalone game has no other to start from. What each setting does is
# in the game-info reference: https://www.littleagames.com/pf-wolf/docs/latest/reference/game-info
default-map:
  ceiling-color: "#303848"
  floor-color: "#5A5048"
  # Dim, so the lamps' light shows
  shading:
    light: 150
    fade-start: 2
    fade-end: 18
    max-fade: 70

# The startup info is printed in the signon picture's dark panel
signon:
  pic: SDSIGNON
  press-a-key: true
  text-area: { x: 18, y: 46, width: 284, height: 134 }

# Until a key goes to the menu: the title, then the high scores
title-sequence:
  loop:
    - pics: [{ pic: SDTITLE }]
      seconds: 8
    - high-scores: true
      seconds: 6

# No music: an empty name keeps the menus from asking for the shared menus' WONDERIN
menu-music: ""

# The high scores in the mod's own fonts, with no pictures (Wolf3D's are pictures from its
# VGAGRAPH), and the table a new player starts with
high-scores:
  pics: []
  labels:
    - { text: "High scores", x: 92, y: 30, font: LargeFont, color: READHCOLOR }
    - { text: "Name", x: 32, y: 62, color: READCOLOR }
    - { text: "Floor", x: 148, y: 62, color: READCOLOR }
    - { text: "Score", x: 228, y: 62, color: READCOLOR }
  show-episode: false
  defaults:
    - { name: "The Diver", score: 5000 }
    - { name: "Deep Blue", score: 4000 }
    - { name: "Anglerfish", score: 3000 }
    - { name: "Barnacle", score: 2000 }
    - { name: "Plankton", score: 1000 }

# The skills on the New Game menu, easiest first (a saved game records its skill by its place
# here, and mapdefs min-skill compares against it). Add as many as you like: the menu grows,
# shrinks and scrolls to fit them. Besides its name, each can have:
#   pic-name: a picture shown beside the skills while it's highlighted (Wolf3D's faces are 24x32)
#   damage-taken: how much of the damage the player is dealt they take (default 1)
#   enemy-health: the actordefs property enemies take their health from (health.easy, say)
# For example:
#   EASY:
#     name: "Easy"
#     pic-name: SKILLEASY
#     damage-taken: 0.5
#     enemy-health: health.easy
skills:
  NORMAL:
    name: "Normal"

# Player classes: actordefs classes built on Player (parent: Player) that change its player.*
# properties. With two or more here, a new game asks which before the skill (the first is the
# one played when it doesn't ask: class-menu: false). Each can have a name for the menu and a
# pic-name shown beside it while it's highlighted, up to 96x100. For example:
# player-classes:
#   Player:
#     name: "The Diver"
#   Scout:
#     name: "The Scout"
#     pic-name: SCOUTPIC

# The New Game menus are pfwolf.pk3's (menudefs/new-game.yaml, new-class.yaml and
# new-episode.yaml). A file of the same name in this mod's menudefs/ changes them key by key
# (https://www.littleagames.com/pf-wolf/docs/latest/reference/menudefs). To move the highlighted
# skill's or class's picture, and clear a box behind it first:
#   selection-pic: { x: 230, y: 107, width: 32, height: 32, color: "BKGDCOLOR" }
# fit-items says how a menu fits more or fewer skills or classes: the rows it's laid out for,
# the fewest its window shrinks to (min-rows) and the most before they scroll (max-rows).

episodes:
  EP01:
    name: "The Vault"
    start-map: MAP01

maps:
  MAP01:
    name: "The Vault"
    floor-number: 1
