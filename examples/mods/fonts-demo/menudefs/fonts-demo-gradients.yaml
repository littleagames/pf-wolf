# The Font Gallery's Gradients page (menudefs/fonts-demo.yaml opens it). Made by
# examples/tools/make-fonts-demo.ps1: change it there and run it again.
#
# Each sample is a Label in a font from fonts.yaml (left), with what makes it beside it in the
# small font (right). Glows fade into the window's color (BKGDCOLOR), as text in a menu
# window does.
music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 58
  y: 163
indent: 24
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "Center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "Gradients"
      - horizontal-orientation: "Center"
      - y: 4
      - font: "FdShadowDeep"
      - color: "READHCOLOR"
  -
    type: "Window"
    params:
      - x: 6
      - y: 22
      - width: 308
      - height: 134
  -
    type: "Label"
    params:
      - text: "Gradient"
      - x: 14
      - y: 28
      - font: "FdGradient"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "gradient: {}"
      - x: 160
      - y: 29
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "(top 40, bottom -40)"
      - x: 160
      - y: 38
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Strong"
      - x: 14
      - y: 53
      - font: "FdGradientStrong"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "gradient: { top: 75,"
      - x: 160
      - y: 54
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "  bottom: -75 }"
      - x: 160
      - y: 63
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Flipped"
      - x: 14
      - y: 78
      - font: "FdGradientFlip"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "gradient: { top: -60,"
      - x: 160
      - y: 79
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "  bottom: 40 }"
      - x: 160
      - y: 88
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Shine"
      - x: 14
      - y: 103
      - font: "FdGradientShine"
      - color: "Maroon"
  -
    type: "Label"
    params:
      - text: "gradient: { top: 80,"
      - x: 160
      - y: 104
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "  bottom: 0 }"
      - x: 160
      - y: 113
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Lime"
      - x: 14
      - y: 128
      - font: "FdGradient"
      - color: "Lime"
  -
    type: "Label"
    params:
      - text: "Blue"
      - x: 58
      - y: 128
      - font: "FdGradient"
      - color: "Light Blue"
  -
    type: "Label"
    params:
      - text: "Grey"
      - x: 104
      - y: 128
      - font: "FdGradient"
      - color: "HIGHLIGHT"
  -
    type: "Label"
    params:
      - text: "One font, any color:"
      - x: 160
      - y: 129
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "shades the text's own"
      - x: 160
      - y: 138
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  # One item: 13 pixels plus 6
  -
    type: "Window"
    params:
      - x: 50
      - y: 160
      - width: 220
      - height: 19
menu-items:
  -
      id: "next"
      type: "MenuSwitcher"
      text: "Next: Outlines"
      short-key: O
      enabled: true
      action: "CP_Menu"
      menu: "fonts-demo-outlines"
