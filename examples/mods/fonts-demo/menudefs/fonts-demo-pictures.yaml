# The Font Gallery's Picture Fonts page (menudefs/fonts-demo.yaml opens it). Made by
# examples/tools/make-fonts-demo.ps1: change it there and run it again.
#
# Each sample is a Label in a font from fonts.yaml (left), with what makes it beside it in the
# small font (right). Glows fade into the window's color (BKGDCOLOR), as text in a menu
# window does.
music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 58
  y: 163
indent: 24
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "Center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "Picture Fonts"
      - horizontal-orientation: "Center"
      - y: 4
      - font: "FdShadowDeep"
      - color: "READHCOLOR"
  -
    type: "Window"
    params:
      - x: 6
      - y: 22
      - width: 308
      - height: 134
  -
    type: "Label"
    params:
      - text: "Italic .fnt file"
      - x: 14
      - y: 28
      - font: "FdItalic"
      - color: "White"
  -
    type: "Label"
    params:
      - text: "type: vga"
      - x: 160
      - y: 29
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "fonts/FDITALIC.fnt"
      - x: 160
      - y: 38
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "All upper case"
      - x: 14
      - y: 53
      - font: "FdCaps"
      - color: "White"
  -
    type: "Label"
    params:
      - text: "source: SmallFont"
      - x: 160
      - y: 54
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "upper-case: true"
      - x: 160
      - y: 63
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Dot matrix"
      - x: 14
      - y: 78
      - font: "FdDots"
      - color: "Lime"
  -
    type: "Label"
    params:
      - text: "sheet, colorize,"
      - x: 160
      - y: 79
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "proportional"
      - x: 160
      - y: 88
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Gold sheet"
      - x: 14
      - y: 103
      - font: "FdGold"
      - color: "White"
  -
    type: "Label"
    params:
      - text: "sheet, own colors,"
      - x: 160
      - y: 104
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "transparent: \"#FF00FF\""
      - x: 160
      - y: 113
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "12:45"
      - x: 14
      - y: 128
      - font: "FdLed"
      - color: "White"
  -
    type: "Label"
    params:
      - text: "08:30"
      - x: 84
      - y: 128
      - font: "FdLedTinted"
      - color: "Light Blue"
  -
    type: "Label"
    params:
      - text: "graphic: a picture a"
      - x: 160
      - y: 129
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "character; colorized"
      - x: 160
      - y: 138
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  # One item: 13 pixels plus 6
  -
    type: "Window"
    params:
      - x: 50
      - y: 160
      - width: 220
      - height: 19
menu-items:
  -
      id: "next"
      type: "MenuSwitcher"
      text: "Next: Label Settings"
      short-key: B
      enabled: true
      action: "CP_Menu"
      menu: "fonts-demo-labels"
