# Laid over the game's Options menu (MENU HOOKS, pfwolf.pk3's menudefs/main-menu.yaml): a Font
# Gallery item at the end, opening the mod's own menu (CP_Menu), and the window (its id is
# "window") made one row taller to hold it: 13 pixels a row plus 6.
components:
  -
    id: "window"
    params:
      - x: 68
      - y: 79
      - width: 178
      - height: 97
menu-items:
  -
      id: "fontgallery"
      type: "MenuSwitcher"
      text: "Font Gallery"
      short-key: F
      enabled: true
      action: "CP_Menu"
      menu: "fonts-demo"
