# The Font Gallery's Shadows page (menudefs/fonts-demo.yaml opens it). Made by
# examples/tools/make-fonts-demo.ps1: change it there and run it again.
#
# Each sample is a Label in a font from fonts.yaml (left), with what makes it beside it in the
# small font (right). Glows fade into the window's color (BKGDCOLOR), as text in a menu
# window does.
music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 58
  y: 163
indent: 24
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "Center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "Shadows"
      - horizontal-orientation: "Center"
      - y: 4
      - font: "FdShadowDeep"
      - color: "READHCOLOR"
  -
    type: "Window"
    params:
      - x: 6
      - y: 22
      - width: 308
      - height: 134
  -
    type: "Label"
    params:
      - text: "No shadow"
      - x: 14
      - y: 28
      - font: "LargeFont"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "LargeFont, as it is"
      - x: 160
      - y: 29
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Shadow"
      - x: 14
      - y: 49
      - font: "FdShadow"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "shadow: {}"
      - x: 160
      - y: 50
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Deep shadow"
      - x: 14
      - y: 70
      - font: "FdShadowDeep"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "shadow: { x: 2, y: 2 }"
      - x: 160
      - y: 71
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Blue below"
      - x: 14
      - y: 91
      - font: "FdShadowBlue"
      - color: "White"
  -
    type: "Label"
    params:
      - text: "shadow: { x: 0, y: 2,"
      - x: 160
      - y: 92
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "  color: Blue }"
      - x: 160
      - y: 101
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Lit from below"
      - x: 14
      - y: 112
      - font: "FdEngraved"
      - color: "Black"
  -
    type: "Label"
    params:
      - text: "shadow: { x: -1, y: -1,"
      - x: 160
      - y: 113
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "  color: White }"
      - x: 160
      - y: 122
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Small, shadowed"
      - x: 14
      - y: 133
      - font: "FdShadowSmall"
      - color: "White"
  -
    type: "Label"
    params:
      - text: "source: SmallFont"
      - x: 160
      - y: 134
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "shadow: {}"
      - x: 160
      - y: 143
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  # One item: 13 pixels plus 6
  -
    type: "Window"
    params:
      - x: 50
      - y: 160
      - width: 220
      - height: 19
menu-items:
  -
      id: "next"
      type: "MenuSwitcher"
      text: "Next: Gradients"
      short-key: G
      enabled: true
      action: "CP_Menu"
      menu: "fonts-demo-gradients"
