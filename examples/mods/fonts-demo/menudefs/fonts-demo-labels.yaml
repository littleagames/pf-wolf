# The Font Gallery's Label Settings page (menudefs/fonts-demo.yaml opens it). Made by
# examples/tools/make-fonts-demo.ps1: change it there and run it again.
#
# Each sample is a Label in a font from fonts.yaml (left), with what makes it beside it in the
# small font (right). Glows fade into the window's color (BKGDCOLOR), as text in a menu
# window does.
#
# Here the fonts are plain LargeFont, and each Label gives its own effect (or takes away its
# font's: shadow: false). Setting any of an effect's values (shadow-x, glow-color, ...) turns
# it on; the rest are the defaults.
music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 58
  y: 163
indent: 24
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "Center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "Label Settings"
      - horizontal-orientation: "Center"
      - y: 4
      - font: "FdShadowDeep"
      - color: "READHCOLOR"
  -
    type: "Window"
    params:
      - x: 6
      - y: 22
      - width: 308
      - height: 134
  -
    type: "Label"
    params:
      - text: "Shadow"
      - x: 14
      - y: 28
      - font: "LargeFont"
      - color: "READHCOLOR"
      - shadow: true
  -
    type: "Label"
    params:
      - text: "shadow: true"
      - x: 160
      - y: 29
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Shadow, blue"
      - x: 14
      - y: 49
      - font: "LargeFont"
      - color: "READHCOLOR"
      - shadow-x: 3
      - shadow-color: Blue
  -
    type: "Label"
    params:
      - text: "shadow-x: 3"
      - x: 160
      - y: 50
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "shadow-color: Blue"
      - x: 160
      - y: 59
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Shadow off"
      - x: 14
      - y: 70
      - font: "FdShadowDeep"
      - color: "READHCOLOR"
      - shadow: false
  -
    type: "Label"
    params:
      - text: "font: FdShadowDeep"
      - x: 160
      - y: 71
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "shadow: false"
      - x: 160
      - y: 80
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Gradient"
      - x: 14
      - y: 91
      - font: "LargeFont"
      - color: "Lime"
      - gradient-top: 70
      - gradient-bottom: -70
  -
    type: "Label"
    params:
      - text: "gradient-top: 70"
      - x: 160
      - y: 92
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "gradient-bottom: -70"
      - x: 160
      - y: 101
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Outline"
      - x: 14
      - y: 112
      - font: "LargeFont"
      - color: "Black"
      - outline-color: White
      - outline-thickness: 2
  -
    type: "Label"
    params:
      - text: "outline-color: White"
      - x: 160
      - y: 113
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "outline-thickness: 2"
      - x: 160
      - y: 122
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Glow"
      - x: 14
      - y: 133
      - font: "LargeFont"
      - color: "White"
      - glow-color: Lime
      - glow-radius: 3
  -
    type: "Label"
    params:
      - text: "glow-color: Lime"
      - x: 160
      - y: 134
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "glow-radius: 3"
      - x: 160
      - y: 143
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  # One item: 13 pixels plus 6
  -
    type: "Window"
    params:
      - x: 50
      - y: 160
      - width: 220
      - height: 19
menu-items:
  # The last page: a text (texts/FDHOWTO.txt) on where it all is
  -
      id: "howto"
      type: "MenuSwitcher"
      text: "How It's Made"
      short-key: H
      enabled: true
      action: "CP_Article"
      article: "FDHOWTO"
