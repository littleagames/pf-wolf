# The Font Gallery's Outlines page (menudefs/fonts-demo.yaml opens it). Made by
# examples/tools/make-fonts-demo.ps1: change it there and run it again.
#
# Each sample is a Label in a font from fonts.yaml (left), with what makes it beside it in the
# small font (right). Glows fade into the window's color (BKGDCOLOR), as text in a menu
# window does.
music: "WONDERIN"
type: "wolf3d-menu"
position:
  x: 58
  y: 163
indent: 24
components:
  -
    id: "background"
    type: "Background"
    params:
      - color: "BORDCOLOR"
  -
    id: "legend"
    type: "Graphic"
    params:
      - name: "c_mouselback"
      - horizontal-orientation: "Center"
      - y: 184
  -
    type: "Label"
    params:
      - text: "Outlines"
      - horizontal-orientation: "Center"
      - y: 4
      - font: "FdShadowDeep"
      - color: "READHCOLOR"
  -
    type: "Window"
    params:
      - x: 6
      - y: 22
      - width: 308
      - height: 134
  -
    type: "Label"
    params:
      - text: "Outline"
      - x: 14
      - y: 28
      - font: "FdOutline"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "outline: {}"
      - x: 160
      - y: 29
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Edged in white"
      - x: 14
      - y: 53
      - font: "FdOutlineWhite"
      - color: "Black"
  -
    type: "Label"
    params:
      - text: "outline: { color: White }"
      - x: 160
      - y: 54
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Thick"
      - x: 14
      - y: 78
      - font: "FdOutlineThick"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "outline: { thickness: 2 }"
      - x: 160
      - y: 79
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Round corners"
      - x: 14
      - y: 103
      - font: "FdOutlineRound"
      - color: "READHCOLOR"
  -
    type: "Label"
    params:
      - text: "outline: { thickness: 2,"
      - x: 160
      - y: 104
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "  diagonals: false }"
      - x: 160
      - y: 113
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "Small, outlined"
      - x: 14
      - y: 128
      - font: "FdOutlineSmall"
      - color: "White"
  -
    type: "Label"
    params:
      - text: "source: SmallFont"
      - x: 160
      - y: 129
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  -
    type: "Label"
    params:
      - text: "outline: {}"
      - x: 160
      - y: 138
      - font: "SmallFont"
      - color: "TEXTCOLOR"
  # One item: 13 pixels plus 6
  -
    type: "Window"
    params:
      - x: 50
      - y: 160
      - width: 220
      - height: 19
menu-items:
  -
      id: "next"
      type: "MenuSwitcher"
      text: "Next: Glows"
      short-key: L
      enabled: true
      action: "CP_Menu"
      menu: "fonts-demo-glows"
