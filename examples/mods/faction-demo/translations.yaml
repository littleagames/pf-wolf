# Laid over pfwolf-pk3's gamepacks/wolf3d/translations.yaml (how translations work is in the
# translations reference: https://www.littleagames.com/pf-wolf/docs/latest/reference/translations).
# The mutants' side is drawn blood red, so it can't be taken for the player's green allies
# (a Wolf3D mutant's own clothes are green): desaturated, each pixel's lightness picking a shade
# between black and red, which keeps the sprite's shading whatever its colors.
mutants-red: ["1:254=%[0,0,0]:[1.8,0.35,0.3]"]
