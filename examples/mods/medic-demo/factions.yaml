# Laid over pfwolf-pk3's gamepacks/wolf3d/factions.yaml (allies, the player's side, drawn
# green; axis, the enemies). How factions work is in the manual:
# https://www.littleagames.com/pf-wolf/docs/latest/manual/factions
# No new sides: just how
# each side's medics look, by class (class-translations, the mod's translations.yaml), so you
# can tell a medic from a guard, and yours from theirs.
factions:
  allies:
    class-translations: { Medic: allies-medic }
  axis:
    class-translations: { Medic: medic-white, Surgeon: surgeon-red }
