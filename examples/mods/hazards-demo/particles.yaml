# The Hazards Demo's particle effects, Midnight Assault's own for its electrified water (the
# fields are in the docs' particles.yaml reference). Only for show: they can't hurt or block
# anything and aren't saved. Distances are in texels (64 a tile), times in tics (70 a second),
# speeds in texels a tic. scripts/hazards.lua throws them up off the live water.

types:
  # White-hot sparks jumping off the surface, cooling to the orange of the current, and falling
  # back into it
  HazardWaterSpark:
    shape: streak
    size: 0.9
    colors: ["#FFFFFF", "#FFF0B0", "#FF9030", "#000000"]
    life: 10-22
    gravity: 0.15
    drag: 0.02
    bright: true
    blend: additive
    collide: die

  # A flash on the water where a spark breaks the surface
  HazardWaterArc:
    shape: dot
    size: 5
    size-end: 1
    colors: ["#FFFFFF", "#A0D0FF", "#000000"]
    life: 5-10
    bright: true
    blend: additive
    collide: none

emitters:
  # A burst of sparks, and the flash under them
  HazardWaterZap: { type: HazardWaterSpark, count: 10, speed: 0.8-2, spread: 45, pitch: 90, z: 1, radius: 6 }
  HazardWaterFlash: { type: HazardWaterArc, count: 1, speed: 0-0.05, spread: 180, z: 1, radius: 2 }
