# Merged into the game pack's game-info.yaml: the level's zones (the zone plane, plane 5), each
# a sound looped while you're in it (sounds/sound-seq.yaml names them), and messages over the
# view on (the script says what each room shows). The fields are in the game-info reference:
# https://www.littleagames.com/pf-wolf/docs/latest/reference/game-info
setting-defaults:
  messages: true
  # Sounds placed in the world quieter for each shut door between (Game Options → Muffle Thru
  # Doors, s_muffle): shut the generator room's door from the hall and the machines drop away.
  # Off by default in the game, so this mod turns it on; the player's own choice still wins.
  sound-muffling: true

# What each shut door leaves of a placed sound (0.35 when left out)
sound-muffle: 0.35

maps:
  MAP01:
    # No song, so the ambience is all you hear
    music: ""
    # The reverb the level starts with (the hall's), until you step into a zone with its own.
    # A reverb is one of Creative's EFX presets by name: fire your pistol in each room
    reverb: hallway
    zones:
      # ambient-fade: the tics (70 a second) the change takes as you step in, the last zone's
      # sound fading out as this one's fades in. Doors and doorways are zone 0: no sound of
      # their own, so whatever's playing carries on through them.
      # ambient-2: a second loop over the first. A zone with any ambient sound sets both, so the
      # rain stops as you step into the hall, whose zone has no ambient-2.
      # reverb: the room's reverb, crossfading (reverb-fade, 35 tics when left out) as you step
      # in; doorways have none, so the last one carries on through them.
      1: { ambient: ambience/wind, ambient-2: ambience/rain, ambient-fade: 70, reverb: castle-courtyard }   # the courtyard
      2: { ambient: ambience/sewer, ambient-fade: 70, reverb: sewer-pipe }          # the sewer
      3: { ambient: ambience/hum, ambient-fade: 35, reverb: factory-medium-room }   # the generator room
      # the guard post: tense while no enemy has noticed you yet; seen, the alarm
      4: { ambient: ambience/alarm, ambient-undetected: ambience/tense, ambient-fade: 70, reverb: stone-room }
      5: { ambient: none, ambient-fade: 35, reverb: living-room }   # the radio room: silence but the radio
      6: { ambient: ambience/hall, ambient-fade: 50, reverb: hallway }    # the hall
