# Merged into the game pack's game-info.yaml: the demo level's light zones (the map's zone
# plane, plane 5; see the zones notes under default-map in pfwolf-pk3's
# gamepacks/wolf3d/game-info.yaml), which stations 6 and 7 change as the level is played, and
# its scrollers, which stations 8 and 9 work.
maps:
  MAP01:
    zones:
      # The light room: dark until station 6 turns its lights on
      1: { light: 24 }
      # The hall: full light. Station 7's alarm tints it red and strobes it down to low,
      # bright for bright-tics of every tics (70 a second)
      2: { light: 255, low: 90, tics: 40, bright-tics: 20 }
    # The scroll room's scrollers, by tag (the tag plane, plane 4; see the scrollers notes in
    # pfwolf-pk3's gamepacks/wolf3d/game-info.yaml), in texels a tic. Stations 8 and 9 work them.
    scrollers:
      # The conveyor: its floor runs east
      6: { x: 2, walls: false, ceiling: false }
      # The waterfall and its diagonal corners: the walls run down, slowly until station 9
      7: { y: 1, floor: false, ceiling: false }
